<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Xem phân công công tác cá nhân - Bộ môn Phục hồi chức năng.">
    <title>Phân công của tôi - Bộ môn Phục hồi chức năng</title>
    
    <link rel="icon" href="images/logo_Bộ môn.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        main { max-width: 1200px; padding: 2rem 5% 4rem; margin: 0 auto; min-height: 70vh; }
        
        .page-header { text-align: center; margin-bottom: 2.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
        .page-header h2 { font-size: 1.8rem; color: var(--text-dark); margin-bottom: 5px; }
        .page-header p { color: var(--text-body); font-size: 1rem; margin-bottom: 15px; }

        .btn-declare { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background-color: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2); }
        .btn-declare:hover { background-color: #059669; transform: translateY(-2px); }

        /* Bảng Danh sách Nhiệm vụ */
        .task-section { margin-bottom: 3rem; }
        .task-section h3 { font-size: 1.25rem; color: var(--primary); margin-bottom: 1rem; border-left: 4px solid var(--primary); padding-left: 10px; }
        
        .task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
        
        /* Card Nhiệm vụ */
        .task-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1.5rem; box-shadow: var(--shadow-sm); transition: var(--transition); display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .task-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); border-color: var(--primary-light); }
        
        .task-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--primary); }
        
        /* Trạng thái Hôm nay */
        .task-card.today::before { background: #f59e0b; }
        .task-card.today .task-time { color: #ef4444; }

        /* Trạng thái Đã hoàn thành */
        .task-card.completed { opacity: 0.85; background-color: #f8fafc; }
        .task-card.completed::before { background: #10b981; }
        .task-card.completed .task-time { color: #10b981; }

        /* Trạng thái Tự khai báo */
        .task-card.self-declared { background-color: #f5f3ff; border-color: #ddd6fe; }
        .task-card.self-declared::before { background: #8b5cf6; }
        .task-card.self-declared .task-time { color: #8b5cf6; }
        
        .task-time { font-size: 0.95rem; font-weight: 700; color: #0ea5e9; margin-bottom: 8px; }
        .task-subject { font-size: 1.15rem; font-weight: 800; color: var(--text-dark); margin-bottom: 5px; line-height: 1.4; }
        .task-role { font-size: 0.9rem; color: var(--text-body); margin-bottom: 10px; font-weight: 500; }
        .task-room { font-size: 0.9rem; color: #b45309; margin-bottom: 15px; font-weight: bold; }
        .task-class { background: var(--bg-page); border: 1px solid var(--border); padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; color: var(--text-body); display: inline-block; width: fit-content; margin-bottom: auto; }

        .badge-completed { display: inline-block; margin-top: 15px; color: #10b981; font-weight: bold; font-size: 0.85rem; padding-top: 10px; border-top: 1px dashed var(--border); }

        /* Nút Tương tác */
        .task-actions { display: flex; gap: 10px; margin-top: 15px; padding-top: 15px; border-top: 1px dashed var(--border); }
        .btn-reject { flex: 1; background-color: white; color: #ef4444; border: 1px solid #ef4444; padding: 8px 10px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 0.9rem; }
        .btn-reject:hover { background-color: #fef2f2; }

        /* MODAL */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 2000; padding: 10px; }
        .modal-content { background: white; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); overflow: hidden; width: 100%; max-width: 450px;}
        .modal-header { padding: 15px 20px; color: white; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { margin: 0; font-size: 1.1rem; }
        .modal-body { padding: 20px; line-height: 1.8; color: var(--text-dark); font-size: 0.95rem; text-align: left; max-height: 75vh; overflow-y: auto; }

        /* Tùy chỉnh form input trong modal khai báo */
        .form-control { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid var(--border); font-family: inherit; font-size: 16px; outline: none; box-sizing: border-box; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2); }
        textarea.form-control { resize: vertical; min-height: 80px; }
        input[type="time"]::-webkit-calendar-picker-indicator { cursor: pointer; }

        /* Toast Thông báo */
        .toast-container { position: fixed; top: 80px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { min-width: 250px; background-color: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 12px; transform: translateX(120%); transition: 0.4s; font-weight: 600; border-left: 5px solid #22c55e; opacity: 0; pointer-events: auto; }
        .toast.show { transform: translateX(0); opacity: 1; }
        .toast.danger { border-left-color: #ef4444; }

        .empty-state { text-align: center; padding: 3rem; background: var(--bg-page); border-radius: var(--radius-md); color: var(--text-body); font-style: italic; border: 1px dashed var(--border); }
        
        #loadingScreen { text-align: center; padding: 5rem 0; color: var(--primary); font-weight: 600; font-size: 1.2rem; }

        @media (max-width: 768px) {
            #declareModal .modal-content { max-width: 100%; width: 95vw; border-radius: 12px; margin: 10px; }
            #declareForm .form-control { padding: 12px; font-size: 16px; } /* 16px chống zoom input iOS */
        }
    </style>
</head>
<body>

    <!-- GỌI HEADER CHUNG -->
    <div id="header-placeholder"></div>
    <div id="toastContainer" class="toast-container"></div>

    <main>
        <div class="page-header">
            <h2>LỊCH TRÌNH CÁ NHÂN</h2>
            <p>Theo dõi các nhiệm vụ giảng dạy và thực hành được giao</p>
            <button class="btn-declare" onclick="openDeclareModal()">Tự khai báo công tác</button>
        </div>

        <div id="loadingScreen"><i class="fas fa-spinner fa-spin fa-2x"></i><br><br>Đang tải dữ liệu phân công...</div>

        <div id="contentWrapper" class="hidden">
            <!-- Khu vực Nhiệm vụ Hôm nay -->
            <div class="task-section">
                <h3 style="color: #f59e0b; border-left-color: #f59e0b;">Lịch công tác Hôm nay</h3>
                <div id="todayGrid" class="task-grid">
                    <!-- Dữ liệu JS -->
                </div>
            </div>

            <!-- Khu vực Nhiệm vụ Sắp tới -->
            <div class="task-section">
                <h3 style="color: #0ea5e9; border-left-color: #0ea5e9;">Lịch công tác Sắp tới</h3>
                <div id="upcomingGrid" class="task-grid">
                    <!-- Dữ liệu JS -->
                </div>
            </div>

            <!-- Khu vực Nhiệm vụ Đã hoàn thành -->
            <div class="task-section">
                <h3 style="color: #10b981; border-left-color: #10b981;">Nhiệm vụ Đã hoàn thành</h3>
                <div id="completedGrid" class="task-grid">
                    <!-- Dữ liệu JS -->
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL XÁC NHẬN TỪ CHỐI / XÓA LỊCH (NHẬP MÃ 4 SỐ) -->
    <div id="rejectConfirmModal" class="modal-overlay hidden">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <div class="modal-header" style="background: #ef4444;">
                <h3 style="margin:0;"><i class="fas fa-exclamation-triangle"></i> Xác nhận hủy / từ chối</h3>
                <span style="cursor:pointer; font-size:1.2rem; font-weight:bold;" onclick="closeRejectModal()">✕</span>
            </div>
            <div class="modal-body" style="text-align: center;">
                <p style="font-size: 0.9rem; color: var(--text-body); margin-top: 0;">Nhiệm vụ:</p>
                <p id="rejectTaskTitlePreview" style="font-weight: 800; color: var(--text-dark); margin-bottom: 20px; font-size: 1.1rem; line-height: 1.4;"></p>
                
                <p style="font-size: 0.85rem; color: #ef4444; margin-bottom: 10px;">Để xác nhận xóa, vui lòng nhập mã bảo mật dưới đây:</p>
                <div id="randomRejectCodeDisplay" style="background: #fef2f2; padding: 10px; border-radius: 6px; font-size: 1.5rem; font-weight: bold; color: #ef4444; letter-spacing: 5px; margin-bottom: 15px;">0000</div>
                
                <input type="text" id="inputRejectCodeConfirm" placeholder="Nhập mã xác nhận..." style="text-align: center; letter-spacing: 2px; width: 100%; box-sizing: border-box; padding: 12px; border-radius: 6px; border: 1px solid var(--border); font-size: 1.1rem; outline: none;">
                
                <div style="margin-top: 20px;">
                    <button id="btnExecuteFinalReject" disabled style="width: 100%; padding: 12px; background: #ef4444; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s;">
                        Xác nhận xóa
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL TỰ KHAI BÁO CÔNG TÁC -->
    <div id="declareModal" class="modal-overlay hidden">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header" style="background: #10b981;">
                <h3 style="margin:0; font-size:1.1rem;">Khai báo công tác</h3>
                <span style="cursor:pointer; font-size:1.2rem; font-weight:bold;" onclick="closeDeclareModal()">✕</span>
            </div>
            <div class="modal-body">
                <form id="declareForm" onsubmit="submitDeclaration(event)">
                    
                    <div style="margin-bottom: 15px;">
                        <label style="display:block; margin-bottom:5px; font-weight:bold; color:var(--text-dark);">Ngày *</label>
                        <input type="date" id="decDate" class="form-control" required style="cursor: text;">
                    </div>

                    <div style="display:flex; gap:15px; margin-bottom: 15px;">
                        <div style="flex:1;">
                            <label style="display:block; margin-bottom:5px; font-weight:bold; color:var(--text-dark);">Bắt đầu *</label>
                            <input type="time" id="decStartTime" class="form-control" required lang="en-GB" style="cursor: text;">
                        </div>
                        <div style="flex:1;">
                            <label style="display:block; margin-bottom:5px; font-weight:bold; color:var(--text-dark);">Kết thúc *</label>
                            <input type="time" id="decEndTime" class="form-control" required lang="en-GB" style="cursor: text;">
                        </div>
                    </div>

                    <div style="margin-bottom: 15px;">
                        <label style="display:block; margin-bottom:5px; font-weight:bold; color:var(--text-dark);">Nội dung công việc *</label>
                        <input type="text" id="decTask" class="form-control" required>
                    </div>

                    <div style="margin-bottom: 15px;">
                        <label style="display:block; margin-bottom:5px; font-weight:bold; color:var(--text-dark);">Địa điểm</label>
                        <input type="text" id="decRoom" class="form-control">
                    </div>

                    <div style="margin-bottom: 20px;">
                        <label style="display:block; margin-bottom:5px; font-weight:bold; color:var(--text-dark);">Ghi chú thêm</label>
                        <textarea id="decNote" class="form-control"></textarea>
                    </div>

                    <button type="submit" style="width:100%; padding:12px; background:#10b981; color:white; border:none; border-radius:6px; font-weight:bold; font-size:1.05rem; cursor:pointer; transition:0.2s;">
                        Lưu thông tin khai báo
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="js/layout.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, getDocs, doc, getDoc, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDVT4akTw65Uj6KHymwWtQ9xyHVyfTlXIY", authDomain: "bmphcn-aa9c6.firebaseapp.com", projectId: "bmphcn-aa9c6", storageBucket: "bmphcn-aa9c6.firebasestorage.app", messagingSenderId: "749494392719", appId: "1:749494392719:web:f220c751ff541620045dfa" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let myEvents = [];

        // Thông tin người dùng
        let currentUserEmail = '';
        let currentUserName = ''; // Lưu tên thật không kèm học vị

        // Hàm bỏ học vị để so sánh cho chính xác tuyệt đối
        const normalizeName = (n) => {
            if(!n) return '';
            return n.replace(/ThS\.|TS\.|PGS\.|GS\./gi, '').trim().toLowerCase();
        };

        // Hàm cắt số thứ tự của tên môn (ví dụ: "1. Phục hồi" -> "Phục hồi")
        window.getCleanSubjectName = (name) => {
            if (!name) return "";
            let parts = name.split('.');
            if (parts.length > 1 && !isNaN(parts[0].trim())) {
                return parts.slice(1).join('.').trim();
            }
            return name.trim();
        };

        window.showToast = (message, type = 'success') => {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            let icon = type === 'danger' ? 'fa-exclamation-triangle' : 'fa-check-circle';
            toast.innerHTML = `<i class="fas ${icon}" style="font-size: 1.2rem; color: ${type==='danger'?'#ef4444':'#22c55e'};"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3000);
        };

        // ĐỊNH DẠNG HIỂN THỊ THỜI GIAN
        function formatTaskTime(startStr, endStr) {
            if (!startStr) return { isToday: false, isPast: false, timeText: 'Chưa xác định' };
            
            const startDate = new Date(startStr);
            const endDate = endStr ? new Date(endStr) : new Date(startDate.getTime() + 4 * 3600000); 
            
            const timeOpts = { hour: '2-digit', minute: '2-digit', hour12: false };
            const sTime = startDate.toLocaleTimeString('vi-VN', timeOpts);
            const eTime = endDate.toLocaleTimeString('vi-VN', timeOpts);
            const dString = startDate.toLocaleDateString('vi-VN', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
            
            let today = new Date();
            today.setHours(0,0,0,0);
            let checkDate = new Date(startDate);
            checkDate.setHours(0,0,0,0);

            return {
                isToday: today.getTime() === checkDate.getTime(),
                isPast: endDate < new Date(),
                timeText: `${sTime} - ${eTime} | ${dString}`,
                rawDate: startDate
            };
        }

        // BẮT ĐẦU QUY TRÌNH KIỂM TRA ĐĂNG NHẬP
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // KIỂM TRA QUYỀN TRUY CẬP: CHẶN HỌC VIÊN
                if (user.email.toLowerCase() === 'ths.phcn26@ump.edu.vn') {
                    alert("Tài khoản học viên không có quyền truy cập trang này!");
                    window.location.href = "thoi-khoa-bieu.html";
                    return; 
                }

                currentUserEmail = user.email;

                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists()) {
                        const data = userDoc.data();
                        // Chỉ lấy tên thật, bỏ hoàn toàn Prefix học vị để so khớp cho chuẩn
                        currentUserName = data.fullName; 
                        
                        listenToMySchedules();
                    } else {
                        window.location.href = "login.html"; 
                    }
                } catch (e) {
                    console.error("Lỗi lấy thông tin User", e);
                }
            } else {
                window.location.href = "login.html"; 
            }
        });

        // TẢI & LỌC DỮ LIỆU CỦA RIÊNG MÌNH TỪ BẢNG CALENDAR_EVENTS
        function listenToMySchedules() {
            onSnapshot(collection(db, "calendar_events"), (snapshot) => {
                myEvents = [];
                let myNormName = normalizeName(currentUserName);

                snapshot.forEach(doc => { 
                    const data = doc.data();
                    data.id = doc.id; 
                    
                    if (data.status !== 'returned' && data.gv && myNormName) {
                        // Tách tên các GV trong sự kiện và đối chiếu
                        let gvNames = data.gv.split(/,|&/).map(s => normalizeName(s));
                        if (gvNames.includes(myNormName)) {
                            myEvents.push(data);
                        }
                    }
                });
                renderTasks();
            });
        }

        // PHÂN LOẠI VÀ HIỂN THỊ RA MÀN HÌNH
        function renderTasks() {
            document.getElementById('loadingScreen').classList.add('hidden');
            document.getElementById('contentWrapper').classList.remove('hidden');

            const todayGrid = document.getElementById('todayGrid');
            const upcomingGrid = document.getElementById('upcomingGrid');
            const completedGrid = document.getElementById('completedGrid');
            
            todayGrid.innerHTML = '';
            upcomingGrid.innerHTML = '';
            completedGrid.innerHTML = '';

            let todayCount = 0;
            let upcomingCount = 0;
            let completedCount = 0;

            myEvents.sort((a, b) => new Date(a.start) - new Date(b.start));

            myEvents.forEach(evt => {
                const timeInfo = formatTaskTime(evt.start, evt.end);
                const isSelfDeclared = evt.type === 'self_declared';
                
                let category = '';
                if (timeInfo.isToday) category = 'today';
                else if (timeInfo.isPast) category = 'completed';
                else category = 'upcoming';

                let badgeHtml = '';
                let actionHtml = '';
                let extraClass = isSelfDeclared ? 'self-declared' : '';

                if (category === 'completed') {
                    badgeHtml = `<div class="badge-completed"><i class="fas fa-check-circle"></i> Đã hoàn thành</div>`;
                }

                if (category !== 'completed') {
                    let btnText = isSelfDeclared ? 'Xóa khai báo này' : 'Từ chối nhiệm vụ';
                    actionHtml = `
                        <div class="task-actions">
                            <button class="btn-reject" onclick="openRejectModal('${evt.id}', '${encodeURIComponent(isSelfDeclared ? evt.task : evt.subject)}')">
                                <i class="fas fa-times"></i> ${btnText}
                            </button>
                        </div>
                    `;
                }

                let clsName = evt.class || 'Chưa XĐ';
                let subjectTitle = isSelfDeclared ? `<i class="fas fa-user-edit"></i> Lịch Bận: ${evt.task}` : window.getCleanSubjectName(evt.subject);
                let taskText = isSelfDeclared && evt.note ? `Ghi chú: ${evt.note}` : `Nhiệm vụ: ${evt.task || 'Giảng dạy'}`;
                
                // Hiển thị định hướng và ngành (giống TKB)
                let orientTag = '';
                if (!isSelfDeclared && evt.orientation) {
                    orientTag = `<span style="font-size: 0.8rem; font-weight: bold; color: #b45309; border: 1px solid #fde047; background: #fef08a; padding: 2px 6px; border-radius: 4px; margin-left: 5px;">${evt.orientation}</span>`;
                }

                const cardHtml = `
                    <div class="task-card ${category} ${extraClass}">
                        <div class="task-time"><i class="far fa-clock"></i> ${timeInfo.timeText}</div>
                        <div class="task-subject">${subjectTitle}</div>
                        <div class="task-role">${taskText}</div>
                        <div class="task-room"><i class="fas fa-map-marker-alt"></i> Địa điểm: ${evt.room || 'Chưa xác định'}</div>
                        <div style="display:flex; align-items:center; flex-wrap:wrap; gap:5px; margin-bottom:auto;">
                            ${!isSelfDeclared ? `<div class="task-class"><i class="fas fa-users"></i> ${clsName}</div>` : ''}
                            ${orientTag}
                        </div>
                        ${badgeHtml}
                        ${actionHtml}
                    </div>
                `;

                if (category === 'today') {
                    todayGrid.innerHTML += cardHtml;
                    todayCount++;
                } else if (category === 'upcoming') {
                    upcomingGrid.innerHTML += cardHtml;
                    upcomingCount++;
                } else {
                    completedGrid.insertAdjacentHTML('afterbegin', cardHtml);
                    completedCount++;
                }
            });

            if (todayCount === 0) {
                todayGrid.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;">Hôm nay bạn không có lịch công tác nào.</div>`;
            }
            if (upcomingCount === 0) {
                upcomingGrid.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;">Bạn chưa có lịch phân công sắp tới.</div>`;
            }
            if (completedCount === 0) {
                completedGrid.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;">Bạn chưa có nhiệm vụ nào đã hoàn thành.</div>`;
            }
        }


        // ========================================================
        // TÍNH NĂNG TỪ CHỐI / HỦY NHIỆM VỤ (VỚI MÃ XÁC NHẬN 4 SỐ)
        // ========================================================
        let targetRejectId = null;
        let rejectSecurityCode = "";

        window.openRejectModal = (id, encodedTitle) => {
            targetRejectId = id;
            rejectSecurityCode = Math.floor(1000 + Math.random() * 9000).toString();
            
            document.getElementById('rejectTaskTitlePreview').innerText = decodeURIComponent(encodedTitle);
            document.getElementById('randomRejectCodeDisplay').innerText = rejectSecurityCode;
            document.getElementById('inputRejectCodeConfirm').value = '';
            document.getElementById('btnExecuteFinalReject').disabled = true;
            document.getElementById('btnExecuteFinalReject').style.opacity = "0.5";
            document.getElementById('rejectConfirmModal').classList.remove('hidden');
        };

        window.closeRejectModal = () => {
            document.getElementById('rejectConfirmModal').classList.add('hidden');
            targetRejectId = null;
        };

        document.getElementById('inputRejectCodeConfirm').addEventListener('input', (e) => {
            const btn = document.getElementById('btnExecuteFinalReject');
            if (e.target.value.trim() === rejectSecurityCode) {
                btn.disabled = false;
                btn.style.opacity = "1";
            } else {
                btn.disabled = true;
                btn.style.opacity = "0.5";
            }
        });

        document.getElementById('btnExecuteFinalReject').addEventListener('click', async () => {
            if (!targetRejectId) return;
            try {
                // Xóa thẻ khỏi bảng (hoặc cập nhật status thành returned nếu cần logic Admin)
                // Ở đây dùng deleteDoc thẳng để giống chức năng Xóa của Tự Khai báo / Từ chối
                await deleteDoc(doc(db, "calendar_events", targetRejectId));
                showToast("Đã hủy nhiệm vụ thành công!");
                closeRejectModal();
            } catch(e) {
                console.error("Lỗi khi hủy:", e);
                showToast("Lỗi: " + e.message, "danger");
            }
        });


        // ========================================================
        // TÍNH NĂNG TỰ KHAI BÁO CÔNG TÁC
        // ========================================================
        window.openDeclareModal = () => {
            document.getElementById('declareForm').reset();
            
            let d = new Date();
            let month = '' + (d.getMonth() + 1), day = '' + d.getDate(), year = d.getFullYear();
            if (month.length < 2) month = '0' + month;
            if (day.length < 2) day = '0' + day;
            document.getElementById('decDate').value = [year, month, day].join('-');
            
            document.getElementById('declareModal').classList.remove('hidden');
        };

        window.closeDeclareModal = () => {
            document.getElementById('declareModal').classList.add('hidden');
        };

        window.submitDeclaration = async (e) => {
            e.preventDefault();
            const date = document.getElementById('decDate').value;
            const startT = document.getElementById('decStartTime').value;
            const endT = document.getElementById('decEndTime').value;
            const task = document.getElementById('decTask').value.trim();
            const room = document.getElementById('decRoom').value.trim();
            const note = document.getElementById('decNote').value.trim();

            if (!date || !startT || !endT || !task) {
                showToast("Vui lòng điền đầy đủ các mục bắt buộc!", "danger");
                return;
            }

            if (startT >= endT) {
                showToast("Giờ kết thúc phải sau giờ bắt đầu!", "danger");
                return;
            }

            const startStr = `${date}T${startT}:00`;
            const endStr = `${date}T${endT}:00`;

            const evData = {
                title: task,
                subject: "Công tác khác", 
                gv: currentUserName, // Khai báo bằng tên thật (đã bỏ học vị)
                start: startStr,
                end: endStr,
                task: task,
                room: room || 'Không xác định',
                class: "Khai báo",
                orientation: "Chung",
                note: note, 
                scheduledByEmail: currentUserEmail,
                scheduledByName: currentUserName,
                status: 'scheduled',
                type: 'self_declared' 
            };

            try {
                await addDoc(collection(db, "calendar_events"), evData);
                showToast("Đã khai báo công tác thành công!");
                closeDeclareModal();
            } catch (err) {
                console.error(err);
                showToast("Lỗi khi lưu khai báo: " + err.message, "danger");
            }
        };

    </script>
</body>
</html>
