<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="description"
        content="Thông tin chi tiết Giảng viên - Bộ môn Phục hồi chức năng.">

    <title>Hồ sơ Giảng viên - Bộ môn PHCN</title>

    <link rel="icon"
        href="images/logo_Bộ môn.png"
        type="image/png">

    <link rel="stylesheet"
        href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            margin: 0;
        }

        main {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .cv-wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 280px minmax(0, 1fr);
            gap: 30px;
            align-items: start;
        }

        .cv-sidebar,
        .cv-main {
            min-width: 0;
            width: 100%;
        }

        .cv-sidebar {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
        }

        .cv-avatar-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .cv-avatar {
            width: 180px;
            height: 180px;
            max-width: 100%;
            border-radius: 50%;
            background: #f1f5f9;
            border: 4px solid #fff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            color: #94a3b8;
            font-size: 4rem;
        }

        .cv-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cv-avatar.editable {
            cursor: pointer;
        }

        .cv-avatar-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .cv-avatar.editable:hover .cv-avatar-overlay {
            opacity: 1;
        }

        #avatarNote {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #64748b;
            line-height: 1.4;
        }

        .hidden {
            display: none !important;
        }

        .cv-main {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
        }

        .cv-header {
            margin-bottom: 25px;
        }

        .cv-name {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.2;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .cv-position {
            margin-top: 8px;
            color: #64748b;
            overflow-wrap: anywhere;
        }

        .cv-email {
            margin-top: 8px;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .major-badge {
            display: inline-block;
            margin-top: 12px;
            max-width: 100%;
            padding: 7px 12px;
            border-radius: 999px;
            font-size: 0.9rem;
            line-height: 1.3;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .major-vltl {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .major-hdtl {
            background: #dcfce7;
            color: #15803d;
        }

        .major-ngonngu {
            background: #fef3c7;
            color: #b45309;
        }

        .major-default {
            background: #f1f5f9;
            color: #475569;
        }

        /* =========================
           CV TABS
        ========================= */

        .cv-tabs {
            width: 100%;
            max-width: 100%;
            min-width: 0;

            display: flex;
            gap: 10px;

            border-bottom: 2px solid var(--border);
            margin-bottom: 25px;

            position: relative;
            z-index: 1;

            flex-wrap: nowrap;

            overflow-x: auto;
            overflow-y: hidden;

            -webkit-overflow-scrolling: touch;

            scrollbar-width: thin;
            scrollbar-color: #94a3b8 transparent;
        }

        .cv-tabs::-webkit-scrollbar {
            height: 5px;
        }

        .cv-tabs::-webkit-scrollbar-track {
            background: transparent;
        }

        .cv-tabs::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 10px;
        }

        .cv-tabs::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        .cv-tab-btn {
            flex: 0 0 auto;
            white-space: nowrap;

            border: none;
            background: transparent;

            padding: 12px 16px;

            font-size: 0.95rem;
            font-weight: 600;

            color: #64748b;

            cursor: pointer;

            border-bottom: 3px solid transparent;

            margin-bottom: -2px;

            transition:
                color 0.2s ease,
                border-color 0.2s ease;
        }

        .cv-tab-btn:hover {
            color: #2563eb;
        }

        .cv-tab-btn.active {
            color: #2563eb;
            border-bottom-color: #2563eb;
        }

        .cv-content {
            width: 100%;
            min-width: 0;
        }

        .cv-tab-content {
            display: none;
            width: 100%;
            min-width: 0;
        }

        .cv-tab-content.active {
            display: block;
        }

        .cv-section {
            margin-bottom: 25px;
        }

        .cv-section-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #1e293b;
        }

        .cv-item {
            border-left: 3px solid #2563eb;
            padding: 10px 0 10px 18px;
            margin-bottom: 15px;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .cv-item-title {
            font-weight: 700;
            color: #1e293b;
        }

        .cv-item-subtitle {
            color: #64748b;
            margin-top: 4px;
        }

        .cv-item-description {
            margin-top: 8px;
            line-height: 1.6;
            color: #475569;
            white-space: pre-line;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .empty-state {
            padding: 30px 15px;
            text-align: center;
            color: #94a3b8;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }

        .error-state {
            text-align: center;
            padding: 60px 20px;
            color: #dc2626;
        }

        .cv-edit-button {
            margin-top: 20px;
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            background: #2563eb;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
        }

        .cv-edit-button:hover {
            background: #1d4ed8;
        }

        /* =========================
           TOAST
        ========================= */

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 99999;

            display: flex;
            flex-direction: column;
            gap: 10px;

            max-width: calc(100vw - 40px);
        }

        .toast {
            padding: 12px 16px;
            border-radius: 8px;
            background: #16a34a;
            color: #fff;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);

            font-size: 0.9rem;

            animation: toastIn 0.25s ease;
        }

        .toast.danger {
            background: #dc2626;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           MODAL
        ========================= */

        .edit-modal {
            position: fixed;
            inset: 0;

            background: rgba(15, 23, 42, 0.55);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            z-index: 9999;
        }

        .edit-modal.hidden {
            display: none;
        }

        .edit-modal-content {
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;

            background: #fff;
            border-radius: 16px;

            padding: 25px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .edit-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }

        .edit-modal-header h2 {
            margin: 0;
        }

        .close-modal {
            border: none;
            background: transparent;
            font-size: 1.5rem;
            cursor: pointer;
            color: #64748b;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #334155;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 12px;

            border: 1px solid #cbd5e1;
            border-radius: 8px;

            font-family: inherit;
            font-size: 0.95rem;

            outline: none;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #2563eb;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;

            margin-top: 20px;
        }

        .modal-button {
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: 600;
        }

        .modal-button.cancel {
            background: #e2e8f0;
            color: #334155;
        }

        .modal-button.save {
            background: #2563eb;
            color: #fff;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {

            main {
                padding: 20px 12px;
            }

            .cv-wrapper {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .cv-sidebar {
                padding: 20px;
            }

            .cv-main {
                padding: 20px 15px;
            }

            .cv-avatar {
                width: 150px;
                height: 150px;
            }

            .cv-name {
                font-size: 1.5rem;
            }

            .cv-tabs {
                gap: 5px;
                margin-bottom: 20px;
            }

            .cv-tab-btn {
                padding: 10px 12px;
                font-size: 0.85rem;
            }

            .toast-container {
                top: 10px;
                right: 10px;
                left: 10px;
                max-width: none;
            }

            .toast {
                width: 100%;
            }
        }

    </style>
</head>

<body>

    <div id="header-placeholder"></div>

    <div id="toastContainer" class="toast-container"></div>

    <main>

        <!-- LOADING -->

        <div id="loadingState" class="loading">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Đang tải thông tin giảng viên...</p>
        </div>


        <!-- ERROR -->

        <div id="errorState" class="error-state hidden">
            <i class="fas fa-circle-exclamation"></i>
            <p id="errorMessage">Không thể tải thông tin giảng viên.</p>
        </div>


        <!-- PROFILE -->

        <div id="cvWrapper" class="cv-wrapper hidden">

            <!-- =========================
                 SIDEBAR
            ========================== -->

            <aside class="cv-sidebar">

                <div class="cv-avatar-container">

                    <div
                        class="cv-avatar"
                        id="displayAvatar"
                        onclick="triggerAvatarUpload()">

                        <i class="fas fa-user"></i>

                    </div>

                    <!-- INPUT UPLOAD -->

                    <input
                        type="file"
                        id="uploadAvatar"
                        accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
                        style="display:none;">

                    <div
                        id="avatarNote"
                        class="hidden">

                        Nhấn vào ảnh để thay đổi.
                        Ảnh JPG, PNG hoặc WEBP, tối đa 3MB.

                    </div>

                </div>


                <div class="cv-header">

                    <div
                        class="cv-name"
                        id="displayName">
                    </div>

                    <div
                        class="cv-position"
                        id="displayPosition">
                    </div>

                    <div
                        class="cv-email"
                        id="displayEmail">
                    </div>

                    <div
                        id="displayMajor">
                    </div>

                </div>

            </aside>


            <!-- =========================
                 MAIN CV
            ========================== -->

            <section class="cv-main">

                <!-- TABS -->

                <div class="cv-tabs">

                    <button
                        class="cv-tab-btn active"
                        data-tab="education"
                        onclick="switchCvTab('education')">

                        Quá trình đào tạo

                    </button>

                    <button
                        class="cv-tab-btn"
                        data-tab="experience"
                        onclick="switchCvTab('experience')">

                        Quá trình công tác

                    </button>

                    <button
                        class="cv-tab-btn"
                        data-tab="research"
                        onclick="switchCvTab('research')">

                        Nghiên cứu khoa học

                    </button>

                </div>


                <div class="cv-content">

                    <!-- EDUCATION -->

                    <div
                        id="tab-education"
                        class="cv-tab-content active">

                        <div
                            id="educationContent">
                        </div>

                    </div>


                    <!-- EXPERIENCE -->

                    <div
                        id="tab-experience"
                        class="cv-tab-content">

                        <div
                            id="experienceContent">
                        </div>

                    </div>


                    <!-- RESEARCH -->

                    <div
                        id="tab-research"
                        class="cv-tab-content">

                        <div
                            id="researchContent">
                        </div>

                    </div>

                </div>


                <!-- EDIT BUTTON -->

                <div id="editButtonContainer"></div>

            </section>

        </div>

    </main>


    <!-- =========================
         EDIT MODAL
    ========================== -->

    <div
        id="editModal"
        class="edit-modal hidden">

        <div class="edit-modal-content">

            <div class="edit-modal-header">

                <h2>Chỉnh sửa hồ sơ</h2>

                <button
                    class="close-modal"
                    onclick="closeEditModal()">

                    <i class="fas fa-times"></i>

                </button>

            </div>


            <div class="form-group">

                <label for="editName">
                    Họ và tên
                </label>

                <input
                    type="text"
                    id="editName">

            </div>


            <div class="form-group">

                <label for="editPosition">
                    Chức vụ
                </label>

                <input
                    type="text"
                    id="editPosition">

            </div>


            <div class="form-group">

                <label for="editEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="editEmail">

            </div>


            <div class="form-group">

                <label for="editMajor">
                    Chuyên ngành
                </label>

                <input
                    type="text"
                    id="editMajor">

            </div>


            <div class="form-group">

                <label for="editEducation">
                    Quá trình đào tạo
                </label>

                <textarea
                    id="editEducation"></textarea>

            </div>


            <div class="form-group">

                <label for="editExperience">
                    Quá trình công tác
                </label>

                <textarea
                    id="editExperience"></textarea>

            </div>


            <div class="form-group">

                <label for="editResearch">
                    Nghiên cứu khoa học
                </label>

                <textarea
                    id="editResearch"></textarea>

            </div>


            <div class="modal-actions">

                <button
                    class="modal-button cancel"
                    onclick="closeEditModal()">

                    Hủy

                </button>

                <button
                    class="modal-button save"
                    onclick="saveProfile()">

                    Lưu thay đổi

                </button>

            </div>

        </div>

    </div>


    <!-- LAYOUT -->

    <script src="js/layout.js"></script>


    <!-- FIREBASE -->

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";


        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";


        import {
            getFirestore,
            doc,
            getDoc,
            updateDoc
        } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";


        /* =========================================
           FIREBASE CONFIG
        ========================================= */

        const firebaseConfig = {

            apiKey:
                "AIzaSyDVT4akTw65Uj6KHymwWtQ9xyHVyfTlXIY",

            authDomain:
                "bmphcn-aa9c6.firebaseapp.com",

            projectId:
                "bmphcn-aa9c6",

            storageBucket:
                "bmphcn-aa9c6.firebasestorage.app",

            messagingSenderId:
                "749494392719",

            appId:
                "1:749494392719:web:f220c751ff541620045dfa"

        };


        const app =
            initializeApp(firebaseConfig);


        const auth =
            getAuth(app);


        const db =
            getFirestore(app);


        /* =========================================
           GLOBAL VARIABLES
        ========================================= */

        let targetUid = null;

        let isHasPermissionToEdit = false;

        let currentProfileData = {};

        let currentUser = null;


        /* =========================================
           PERMISSION
        ========================================= */

        const ADMIN_EMAIL =
            "hoangtran1483@gmail.com";

        const BLOCKED_EMAIL =
            "ths.phcn26@ump.edu.vn";


        function checkEditPermission(user) {

            if (!user) {
                return false;
            }

            if (user.email === BLOCKED_EMAIL) {
                return false;
            }

            return (
                user.uid === targetUid ||
                user.email === ADMIN_EMAIL
            );
        }


        /* =========================================
           TOAST
        ========================================= */

        function showToast(
            message,
            type = "success"
        ) {

            const container =
                document.getElementById(
                    "toastContainer"
                );

            const toast =
                document.createElement("div");

            toast.className =
                `toast ${type === "danger" ? "danger" : ""}`;

            toast.textContent =
                message;

            container.appendChild(toast);

            setTimeout(() => {

                toast.remove();

            }, 3500);
        }


        /* =========================================
           SWITCH TAB
        ========================================= */

        window.switchCvTab = function(tabName) {

            document
                .querySelectorAll(".cv-tab-btn")
                .forEach(button => {

                    button.classList.toggle(
                        "active",
                        button.dataset.tab === tabName
                    );

                });


            document
                .querySelectorAll(".cv-tab-content")
                .forEach(content => {

                    content.classList.toggle(
                        "active",
                        content.id === `tab-${tabName}`
                    );

                });

        };


        /* =========================================
           OTHER INPUT
        ========================================= */

        window.toggleOtherInput = function(
            checkbox,
            inputId
        ) {

            const input =
                document.getElementById(inputId);

            if (!input) return;

            input.classList.toggle(
                "hidden",
                !checkbox.checked
            );

        };


        /* =========================================
           DEGREE
        ========================================= */

        function formatDegree(value) {

            if (!value) return "";

            const degreeMap = {

                "ths":
                    "Thạc sĩ",

                "thac_si":
                    "Thạc sĩ",

                "ts":
                    "Tiến sĩ",

                "tien_si":
                    "Tiến sĩ",

                "bs":
                    "Bác sĩ",

                "bac_si":
                    "Bác sĩ",

                "cn":
                    "Cử nhân",

                "cu_nhan":
                    "Cử nhân"

            };

            const key =
                String(value)
                    .toLowerCase()
                    .trim();

            return degreeMap[key] || value;

        }


        /* =========================================
           MAJOR CLASS
        ========================================= */

        function getMajorClass(major) {

            const value =
                String(major || "")
                    .toLowerCase();

            if (
                value.includes("vật lý trị liệu") ||
                value.includes("vật lý trị liệu")
            ) {

                return "major-vltl";

            }

            if (
                value.includes("hoạt động trị liệu")
            ) {

                return "major-hdtl";

            }

            if (
                value.includes("ngôn ngữ trị liệu")
            ) {

                return "major-ngonngu";

            }

            return "major-default";

        }


        /* =========================================
           ESCAPE HTML
        ========================================= */

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =========================================
           NORMALIZE ARRAY
        ========================================= */

        function normalizeArray(value) {

            if (Array.isArray(value)) {
                return value;
            }

            if (!value) {
                return [];
            }

            if (typeof value === "string") {

                return value
                    .split("\n")
                    .map(item => item.trim())
                    .filter(Boolean);

            }

            return [];

        }


        /* =========================================
           RENDER LIST
        ========================================= */

        function renderCvList(
            items,
            emptyText = "Chưa có thông tin."
        ) {

            const list =
                normalizeArray(items);


            if (!list.length) {

                return `
                    <div class="empty-state">
                        ${escapeHtml(emptyText)}
                    </div>
                `;

            }


            return list.map(item => {

                if (
                    typeof item === "string"
                ) {

                    return `
                        <div class="cv-item">
                            <div class="cv-item-description">
                                ${escapeHtml(item)}
                            </div>
                        </div>
                    `;

                }


                const title =
                    item.title ||
                    item.name ||
                    item.degree ||
                    "";


                const subtitle =
                    item.subtitle ||
                    item.school ||
                    item.organization ||
                    item.place ||
                    "";


                const description =
                    item.description ||
                    item.content ||
                    item.details ||
                    "";


                return `
                    <div class="cv-item">

                        ${
                            title
                                ? `
                                <div class="cv-item-title">
                                    ${escapeHtml(title)}
                                </div>
                                `
                                : ""
                        }

                        ${
                            subtitle
                                ? `
                                <div class="cv-item-subtitle">
                                    ${escapeHtml(subtitle)}
                                </div>
                                `
                                : ""
                        }

                        ${
                            description
                                ? `
                                <div class="cv-item-description">
                                    ${escapeHtml(description)}
                                </div>
                                `
                                : ""
                        }

                    </div>
                `;

            }).join("");

        }


        /* =========================================
           RENDER PROFILE
        ========================================= */

        function renderProfileCV(data) {

            currentProfileData = data || {};


            /* ---------- LOADING ---------- */

            document
                .getElementById("loadingState")
                .classList.add("hidden");


            document
                .getElementById("errorState")
                .classList.add("hidden");


            document
                .getElementById("cvWrapper")
                .classList.remove("hidden");


            /* ---------- BASIC INFO ---------- */

            const name =
                data.name ||
                data.displayName ||
                data.fullName ||
                "Chưa cập nhật";


            const position =
                data.position ||
                data.chucVu ||
                "Giảng viên";


            const email =
                data.email ||
                "";


            const major =
                data.major ||
                data.specialty ||
                data.chuyenNganh ||
                "";


            document
                .getElementById("displayName")
                .textContent = name;


            document
                .getElementById("displayPosition")
                .textContent = position;


            document
                .getElementById("displayEmail")
                .textContent = email;


            /* ---------- MAJOR ---------- */

            const majorElement =
                document.getElementById(
                    "displayMajor"
                );


            if (major) {

                majorElement.innerHTML = `
                    <span class="major-badge ${getMajorClass(major)}">
                        ${escapeHtml(major)}
                    </span>
                `;

            } else {

                majorElement.innerHTML = "";

            }


            /* ---------- AVATAR ---------- */

            const avatar =
                document.getElementById(
                    "displayAvatar"
                );


            avatar.classList.remove(
                "editable"
            );


            const avatarNote =
                document.getElementById(
                    "avatarNote"
                );


            if (isHasPermissionToEdit) {

                avatar.classList.add(
                    "editable"
                );

                avatarNote.classList.remove(
                    "hidden"
                );

            } else {

                avatarNote.classList.add(
                    "hidden"
                );

            }


            let overlayHtml = "";


            if (isHasPermissionToEdit) {

                overlayHtml = `
                    <div class="cv-avatar-overlay">
                        <span style="
                            font-size:1.1rem;
                            font-weight:bold;
                        ">
                            Thay ảnh
                        </span>
                    </div>
                `;

            }


            if (data.avatar) {

                avatar.innerHTML = `

                    <img
                        src="${escapeHtml(data.avatar)}"
                        alt="Ảnh đại diện"
                    >

                    ${overlayHtml}

                `;

            } else {

                avatar.innerHTML = `

                    <i class="fas fa-user"></i>

                    ${overlayHtml}

                `;

            }


            /* ---------- EDUCATION ---------- */

            const education =
                data.education ||
                data.educations ||
                data.quaTrinhDaoTao ||
                [];


            document
                .getElementById(
                    "educationContent"
                )
                .innerHTML =
                renderCvList(
                    education,
                    "Chưa có thông tin quá trình đào tạo."
                );


            /* ---------- EXPERIENCE ---------- */

            const experience =
                data.experience ||
                data.experiences ||
                data.quaTrinhCongTac ||
                [];


            document
                .getElementById(
                    "experienceContent"
                )
                .innerHTML =
                renderCvList(
                    experience,
                    "Chưa có thông tin quá trình công tác."
                );


            /* ---------- RESEARCH ---------- */

            const research =
                data.research ||
                data.researches ||
                data.nghienCuuKhoaHoc ||
                [];


            document
                .getElementById(
                    "researchContent"
                )
                .innerHTML =
                renderCvList(
                    research,
                    "Chưa có thông tin nghiên cứu khoa học."
                );


            /* ---------- EDIT BUTTON ---------- */

            const editContainer =
                document.getElementById(
                    "editButtonContainer"
                );


            if (isHasPermissionToEdit) {

                editContainer.innerHTML = `

                    <button
                        class="cv-edit-button"
                        onclick="openEditModal()">

                        <i class="fas fa-pen"></i>
                        Chỉnh sửa thông tin

                    </button>

                `;

            } else {

                editContainer.innerHTML = "";

            }

        }


        /* =========================================
           LOAD PROFILE
        ========================================= */

        async function loadProfile(uid) {

            try {

                const profileRef =
                    doc(
                        db,
                        "users",
                        uid
                    );


                const snapshot =
                    await getDoc(profileRef);


                if (!snapshot.exists()) {

                    throw new Error(
                        "Không tìm thấy hồ sơ giảng viên."
                    );

                }


                const data =
                    snapshot.data();


                renderProfileCV(data);


            } catch (error) {

                console.error(
                    "Lỗi tải hồ sơ:",
                    error
                );


                document
                    .getElementById(
                        "loadingState"
                    )
                    .classList.add("hidden");


                document
                    .getElementById(
                        "cvWrapper"
                    )
                    .classList.add("hidden");


                document
                    .getElementById(
                        "errorState"
                    )
                    .classList.remove("hidden");


                document
                    .getElementById(
                        "errorMessage"
                    )
                    .textContent =
                    error.message ||
                    "Không thể tải thông tin giảng viên.";

            }

        }


        /* =========================================
           AUTH STATE
        ========================================= */

        onAuthStateChanged(
            auth,
            async user => {

                currentUser = user;


                /*
                 * Lấy UID từ URL
                 *
                 * Ví dụ:
                 * profile.html?uid=xxxxxxxx
                 */

                const params =
                    new URLSearchParams(
                        window.location.search
                    );


                targetUid =
                    params.get("uid");


                /*
                 * Nếu không có UID trong URL
                 * thì hiển thị hồ sơ của user hiện tại
                 */

                if (!targetUid && user) {

                    targetUid =
                        user.uid;

                }


                if (!targetUid) {

                    document
                        .getElementById(
                            "loadingState"
                        )
                        .classList.add("hidden");


                    document
                        .getElementById(
                            "errorState"
                        )
                        .classList.remove("hidden");


                    document
                        .getElementById(
                            "errorMessage"
                        )
                        .textContent =
                        "Không xác định được hồ sơ giảng viên.";

                    return;

                }


                isHasPermissionToEdit =
                    checkEditPermission(user);


                await loadProfile(
                    targetUid
                );

            }
        );


        /* =========================================
           TRIGGER AVATAR UPLOAD
        ========================================= */

        window.triggerAvatarUpload =
            function() {

                if (!isHasPermissionToEdit) {

                    return;

                }


                const input =
                    document.getElementById(
                        "uploadAvatar"
                    );


                if (input) {

                    input.click();

                }

            };


        /* =========================================
           FILE READER
        ========================================= */

        function readFileAsDataURL(file) {

            return new Promise(
                (resolve, reject) => {

                    const reader =
                        new FileReader();


                    reader.onload =
                        () => resolve(
                            reader.result
                        );


                    reader.onerror =
                        () => reject(
                            new Error(
                                "Không thể đọc file ảnh."
                            )
                        );


                    reader.readAsDataURL(
                        file
                    );

                }
            );

        }


        /* =========================================
           LOAD IMAGE
        ========================================= */

        function loadImage(src) {

            return new Promise(
                (resolve, reject) => {

                    const img =
                        new Image();


                    img.onload =
                        () => resolve(img);


                    img.onerror =
                        () => reject(
                            new Error(
                                "File không phải ảnh hợp lệ."
                            )
                        );


                    img.src = src;

                }
            );

        }


        /* =========================================
           RESIZE + CROP AVATAR
        ========================================= */

        async function processAvatar(
            file
        ) {

            const dataUrl =
                await readFileAsDataURL(
                    file
                );


            const img =
                await loadImage(
                    dataUrl
                );


            const canvas =
                document.createElement(
                    "canvas"
                );


            const ctx =
                canvas.getContext(
                    "2d"
                );


            if (!ctx) {

                throw new Error(
                    "Trình duyệt không hỗ trợ Canvas."
                );

            }


            const size = 250;


            canvas.width =
                size;

            canvas.height =
                size;


            /*
             * Lấy cạnh ngắn nhất
             * để crop ảnh thành hình vuông
             */

            const minDimension =
                Math.min(
                    img.width,
                    img.height
                );


            const startX =
                (
                    img.width -
                    minDimension
                ) / 2;


            const startY =
                (
                    img.height -
                    minDimension
                ) / 2;


            ctx.drawImage(

                img,

                startX,
                startY,

                minDimension,
                minDimension,

                0,
                0,

                size,
                size

            );


            /*
             * Chuyển thành JPEG.
             * Chất lượng 0.8 giống dashboard.
             */

            let base64Avatar =
                canvas.toDataURL(
                    "image/jpeg",
                    0.8
                );


            /*
             * Firestore giới hạn document
             * khoảng 1 MiB.
             *
             * Nếu ảnh sau xử lý vẫn quá lớn,
             * giảm quality.
             */

            if (
                base64Avatar.length >
                900000
            ) {

                base64Avatar =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.6
                    );

            }


            if (
                base64Avatar.length >
                900000
            ) {

                base64Avatar =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.4
                    );

            }


            if (
                base64Avatar.length >
                900000
            ) {

                throw new Error(
                    "Ảnh sau khi xử lý vẫn quá lớn để lưu vào hồ sơ."
                );

            }


            return base64Avatar;

        }


        /* =========================================
           UPDATE NAV AVATAR
        ========================================= */

        function updateNavigationAvatar(
            base64Avatar
        ) {

            /*
             * Nếu layout.js có avatar placeholder
             */

            const navAvatar =
                document.querySelector(
                    ".header-avatar-placeholder"
                );


            if (navAvatar) {

                const img =
                    document.createElement(
                        "img"
                    );


                img.src =
                    base64Avatar;


                img.alt =
                    "Avatar";


                img.style.width =
                    "32px";


                img.style.height =
                    "32px";


                img.style.borderRadius =
                    "50%";


                img.style.objectFit =
                    "cover";


                navAvatar.replaceWith(
                    img
                );

            }

        }


        /* =========================================
           UPLOAD AVATAR
        ========================================= */

        document
            .getElementById(
                "uploadAvatar"
            )
            .addEventListener(
                "change",
                async event => {

                    const input =
                        event.target;


                    const file =
                        input.files &&
                        input.files[0];


                    if (!file) {

                        return;

                    }


                    if (!isHasPermissionToEdit) {

                        input.value = "";

                        return;

                    }


                    /*
                     * Giới hạn file gốc 3MB
                     */

                    if (
                        file.size >
                        3 * 1024 * 1024
                    ) {

                        showToast(
                            "Dung lượng ảnh quá lớn! Vui lòng chọn ảnh dưới 3MB.",
                            "danger"
                        );


                        input.value =
                            "";


                        return;

                    }


                    /*
                     * Kiểm tra MIME type
                     */

                    const allowedTypes = [

                        "image/jpeg",

                        "image/jpg",

                        "image/png",

                        "image/webp"

                    ];


                    if (
                        !allowedTypes.includes(
                            file.type
                        )
                    ) {

                        showToast(
                            "Chỉ hỗ trợ ảnh JPG, JPEG, PNG hoặc WEBP.",
                            "danger"
                        );


                        input.value =
                            "";


                        return;

                    }


                    /*
                     * Hiển thị trạng thái
                     */

                    const avatar =
                        document.getElementById(
                            "displayAvatar"
                        );


                    const oldContent =
                        avatar.innerHTML;


                    avatar.innerHTML = `

                        <i
                            class="fas fa-spinner fa-spin"
                            style="
                                font-size:2rem;
                            ">
                        </i>

                    `;


                    avatar.style.pointerEvents =
                        "none";


                    try {

                        /*
                         * Xử lý ảnh
                         */

                        const base64Avatar =
                            await processAvatar(
                                file
                            );


                        /*
                         * Lưu trực tiếp vào Firestore
                         *
                         * KHÔNG sử dụng Firebase Storage.
                         */

                        await updateDoc(

                            doc(
                                db,
                                "users",
                                targetUid
                            ),

                            {
                                avatar:
                                    base64Avatar
                            }

                        );


                        /*
                         * Cập nhật dữ liệu hiện tại
                         */

                        currentProfileData.avatar =
                            base64Avatar;


                        /*
                         * Render lại avatar
                         */

                        renderProfileCV(
                            currentProfileData
                        );


                        /*
                         * Cập nhật avatar trên header
                         */

                        updateNavigationAvatar(
                            base64Avatar
                        );


                        showToast(
                            "Cập nhật ảnh đại diện thành công!"
                        );


                    } catch (error) {

                        console.error(
                            "Lỗi cập nhật ảnh:",
                            error
                        );


                        /*
                         * Khôi phục avatar cũ
                         */

                        renderProfileCV(
                            currentProfileData
                        );


                        showToast(
                            error.message ||
                            "Đã xảy ra lỗi khi cập nhật ảnh.",
                            "danger"
                        );


                    } finally {

                        input.value =
                            "";


                        avatar.style.pointerEvents =
                            "";

                    }

                }
            );


        /* =========================================
           OPEN EDIT MODAL
        ========================================= */

        window.openEditModal =
            function() {

                if (!isHasPermissionToEdit) {

                    return;

                }


                const data =
                    currentProfileData;


                document
                    .getElementById(
                        "editName"
                    )
                    .value =
                    data.name ||
                    data.displayName ||
                    data.fullName ||
                    "";


                document
                    .getElementById(
                        "editPosition"
                    )
                    .value =
                    data.position ||
                    "";


                document
                    .getElementById(
                        "editEmail"
                    )
                    .value =
                    data.email ||
                    "";


                document
                    .getElementById(
                        "editMajor"
                    )
                    .value =
                    data.major ||
                    "";


                document
                    .getElementById(
                        "editEducation"
                    )
                    .value =
                    normalizeArray(
                        data.education
                    )
                    .map(item =>
                        typeof item === "string"
                            ? item
                            : (
                                item.description ||
                                item.content ||
                                item.title ||
                                ""
                            )
                    )
                    .join("\n");


                document
                    .getElementById(
                        "editExperience"
                    )
                    .value =
                    normalizeArray(
                        data.experience
                    )
                    .map(item =>
                        typeof item === "string"
                            ? item
                            : (
                                item.description ||
                                item.content ||
                                item.title ||
                                ""
                            )
                    )
                    .join("\n");


                document
                    .getElementById(
                        "editResearch"
                    )
                    .value =
                    normalizeArray(
                        data.research
                    )
                    .map(item =>
                        typeof item === "string"
                            ? item
                            : (
                                item.description ||
                                item.content ||
                                item.title ||
                                ""
                            )
                    )
                    .join("\n");


                document
                    .getElementById(
                        "editModal"
                    )
                    .classList.remove(
                        "hidden"
                    );

            };


        /* =========================================
           CLOSE EDIT MODAL
        ========================================= */

        window.closeEditModal =
            function() {

                document
                    .getElementById(
                        "editModal"
                    )
                    .classList.add(
                        "hidden"
                    );

            };


        /* =========================================
           SAVE PROFILE
        ========================================= */

        window.saveProfile =
            async function() {

                if (!isHasPermissionToEdit) {

                    return;

                }


                try {

                    const educationText =
                        document
                            .getElementById(
                                "editEducation"
                            )
                            .value
                            .trim();


                    const experienceText =
                        document
                            .getElementById(
                                "editExperience"
                            )
                            .value
                            .trim();


                    const researchText =
                        document
                            .getElementById(
                                "editResearch"
                            )
                            .value
                            .trim();


                    const updatedData = {

                        name:
                            document
                                .getElementById(
                                    "editName"
                                )
                                .value
                                .trim(),

                        position:
                            document
                                .getElementById(
                                    "editPosition"
                                )
                                .value
                                .trim(),

                        email:
                            document
                                .getElementById(
                                    "editEmail"
                                )
                                .value
                                .trim(),

                        major:
                            document
                                .getElementById(
                                    "editMajor"
                                )
                                .value
                                .trim(),

                        education:
                            educationText
                                ? educationText
                                    .split("\n")
                                    .map(x => x.trim())
                                    .filter(Boolean)
                                : [],

                        experience:
                            experienceText
                                ? experienceText
                                    .split("\n")
                                    .map(x => x.trim())
                                    .filter(Boolean)
                                : [],

                        research:
                            researchText
                                ? researchText
                                    .split("\n")
                                    .map(x => x.trim())
                                    .filter(Boolean)
                                : []

                    };


                    await updateDoc(

                        doc(
                            db,
                            "users",
                            targetUid
                        ),

                        updatedData

                    );


                    currentProfileData = {

                        ...currentProfileData,

                        ...updatedData

                    };


                    renderProfileCV(
                        currentProfileData
                    );


                    closeEditModal();


                    showToast(
                        "Cập nhật hồ sơ thành công!"
                    );


                } catch (error) {

                    console.error(
                        "Lỗi lưu hồ sơ:",
                        error
                    );


                    showToast(
                        "Không thể lưu hồ sơ: " +
                        error.message,
                        "danger"
                    );

                }

            };


        /* =========================================
           CLOSE MODAL WHEN CLICK OUTSIDE
        ========================================= */

        document
            .getElementById(
                "editModal"
            )
            .addEventListener(
                "click",
                event => {

                    if (
                        event.target.id ===
                        "editModal"
                    ) {

                        closeEditModal();

                    }

                }
            );

    </script>
