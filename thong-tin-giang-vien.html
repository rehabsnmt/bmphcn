<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Thông tin chi tiết Giảng viên - Bộ môn Phục hồi chức năng.">
    <title>Hồ sơ Giảng viên - Bộ môn PHCN</title>
    
    <link rel="icon" href="images/logo_Bộ môn.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Mở rộng khung tối đa trên màn hình lớn */
        main { max-width: 1250px; padding: 2rem 2%; margin: 0 auto; min-height: 75vh; box-sizing: border-box;}
        
        .hidden { display: none !important; }

        /* BỐ CỤC CV CHÍNH */
        .cv-wrapper { display: grid; grid-template-columns: 380px 1fr; gap: 2rem; background: white; border-radius: 12px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); overflow: hidden; align-items: stretch; position: relative;}
        
        /* Nút Chỉnh sửa (Chỉ hiện cho Chủ sở hữu / Admin) */
        #btnEditProfile { position: absolute; top: 15px; right: 15px; background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px; z-index: 10; box-shadow: 0 4px 6px rgba(2, 132, 199, 0.2);}
        #btnEditProfile:hover { background: var(--primary-hover); transform: translateY(-2px); }

        /* CỘT TRÁI - SIDEBAR */
        .cv-sidebar { background: #f8fafc; padding: 2.5rem 2rem; display: flex; flex-direction: column; align-items: center; text-align: center; border-right: 1px solid var(--border); }
        
        .cv-avatar-container { position: relative; display: flex; flex-direction: column; align-items: center; margin-bottom: 1.5rem; width: 100%;}
        
        /* Chỉnh khung ảnh thành hình vuông (1:1), lấp đầy không bóp méo */
        .cv-avatar { width: 240px; height: 240px; border-radius: 12px; border: 4px solid white; box-shadow: 0 4px 15px rgba(0,0,0,0.1); background-color: white; display: flex; align-items: center; justify-content: center; font-size: 4rem; color: #94a3b8; overflow: hidden; position: relative; margin-bottom: 5px; }
        .cv-avatar img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; } 
        
        .cv-avatar.editable { cursor: pointer; }
        
        /* Hiệu ứng lớp phủ toàn khung ảnh mờ */
        .cv-avatar-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; z-index: 2; }
        .cv-avatar.editable:hover .cv-avatar-overlay { opacity: 1; }
        
        /* Tên, Học vị & Chức vụ */
        .cv-degree { font-size: 0.95rem; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .cv-name { font-size: 1.4rem; font-weight: 800; color: var(--text-dark); margin-bottom: 8px; white-space: nowrap; }
        .cv-position { font-size: 0.9rem; font-weight: 600; color: var(--text-body); margin-bottom: 15px; background: var(--bg-page); padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); display: inline-block; }
        
        /* Xếp dọc Chuyên ngành & Email - Tuyệt đối KHÔNG ngắt dòng */
        .cv-major-container { margin-bottom: 15px; width: 100%; display: flex; justify-content: center; overflow: hidden; }
        .cv-email { font-size: clamp(0.8rem, 3vw, 0.95rem); color: var(--text-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

        /* Badge màu sắc chuyên ngành */
        .major-badge { padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; display: inline-block; white-space: nowrap; }
        .badge-vltl { background-color: #e0f2fe; color: #0369a1; border: 1px solid #7dd3fc; } /* Xanh dương */
        .badge-hdtl { background-color: #ffedd5; color: #c2410c; border: 1px solid #fdba74; } /* Cam */
        .badge-nntl { background-color: #dcfce7; color: #15803d; border: 1px solid #86efac; } /* Xanh lá */
        .badge-default { background-color: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }

        /* CỘT PHẢI - NỘI DUNG CHÍNH (TABS) */
        .cv-main { padding: 2.5rem 2.5rem 2.5rem 1rem; display: flex; flex-direction: column; position: relative; }
        
        /* Logo chìm */
        .cv-watermark { position: absolute; top: 15px; right: 20px; width: 180px; opacity: 0.08; pointer-events: none; z-index: 0; user-select: none; }

        /* Tabs Selection - Ép không rớt dòng và có thể lướt ngang */
        .cv-tabs { 
            display: flex; 
            gap: 10px; 
            border-bottom: 2px solid var(--border); 
            margin-bottom: 25px; 
            position: relative; 
            z-index: 1; 
            flex-wrap: nowrap; 
            overflow-x: auto; 
            -webkit-overflow-scrolling: touch; 
        }
        
        /* Ẩn thanh cuộn ngang để giao diện sạch sẽ */
        .cv-tabs::-webkit-scrollbar { display: none; }
        .cv-tabs { -ms-overflow-style: none; scrollbar-width: none; }

        .cv-tab-btn { padding: 10px 15px; background: none; border: none; font-size: 1.05rem; font-weight: 700; color: #64748b; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: 0.2s; white-space: nowrap; flex-shrink: 0; }
        .cv-tab-btn:hover { color: var(--primary); }
        .cv-tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        
        .cv-section { display: none; position: relative; z-index: 1; min-height: 250px; }
        .cv-section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .cv-content { font-size: 0.95rem; color: var(--text-body); line-height: 1.8; white-space: pre-line; text-align: justify; }
        .cv-content ul { padding-left: 20px; margin-top: 5px; }
        .cv-content li { margin-bottom: 10px; }

        .empty-text { font-style: italic; color: #94a3b8; }

        /* MODAL CHỈNH SỬA PROFILE */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 2000; padding: 10px; }
        .modal-content { background: white; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); overflow: hidden; width: 100%; max-width: 800px; display: flex; flex-direction: column; max-height: 90vh; }
        .modal-header { padding: 15px 20px; background: var(--primary); color: white; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { margin: 0; font-size: 1.2rem; }
        .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label { font-size: 0.9rem; font-weight: 600; color: var(--text-dark); margin-bottom: 5px; }
        .form-control { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); font-family: inherit; font-size: 0.95rem; outline: none; box-sizing: border-box; transition: 0.2s; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1); }
        textarea.form-control { resize: vertical; min-height: 100px; line-height: 1.5; }

        .btn-save { background: #10b981; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 1.05rem; cursor: pointer; transition: 0.2s; width: 100%; margin-top: 10px; }
        .btn-save:hover { background: #059669; }

        /* Toast Thông báo */
        .toast-container { position: fixed; top: 80px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none;}
        .toast { min-width: 250px; background-color: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 12px; transform: translateX(120%); transition: 0.4s; font-weight: 600; border-left: 5px solid #22c55e; opacity: 0; pointer-events: auto; }
        .toast.show { transform: translateX(0); opacity: 1; }
        .toast.danger { border-left-color: #ef4444; }

        #loadingScreen { text-align: center; padding: 5rem 0; color: var(--primary); font-weight: 600; font-size: 1.2rem; }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .cv-wrapper { grid-template-columns: 1fr; }
            .cv-sidebar { border-right: none; border-bottom: 1px solid var(--border); padding: 2rem 1.5rem; }
            .cv-main { padding: 1.5rem; }
            .form-grid { grid-template-columns: 1fr; }
            #btnEditProfile { top: 10px; right: 10px; padding: 6px 10px; font-size: 0.85rem; }
            .cv-tab-btn { padding: 8px 12px; font-size: 0.9rem; }
            .cv-watermark { width: 100px; top: 10px; right: 10px; }
        }
    </style>
</head>
<body>

    <!-- GỌI HEADER CHUNG -->
    <div id="header-placeholder"></div>
    <div id="toastContainer" class="toast-container"></div>

    <main>
        <div id="loadingScreen"><i class="fas fa-spinner fa-spin fa-2x"></i><br><br>Đang tải thông tin...</div>

        <div id="cvWrapper" class="cv-wrapper hidden">
            <!-- CỘT TRÁI: THÔNG TIN CƠ BẢN -->
            <div class="cv-sidebar">
                <div class="cv-avatar-container">
                    <div class="cv-avatar" id="displayAvatar" onclick="triggerAvatarUpload()">
                        <i class="fas fa-user"></i>
                    </div>
                    <input type="file" id="uploadAvatar" accept="image/jpeg, image/jpg" class="hidden">
                    <div id="avatarNote" class="hidden" style="font-size: 0.85rem; color: #64748b; margin-top: 8px; font-weight: 600;">(Chọn ảnh < 2MB, định dạng JPG)</div>
                </div>

                <div class="cv-degree" id="displayDegree">Học vị</div>
                <div class="cv-name" id="displayName">Họ và Tên</div>
                <div class="cv-position" id="displayPosition">Chức vụ</div>
                
                <div class="cv-major-container" id="displayMajor">
                    <!-- Text chuyên ngành sẽ được chèn vào đây -->
                </div>
                
                <div class="cv-email" id="displayEmail">Chưa cập nhật</div>
            </div>

            <!-- CỘT PHẢI: CHI TIẾT CV (ĐÃ CHUYỂN SANG DẠNG TAB) -->
            <div class="cv-main">
                <img src="images/logo_Bộ môn.png" class="cv-watermark" alt="Logo Bộ Môn">
                
                <div class="cv-tabs">
                    <button class="cv-tab-btn active" onclick="switchCvTab('edu', this)">Quá trình đào tạo</button>
                    <button class="cv-tab-btn" onclick="switchCvTab('exp', this)">Quá trình công tác</button>
                    <button class="cv-tab-btn" onclick="switchCvTab('res', this)">Nghiên cứu khoa học</button>
                    <button class="cv-tab-btn" onclick="switchCvTab('teach', this)">Hoạt động giảng dạy</button>
                </div>

                <div class="cv-section active" id="sec-edu">
                    <div class="cv-content" id="displayEducation"><span class="empty-text">Chưa cập nhật thông tin.</span></div>
                </div>

                <div class="cv-section" id="sec-exp">
                    <div class="cv-content" id="displayExperience"><span class="empty-text">Chưa cập nhật thông tin.</span></div>
                </div>

                <div class="cv-section" id="sec-res">
                    <div class="cv-content" id="displayResearch"><span class="empty-text">Chưa cập nhật thông tin.</span></div>
                </div>

                <div class="cv-section" id="sec-teach">
                    <div class="cv-content" id="displayTeaching"><span class="empty-text">Chưa cập nhật thông tin.</span></div>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL CHỈNH SỬA THÔNG TIN -->
    <div id="editModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Cập nhật Thông tin Hồ sơ</h3>
                <span style="cursor:pointer; font-size:1.2rem; font-weight:bold;" onclick="closeEditModal()">✕</span>
            </div>
            <div class="modal-body">
                <form id="editProfileForm" onsubmit="saveProfile(event)">
                    
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Họ và Tên *</label>
                            <input type="text" id="inputName" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Học hàm / Học vị</label>
                            <select id="inputDegree" class="form-control">
                                <option value="">Không có</option>
                                <option value="CN">Cử nhân (CN)</option>
                                <option value="ThS">Thạc sĩ (ThS)</option>
                                <option value="TS">Tiến sĩ (TS)</option>
                                <option value="PGS.TS">Phó Giáo sư, Tiến sĩ (PGS.TS)</option>
                                <option value="GS.TS">Giáo sư, Tiến sĩ (GS.TS)</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Chức vụ</label>
                            <select id="inputPositionSelect" class="form-control" onchange="toggleOtherInput('inputPositionSelect', 'inputPositionOther')">
                                <option value="Trưởng Bộ môn">Trưởng Bộ môn</option>
                                <option value="Giáo vụ">Giáo vụ</option>
                                <option value="Giảng viên">Giảng viên</option>
                                <option value="OTHER">Khác...</option>
                            </select>
                            <input type="text" id="inputPositionOther" class="form-control hidden" placeholder="Nhập chức vụ khác..." style="margin-top: 5px;">
                        </div>

                        <div class="form-group">
                            <label>Chuyên ngành</label>
                            <select id="inputMajorSelect" class="form-control" onchange="toggleOtherInput('inputMajorSelect', 'inputMajorOther')">
                                <option value="Vật lý trị liệu">Vật lý trị liệu</option>
                                <option value="Hoạt động trị liệu">Hoạt động trị liệu</option>
                                <option value="Ngôn ngữ trị liệu">Ngôn ngữ trị liệu</option>
                                <option value="OTHER">Khác...</option>
                            </select>
                            <input type="text" id="inputMajorOther" class="form-control hidden" placeholder="Nhập chuyên ngành khác..." style="margin-top: 5px;">
                        </div>
                    </div>

                    <div class="form-group full" style="margin-bottom: 15px;">
                        <label>Quá trình đào tạo</label>
                        <textarea id="inputEducation" class="form-control"></textarea>
                    </div>

                    <div class="form-group full" style="margin-bottom: 15px;">
                        <label>Quá trình công tác</label>
                        <textarea id="inputExperience" class="form-control"></textarea>
                    </div>

                    <div class="form-group full" style="margin-bottom: 15px;">
                        <label>Nghiên cứu khoa học</label>
                        <textarea id="inputResearch" class="form-control"></textarea>
                    </div>

                    <div class="form-group full">
                        <label>Hoạt động giảng dạy</label>
                        <textarea id="inputTeaching" class="form-control" style="min-height: 150px;"></textarea>
                    </div>

                    <button type="submit" class="btn-save" id="btnSaveSubmit">Lưu thông tin</button>
                </form>
            </div>
        </div>
    </div>

    <!-- GỌI FOOTER CHUNG -->
    <div id="footer-placeholder"></div>

    <script src="js/layout.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-storage.js";

        const firebaseConfig = { apiKey: "AIzaSyDVT4akTw65Uj6KHymwWtQ9xyHVyfTlXIY", authDomain: "bmphcn-aa9c6.firebaseapp.com", projectId: "bmphcn-aa9c6", storageBucket: "bmphcn-aa9c6.firebasestorage.app", messagingSenderId: "749494392719", appId: "1:749494392719:web:f220c751ff541620045dfa" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let targetUid = null;
        let isHasPermissionToEdit = false;
        let currentProfileData = {};

        // Hiển thị chuyển tab
        window.switchCvTab = (tabId, btnEl) => {
            document.querySelectorAll('.cv-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.cv-tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById('sec-' + tabId).classList.add('active');
            btnEl.classList.add('active');
        };

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3000);
        }

        // Logic ẩn hiện ô nhập "Khác"
        window.toggleOtherInput = (selectId, inputId) => {
            const selectEl = document.getElementById(selectId);
            const inputEl = document.getElementById(inputId);
            if (selectEl.value === 'OTHER') {
                inputEl.classList.remove('hidden');
                inputEl.focus();
            } else {
                inputEl.classList.add('hidden');
            }
        };

        // Render dữ liệu lên UI
        function renderProfileCV(data) {
            document.getElementById('loadingScreen').classList.add('hidden');
            const wrapper = document.getElementById('cvWrapper');
            wrapper.classList.remove('hidden');

            // Map hiển thị đầy đủ học vị
            const degreeMap = {
                'CN': 'Cử nhân',
                'ThS': 'Thạc sĩ',
                'TS': 'Tiến sĩ',
                'PGS.TS': 'Phó Giáo sư, Tiến sĩ',
                'GS.TS': 'Giáo sư, Tiến sĩ'
            };

            let degreeText = 'Giảng viên';
            if (data.degree) {
                degreeText = degreeMap[data.degree] || data.degree;
            }
            
            document.getElementById('displayDegree').innerText = degreeText;
            document.getElementById('displayName').innerText = data.fullName || 'Chưa cập nhật';
            document.getElementById('displayPosition').innerText = data.position || 'Giảng viên';
            
            document.getElementById('displayEmail').innerText = data.email || 'Chưa cập nhật';
            
            // Xử lý màu sắc cho chuyên ngành
            let majorText = data.major || 'Chưa cập nhật';
            let badgeClass = 'badge-default';
            let textLower = majorText.toLowerCase();

            if (textLower.includes('vật lý')) {
                badgeClass = 'badge-vltl';
            } else if (textLower.includes('hoạt động')) {
                badgeClass = 'badge-hdtl';
            } else if (textLower.includes('ngôn ngữ')) {
                badgeClass = 'badge-nntl';
            }

            if (majorText !== 'Chưa cập nhật') {
                document.getElementById('displayMajor').innerHTML = `<span class="major-badge ${badgeClass}">${majorText}</span>`;
            } else {
                document.getElementById('displayMajor').innerHTML = `<span class="major-badge badge-default">Chưa cập nhật</span>`;
            }

            // Xử lý tự động thu nhỏ chữ chuyên ngành nếu văn bản quá dài so với khung
            setTimeout(() => {
                const majorContainer = document.getElementById('displayMajor');
                const badge = majorContainer.querySelector('.major-badge');
                if (badge) {
                    badge.style.fontSize = '0.85rem'; // reset size mặc định
                    let fontSize = 0.85;
                    // Lặp giảm size cho tới khi vừa khung, thu nhỏ thoải mái
                    while (badge.scrollWidth > majorContainer.clientWidth && fontSize > 0.3) {
                        fontSize -= 0.02;
                        badge.style.fontSize = fontSize + 'rem';
                    }
                }
            }, 50);

            // Avatar setup kèm hiệu ứng overlay lồng mờ
            const avatarDiv = document.getElementById('displayAvatar');
            let overlayHtml = isHasPermissionToEdit ? `<div class="cv-avatar-overlay"><span style="font-size:1.1rem; font-weight:bold;">Thay ảnh</span></div>` : '';
            
            if (isHasPermissionToEdit) {
                avatarDiv.classList.add('editable');
                document.getElementById('avatarNote').classList.remove('hidden');
            }

            if (data.avatar && data.avatar.trim() !== '') {
                avatarDiv.innerHTML = `<img src="${data.avatar}" alt="Avatar ${data.fullName}" onerror="this.onerror=null; this.parentElement.innerHTML='<i class=\\'fas fa-user\\'></i>${overlayHtml}';">${overlayHtml}`;
            } else {
                avatarDiv.innerHTML = `<i class="fas fa-user"></i>${overlayHtml}`;
            }

            // Main info (Format string line breaks)
            const formatText = (text) => text && text.trim() !== '' ? text.trim() : '<span class="empty-text">Chưa cập nhật thông tin.</span>';
            
            document.getElementById('displayEducation').innerHTML = formatText(data.education);
            document.getElementById('displayExperience').innerHTML = formatText(data.experience);
            document.getElementById('displayResearch').innerHTML = formatText(data.research);
            document.getElementById('displayTeaching').innerHTML = formatText(data.teaching);

            // Xử lý nút Edit
            const existingBtn = document.getElementById('btnEditProfile');
            if (existingBtn) existingBtn.remove();

            if (isHasPermissionToEdit) {
                const btnEdit = document.createElement('button');
                btnEdit.id = 'btnEditProfile';
                btnEdit.innerHTML = 'Chỉnh sửa Hồ sơ';
                btnEdit.onclick = openEditModal;
                wrapper.appendChild(btnEdit);
            }
        }

        // Tải dữ liệu Profile
        async function loadProfile(uid) {
            try {
                const docRef = doc(db, "users", uid);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    currentProfileData = docSnap.data();
                    renderProfileCV(currentProfileData);
                } else {
                    document.getElementById('loadingScreen').innerHTML = `Không tìm thấy thông tin Giảng viên này.`;
                }
            } catch (error) {
                console.error("Lỗi tải thông tin:", error);
                document.getElementById('loadingScreen').innerHTML = `Lỗi tải dữ liệu: ${error.message}`;
            }
        }

        // Kiểm tra logic xác thực
        onAuthStateChanged(auth, (user) => {
            const urlParams = new URLSearchParams(window.location.search);
            const urlId = urlParams.get('id');

            if (user) {
                // Xác định UID cần xem
                targetUid = urlId ? urlId : user.uid;

                // Xác định quyền sửa: Chính chủ HOẶC Super Admin
                if (user.uid === targetUid || user.email === 'hoangtran1483@gmail.com') {
                    // Chặn riêng học viên tự sửa info
                    if (user.email !== 'ths.phcn26@ump.edu.vn') {
                        isHasPermissionToEdit = true;
                    }
                }

                loadProfile(targetUid);
            } else {
                // Nếu chưa đăng nhập, vẫn cho phép khách vãng lai xem profile nếu có ID trên URL
                if (urlId) {
                    targetUid = urlId;
                    isHasPermissionToEdit = false;
                    loadProfile(targetUid); 
                } else {
                    window.location.href = "login.html";
                }
            }
        });

        // XỬ LÝ ẢNH ĐẠI DIỆN
        window.triggerAvatarUpload = () => {
            if (isHasPermissionToEdit) {
                document.getElementById('uploadAvatar').click();
            }
        };

        document.getElementById('uploadAvatar').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            // Xác thực dung lượng (< 2MB)
            if (file.size > 2 * 1024 * 1024) {
                showToast("Vui lòng chọn ảnh có dung lượng nhỏ hơn 2MB!", "danger");
                e.target.value = '';
                return;
            }
            
            // Xác thực định dạng (Chỉ JPG/JPEG)
            if (file.type !== "image/jpeg" && file.type !== "image/jpg") {
                showToast("Vui lòng chọn ảnh định dạng JPG!", "danger");
                e.target.value = '';
                return;
            }
            
            // Hiện hiệu ứng tải trên avatar
            const overlay = document.querySelector('.cv-avatar-overlay');
            if(overlay) {
                overlay.innerHTML = '<span style="font-weight:bold;">Đang tải...</span>';
                overlay.style.opacity = '1';
            }
            
            try {
                // Tạo tên file duy nhất trong thư mục avatars/
                const storageRef = ref(storage, `avatars/${targetUid}_${Date.now()}.jpg`);
                
                // Upload ảnh
                await uploadBytes(storageRef, file);
                
                // Lấy URL công khai
                const downloadURL = await getDownloadURL(storageRef);
                
                // Cập nhật URL vào Firestore
                await updateDoc(doc(db, "users", targetUid), { avatar: downloadURL });
                
                // Cập nhật ngay trên giao diện
                currentProfileData.avatar = downloadURL;
                renderProfileCV(currentProfileData);
                showToast("Cập nhật ảnh đại diện thành công!");
            } catch (err) {
                showToast("Lỗi tải ảnh: " + err.message, "danger");
            } finally {
                e.target.value = ''; // Reset input file
            }
        });

        // XỬ LÝ MODAL CHỈNH SỬA
        window.openEditModal = () => {
            // Đổ dữ liệu hiện tại vào form
            document.getElementById('inputName').value = currentProfileData.fullName || '';
            document.getElementById('inputDegree').value = currentProfileData.degree || '';
            
            // Set Chức vụ
            const pos = currentProfileData.position || 'Giảng viên';
            const validPositions = ['Trưởng Bộ môn', 'Giáo vụ', 'Giảng viên'];
            if (validPositions.includes(pos)) {
                document.getElementById('inputPositionSelect').value = pos;
                document.getElementById('inputPositionOther').classList.add('hidden');
                document.getElementById('inputPositionOther').value = '';
            } else {
                document.getElementById('inputPositionSelect').value = 'OTHER';
                document.getElementById('inputPositionOther').value = pos;
                document.getElementById('inputPositionOther').classList.remove('hidden');
            }

            // Set Chuyên ngành
            const major = currentProfileData.major || 'Vật lý trị liệu';
            const validMajors = ['Vật lý trị liệu', 'Hoạt động trị liệu', 'Ngôn ngữ trị liệu'];
            if (validMajors.includes(major)) {
                document.getElementById('inputMajorSelect').value = major;
                document.getElementById('inputMajorOther').classList.add('hidden');
                document.getElementById('inputMajorOther').value = '';
            } else {
                document.getElementById('inputMajorSelect').value = 'OTHER';
                document.getElementById('inputMajorOther').value = major;
                document.getElementById('inputMajorOther').classList.remove('hidden');
            }
            
            document.getElementById('inputEducation').value = currentProfileData.education || '';
            document.getElementById('inputExperience').value = currentProfileData.experience || '';
            document.getElementById('inputResearch').value = currentProfileData.research || '';
            document.getElementById('inputTeaching').value = currentProfileData.teaching || '';

            document.getElementById('editModal').classList.remove('hidden');
        };

        window.closeEditModal = () => {
            document.getElementById('editModal').classList.add('hidden');
        };

        window.saveProfile = async (e) => {
            e.preventDefault();
            const btnSubmit = document.getElementById('btnSaveSubmit');
            btnSubmit.innerHTML = 'Đang lưu...';
            btnSubmit.disabled = true;

            // Xử lý lấy giá trị từ Select hoặc text Khác
            let positionVal = document.getElementById('inputPositionSelect').value;
            if (positionVal === 'OTHER') positionVal = document.getElementById('inputPositionOther').value.trim();

            let majorVal = document.getElementById('inputMajorSelect').value;
            if (majorVal === 'OTHER') majorVal = document.getElementById('inputMajorOther').value.trim();

            const updatedData = {
                fullName: document.getElementById('inputName').value.trim(),
                degree: document.getElementById('inputDegree').value,
                position: positionVal,
                major: majorVal,
                
                education: document.getElementById('inputEducation').value.trim(),
                experience: document.getElementById('inputExperience').value.trim(),
                research: document.getElementById('inputResearch').value.trim(),
                teaching: document.getElementById('inputTeaching').value.trim()
            };

            try {
                const userRef = doc(db, "users", targetUid);
                await updateDoc(userRef, updatedData);
                
                showToast("Cập nhật thông tin thành công!");
                currentProfileData = { ...currentProfileData, ...updatedData };
                renderProfileCV(currentProfileData);
                closeEditModal();
            } catch (error) {
                console.error("Lỗi khi lưu:", error);
                showToast("Lỗi khi lưu: " + error.message, "danger");
            } finally {
                btnSubmit.innerHTML = 'Lưu thông tin';
                btnSubmit.disabled = false;
            }
        };

    </script>
</body>
</html>
