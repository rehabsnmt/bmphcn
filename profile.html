<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cập nhật thông tin cá nhân Giảng viên.">
    <title>Hồ sơ Giảng viên - Bộ môn Phục hồi chức năng</title>
    
    <link rel="icon" href="images/logo_Bộ môn.png" type="image/png">
    <link rel="apple-touch-icon" href="images/logo_Bộ môn.png">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; background-color: var(--bg-page, #f8fafc); margin: 0; align-items: center; justify-content: center; }
        
        .profile-wrapper { width: 100%; padding: 2rem 1rem; display: flex; justify-content: center; }
        .profile-card { background: var(--surface, #ffffff); width: 100%; max-width: 450px; padding: 2.5rem 2rem; border-radius: var(--radius-md, 16px); box-shadow: var(--shadow-hover, 0 12px 30px rgba(2, 132, 199, 0.08)); border: 1px solid var(--border, #e2e8f0); text-align: center; }
        
        /* Khung ảnh đại diện */
        .avatar-container { position: relative; width: 100px; height: 100px; margin: 0 auto 1.5rem; border-radius: 50%; overflow: hidden; border: 3px solid var(--primary, #0284c7); background: var(--bg-page); display: flex; align-items: center; justify-content: center; }
        .avatar-container img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-container i { font-size: 2.5rem; color: var(--text-body); }
        
        .profile-card h2 { color: var(--text-dark, #0f172a); margin-bottom: 0.5rem; font-size: 1.6rem; }
        
        /* Dòng lưu ý nhỏ */
        .profile-note {
            font-size: 0.85rem;
            color: var(--text-body);
            opacity: 0.85;
            margin-bottom: 2rem;
            font-style: italic;
        }
        
        .input-group { margin-bottom: 1.2rem; text-align: left; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-dark); margin-bottom: 0.4rem; }
        .input-group input, .input-group select { width: 100%; padding: 0.8rem; border: 1px solid var(--border, #e2e8f0); border-radius: var(--radius-sm, 8px); font-size: 0.95rem; outline: none; transition: var(--transition, all 0.3s ease); background-color: var(--bg-page, #f8fafc); color: var(--text-dark, #0f172a); font-family: inherit; }
        .input-group input:focus, .input-group select:focus { border-color: var(--primary, #0284c7); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); background-color: var(--surface, #ffffff); }
        
        /* Hiệu ứng khi ô bị khóa/tự động thiết lập */
        .input-group input:read-only, .input-group select:disabled { background-color: #f1f5f9; cursor: not-allowed; color: #64748b; }

        .btn-save { width: 100%; padding: 0.8rem; background-color: var(--primary, #0284c7); color: white; border: none; border-radius: var(--radius-sm, 8px); font-size: 1rem; font-weight: 600; cursor: pointer; transition: var(--transition, all 0.3s ease); box-shadow: var(--shadow-sm, 0 1px 2px rgba(2, 132, 199, 0.05)); margin-top: 0.5rem; }
        .btn-save:hover { background-color: var(--primary-hover, #0369a1); box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2); }
        
        .btn-back { display: block; margin-top: 1.2rem; color: var(--text-body, #475569); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: var(--transition); }
        .btn-back:hover { color: var(--primary); }

        .status-message { font-size: 0.85rem; margin-top: 1rem; display: none; padding: 0.7rem; border-radius: var(--radius-sm, 8px); }
        .status-success { color: #166534; background: #dcfce7; border: 1px solid rgba(22, 101, 52, 0.2); }
        .status-error { color: var(--accent, #e11d48); background: var(--accent-light, #fff1f2); border: 1px solid rgba(225, 29, 72, 0.2); }
    </style>
</head>
<body>

    <main class="profile-wrapper">
        <div class="profile-card">
            <!-- Xem trước ảnh đại diện -->
            <div class="avatar-container" id="avatarPreviewBox">
                <i class="fas fa-user" id="defaultAvatarIcon"></i>
                <img id="avatarImg" src="" alt="Avatar" style="display: none;">
            </div>

            <h2>Hồ sơ Giảng viên</h2>
            <div class="profile-note">Ảnh đại diện sẽ đồng bộ trên toàn hệ thống</div>
            
            <form id="profileForm" onsubmit="return false;">
                <!-- Chọn ảnh từ thiết bị -->
                <div class="input-group">
                    <label>Tải ảnh đại diện</label>
                    <input type="file" id="inputAvatarFile" accept="image/*">
                </div>

                <!-- Sổ xuống chọn chức vụ (Đưa lên trước để tự động điều chỉnh Học vị & Tên) -->
                <div class="input-group">
                    <label>Chức vụ</label>
                    <select id="inputPosition" required>
                        <option value="" disabled selected>-- Chọn chức vụ --</option>
                        <option value="Trưởng Bộ môn">Trưởng Bộ môn</option>
                        <option value="Phó Trưởng Bộ môn">Phó Trưởng Bộ môn</option>
                        <option value="Giảng viên">Giảng viên</option>
                    </select>
                </div>

                <!-- Sổ xuống chọn học vị -->
                <div class="input-group">
                    <label>Học vị</label>
                    <select id="inputDegree" required>
                        <option value="" disabled selected>-- Chọn học vị --</option>
                        <option value="CN">Cử nhân (CN)</option>
                        <option value="ThS">Thạc sĩ (ThS)</option>
                        <option value="TS">Tiến sĩ (TS)</option>
                    </select>
                </div>

                <!-- Nhập Họ và tên -->
                <div class="input-group">
                    <label>Họ và tên</label>
                    <input type="text" id="inputName" placeholder="VD: Nguyễn Văn A" required>
                </div>
                
                <button type="submit" id="btnSave" class="btn-save"><i class="fas fa-save" style="margin-right: 6px;"></i> Lưu thông tin</button>
            </form>

            <a href="dashboard.html" class="btn-back"><i class="fas fa-arrow-left" style="margin-right: 5px;"></i> Quay về Bảng điều khiển</a>

            <div id="statusMessage" class="status-message"></div>
        </div>
    </main>

    <!-- CẤU HÌNH FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <script>
        const inputDegree = document.getElementById('inputDegree');
        const inputName = document.getElementById('inputName');
        const inputPosition = document.getElementById('inputPosition');
        const inputAvatarFile = document.getElementById('inputAvatarFile');
        const avatarImg = document.getElementById('avatarImg');
        const defaultAvatarIcon = document.getElementById('defaultAvatarIcon');
        const btnSave = document.getElementById('btnSave');
        const statusMsg = document.getElementById('statusMessage');

        let base64Image = "";

        function showMessage(msg, isSuccess) {
            statusMsg.style.display = "block";
            statusMsg.className = `status-message ${isSuccess ? 'status-success' : 'status-error'}`;
            statusMsg.innerText = msg;
        }

        // Tự động gán thông tin khi thay đổi chức vụ
        inputPosition.addEventListener('change', function() {
            const pos = this.value;
            if (pos === "Trưởng Bộ môn") {
                inputDegree.value = "TS";
                inputDegree.disabled = true;
                inputName.value = "Lê Thanh Vân";
                inputName.readOnly = true;
            } else if (pos === "Phó Trưởng Bộ môn") {
                inputDegree.value = "TS";
                inputDegree.disabled = true;
                inputName.value = "Nguyễn Thanh Duy";
                inputName.readOnly = true;
            } else {
                inputDegree.disabled = false;
                inputName.readOnly = false;
                inputName.value = "";
                inputDegree.value = "";
            }
        });

        inputAvatarFile.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    base64Image = event.target.result;
                    avatarImg.src = base64Image;
                    avatarImg.style.display = "block";
                    defaultAvatarIcon.style.display = "none";
                }
                reader.readAsDataURL(file);
            }
        });

        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                firebase.firestore().collection("users").doc(user.uid).get().then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        inputPosition.value = data.position || "";
                        
                        // Kích hoạt logic khóa ô nếu dữ liệu cũ là Trưởng/Phó BM
                        if (data.position === "Trưởng Bộ môn" || data.position === "Phó Trưởng Bộ môn") {
                            inputDegree.value = "TS";
                            inputDegree.disabled = true;
                            inputName.value = data.fullName || (data.position === "Trưởng Bộ môn" ? "Lê Thanh Vân" : "Nguyễn Thanh Duy");
                            inputName.readOnly = true;
                        } else {
                            inputDegree.value = data.degree || "";
                            inputName.value = data.fullName || "";
                            inputDegree.disabled = false;
                            inputName.readOnly = false;
                        }

                        if (data.avatar) {
                            base64Image = data.avatar;
                            avatarImg.src = base64Image;
                            avatarImg.style.display = "block";
                            defaultAvatarIcon.style.display = "none";
                        }
                    }
                });
            } else {
                window.location.replace("login.html");
            }
        });

        btnSave.addEventListener('click', () => {
            const user = firebase.auth().currentUser;
            const degree = inputDegree.value;
            const fullName = inputName.value.trim();
            const position = inputPosition.value;

            if (!user || !degree || !fullName || !position) {
                showMessage("Vui lòng điền đầy đủ thông tin.", false);
                return;
            }

            btnSave.disabled = true;
            btnSave.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang lưu...';

            firebase.firestore().collection("users").doc(user.uid).set({
                degree: degree,
                fullName: fullName,
                position: position,
                avatar: base64Image,
                email: user.email,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true })
            .then(() => {
                showMessage("Đã lưu thành công! Đang chuyển hướng...", true);
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1200);
            })
            .catch((error) => {
                console.error("Lỗi:", error);
                showMessage("Có lỗi xảy ra: " + error.message, false);
                btnSave.disabled = false;
                btnSave.innerHTML = '<i class="fas fa-save" style="margin-right: 6px;"></i> Lưu thông tin';
            });
        });
    </script>
</body>
</html>
