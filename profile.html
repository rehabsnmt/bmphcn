<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Xem thông tin cá nhân Giảng viên.">
    <title>Hồ sơ Giảng viên - Bộ môn Phục hồi chức năng</title>
    
    <link rel="icon" href="images/logo_Bộ môn.png" type="image/png">
    <link rel="apple-touch-icon" href="images/logo_Bộ môn.png">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; background-color: var(--bg-page, #f8fafc); margin: 0; align-items: center; justify-content: center; }
        
        .profile-wrapper { width: 100%; padding: 2rem 1rem; display: flex; justify-content: center; }
        .profile-card { background: var(--surface, #ffffff); width: 100%; max-width: 480px; padding: 2.5rem 2rem; border-radius: var(--radius-md, 16px); box-shadow: var(--shadow-hover, 0 12px 30px rgba(2, 132, 199, 0.08)); border: 1px solid var(--border, #e2e8f0); text-align: center; }
        
        /* Khung ảnh đại diện */
        .avatar-container { position: relative; width: 110px; height: 110px; margin: 0 auto 1.5rem; border-radius: 50%; overflow: hidden; border: 3px solid var(--primary, #0284c7); background: var(--bg-page); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(2, 132, 199, 0.1); }
        .avatar-container img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-container i { font-size: 2.5rem; color: var(--text-body); }
        
        .profile-card h2 { color: var(--text-dark, #0f172a); margin-bottom: 2rem; font-size: 1.6rem; }
        
        .input-group { margin-bottom: 1.2rem; text-align: left; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-dark); margin-bottom: 0.4rem; }
        
        .input-group input { 
            width: 100%; 
            padding: 0.8rem; 
            border: 1px solid var(--border, #e2e8f0); 
            border-radius: var(--radius-sm, 8px); 
            font-size: 0.95rem; 
            outline: none; 
            transition: var(--transition, all 0.3s ease); 
            background-color: var(--bg-page, #f8fafc); 
            color: var(--text-dark, #0f172a); 
            font-family: inherit; 
            box-sizing: border-box;
        }
        
        /* Hiệu ứng khi ô bị khóa (Readonly) */
        .input-readonly { background-color: #f1f5f9 !important; cursor: not-allowed; color: #475569 !important; font-weight: 500; }
        
        .btn-back { display: block; margin-top: 2rem; color: var(--text-body, #475569); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: var(--transition); text-align: center; }
        .btn-back:hover { color: var(--primary); }
    </style>
</head>
<body>

    <main class="profile-wrapper">
        <div class="profile-card">
            
            <!-- Xem trước ảnh đại diện -->
            <div class="avatar-container">
                <i class="fas fa-user-tie" id="defaultAvatarIcon"></i>
                <img id="avatarImg" src="" alt="Avatar" style="display: none;">
            </div>

            <h2>Hồ sơ Giảng viên</h2>
            
            <!-- KHU VỰC THÔNG TIN (CHỈ XEM) -->
            <div class="input-group">
                <label>Họ và tên</label>
                <input type="text" id="viewName" class="input-readonly" value="Đang tải..." readonly>
            </div>
            
            <div style="display: flex; gap: 15px;">
                <div class="input-group" style="flex: 1;">
                    <label>Học vị</label>
                    <input type="text" id="viewDegree" class="input-readonly" value="-" readonly>
                </div>
                <div class="input-group" style="flex: 2;">
                    <label>Chức vụ</label>
                    <input type="text" id="viewPosition" class="input-readonly" value="-" readonly>
                </div>
            </div>

            <div class="input-group">
                <label>Email đăng nhập</label>
                <input type="text" id="viewEmail" class="input-readonly" value="-" readonly>
            </div>

            <a href="dashboard.html" class="btn-back"><i class="fas fa-arrow-left" style="margin-right: 5px;"></i> Quay về Bảng điều khiển</a>
        </div>
    </main>

    <!-- CẤU HÌNH FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <script>
        const viewName = document.getElementById('viewName');
        const viewDegree = document.getElementById('viewDegree');
        const viewPosition = document.getElementById('viewPosition');
        const viewEmail = document.getElementById('viewEmail');
        
        const avatarImg = document.getElementById('avatarImg');
        const defaultAvatarIcon = document.getElementById('defaultAvatarIcon');

        // Tải dữ liệu hồ sơ từ Firebase
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                // Hiển thị Email Auth
                viewEmail.value = user.email;

                // Lấy thông tin từ Firestore
                firebase.firestore().collection("users").doc(user.uid).get().then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        
                        viewName.value = data.fullName || "Chưa cập nhật";
                        viewDegree.value = data.degree || "Chưa cập nhật";
                        viewPosition.value = data.position || "Giảng viên";
                        
                        if (data.avatar) {
                            avatarImg.src = data.avatar;
                            avatarImg.style.display = "block";
                            defaultAvatarIcon.style.display = "none";
                        }
                    } else {
                        viewName.value = "Hồ sơ lỗi hoặc chưa tồn tại";
                    }
                }).catch(() => {
                    viewName.value = "Lỗi kết nối CSDL";
                });
            } else {
                window.location.replace("login.html");
            }
        });
    </script>
</body>
</html>
