<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bảng điều khiển dành cho Giảng viên Bộ môn Phục hồi chức năng.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdnjs.cloudflare.com https://www.gstatic.com https://*.firebaseio.com https://*.googleapis.com; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' https://www.gstatic.com;">
    <title>Bảng điều khiển Giảng viên - Bộ môn Phục hồi chức năng</title>
    
    <link rel="icon" href="images/logo_Bộ môn.png" type="image/png">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- CSS HEADER DASHBOARD --- */
        .btn-logout { display: inline-flex; align-items: center; justify-content: center; background-color: var(--text-body); color: var(--surface); padding: 0.5rem 1.2rem; border-radius: var(--radius-pill); font-weight: 500; font-size: 0.9rem; border: none; cursor: pointer; transition: var(--transition); }
        .btn-logout:hover { background-color: var(--accent); }
        
        .user-profile-header { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-dark); font-weight: 600; font-size: 0.95rem; transition: var(--transition); padding: 4px 10px; border-radius: var(--radius-pill); background: var(--surface); border: 1px solid var(--border); margin-right: 15px; }
        .user-profile-header:hover { border-color: var(--primary); }
        .user-profile-header img, .user-profile-header .header-avatar-placeholder { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: var(--bg-page); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; color: var(--text-body); }

        .dashboard-welcome { display: flex; align-items: center; gap: 20px; margin-bottom: 2.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
        
        /* --- CSS AVATAR UPLOAD --- */
        .dashboard-avatar { position: relative; width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary); background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--text-body); flex-shrink: 0; overflow: hidden; cursor: pointer; box-shadow: var(--shadow-sm); transition: 0.3s; }
        .dashboard-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 35%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; color: white; font-size: 0.9rem; transform: translateY(100%); transition: 0.3s; }
        .dashboard-avatar:hover .avatar-overlay { transform: translateY(0); }
        .avatar-loading { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: var(--primary); z-index: 10; border-radius: 50%; }
        
        .dashboard-welcome-text h2 { font-size: 1.6rem; color: var(--text-dark); margin-bottom: 0.3rem; }
        .dashboard-welcome-text p { color: var(--text-body); font-size: 0.95rem; }
        
        .badge-role { display: inline-block; background: var(--primary); color: white; padding: 3px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; margin-top: 5px; }
        .badge-hod { background: #be123c; } 
        .badge-manager { background: #d97706; } 

        /* --- SMART HOVER CARDS (MINIMALIST STYLE) --- */
        .smart-card { position: relative; overflow: hidden; cursor: pointer; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); padding: 35px 20px; transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-shadow: var(--shadow-sm); }
        .smart-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-color: var(--primary); }
        .smart-card .icon-wrapper { width: 75px; height: 75px; border-radius: 50%; background-color: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin-bottom: 15px; transition: transform 0.3s ease; position: relative; }
        .smart-card:hover .icon-wrapper { transform: scale(1.1); }
        .smart-card h3 { color: var(--text-dark); font-size: 1.15rem; margin-bottom: 0; font-weight: 700; text-transform: uppercase; }
        
        /* Chấm đỏ thông báo Notification trên Icon */
        .card-notif-badge { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; font-size: 0.8rem; font-weight: bold; padding: 4px 8px; border-radius: 20px; border: 3px solid white; animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        .hidden { display: none !important; }

        @media (min-width: 769px) {
            .quick-links { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; justify-content: center; }
        }
        @media (max-width: 768px) {
            .btn-logout { width: 100%; margin-top: 0.5rem; }
            .user-profile-header { margin: 10px 20px; justify-content: center; }
            .dashboard-welcome { flex-direction: column; text-align: center; gap: 10px; }
            .quick-links { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
            .smart-card { padding: 25px 10px; }
            .smart-card .icon-wrapper { width: 60px; height: 60px; font-size: 1.5rem; margin-bottom: 15px; }
            .smart-card h3 { font-size: 0.95rem; }
        }
    </style>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">
    
    <div id="header-placeholder"></div>

    <main style="flex: 1; padding-top: 2rem; max-width: 1000px; margin: 0 auto; width: 100%; padding-left: 5%; padding-right: 5%;">
        
        <div class="dashboard-welcome">
            <div id="dashboardAvatarContainer" class="dashboard-avatar" title="Nhấn để thay đổi ảnh đại diện">
                <i class="fas fa-user" id="defaultAvatarIcon"></i>
                <div class="avatar-overlay"><i class="fas fa-camera"></i></div>
                <div id="avatarLoading" class="avatar-loading hidden"><i class="fas fa-spinner fa-spin"></i></div>
            </div>
            <!-- Input file ẩn -->
            <input type="file" id="avatarInput" accept="image/png, image/jpeg, image/jpg, image/webp" class="hidden">

            <div class="dashboard-welcome-text">
                <h2 id="welcomeTitle">Xin chào, Giảng viên</h2>
                <div id="roleBadgeContainer">
                    <span class="badge-role" id="roleBadge">Giảng viên</span>
                </div>
            </div>
        </div>

        <section class="quick-links" style="margin-bottom: 3rem;">
            
            <div class="smart-card" onclick="window.location.href='thong-bao-ca-nhan.html'">
                <div class="icon-wrapper" style="color: #ef4444; background-color: #fee2e2;">
                    <i class="fas fa-bell"></i>
                    <span id="cardNotifBadge" class="card-notif-badge hidden">0</span>
                </div>
                <h3>Thông báo</h3>
            </div>

            <div class="smart-card" onclick="window.location.href='phan-cong-cong-tac.html'">
                <div class="icon-wrapper" style="color: #be123c; background-color: #ffe4e6;"><i class="fas fa-sitemap"></i></div>
                <h3>Phân công công tác</h3>
            </div>

            <div class="smart-card" onclick="window.location.href='thoi-khoa-bieu.html'">
                <div class="icon-wrapper" style="color: #f59e0b; background-color: #fef3c7;"><i class="fas fa-table"></i></div>
                <h3>Thời khóa biểu</h3>
            </div>

            <div class="smart-card" onclick="window.location.href='lich-cong-tac.html'">
                <div class="icon-wrapper" style="color: #0ea5e9; background-color: #e0f2fe;"><i class="fas fa-calendar-plus"></i></div>
                <h3>Lịch bộ môn</h3>
            </div>

            <div class="smart-card" onclick="window.location.href='lich-ca-nhan.html'">
                <div class="icon-wrapper" style="color: #10b981; background-color: #dcfce7;"><i class="fas fa-calendar-check"></i></div>
                <h3>Lịch cá nhân</h3>
            </div>

            <div class="smart-card" onclick="window.location.href='quan-ly-nguoi-hoc.html'">
                <div class="icon-wrapper" style="color: #3b82f6; background-color: #eff6ff;"><i class="fas fa-user-graduate"></i></div>
                <h3>Quản lý người học</h3>
            </div>
            
            <div class="smart-card" onclick="window.location.href='gio-giang.html'">
                <div class="icon-wrapper" style="color: #8b5cf6; background-color: #ede9fe;"><i class="fas fa-calculator"></i></div>
                <h3>Giờ giảng</h3>
            </div>

        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/layout.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDVT4akTw65Uj6KHymwWtQ9xyHVyfTlXIY",
            authDomain: "bmphcn-aa9c6.firebaseapp.com",
            projectId: "bmphcn-aa9c6",
            storageBucket: "bmphcn-aa9c6.firebasestorage.app",
            messagingSenderId: "749494392719",
            appId: "1:749494392719:web:f220c751ff541620045dfa",
            measurementId: "G-LBLG62PTDK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserName = '';
        let currentUserUid = '';

        // --- HỆ THỐNG XỬ LÝ UPLOAD ẢNH ĐẠI DIỆN ---
        const avatarContainer = document.getElementById('dashboardAvatarContainer');
        const avatarInput = document.getElementById('avatarInput');
        const avatarLoading = document.getElementById('avatarLoading');

        avatarContainer.addEventListener('click', () => {
            avatarInput.click();
        });

        avatarInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            // Kiểm tra dung lượng (Tối đa 3MB)
            if (file.size > 3 * 1024 * 1024) {
                alert("Dung lượng ảnh quá lớn! Vui lòng chọn ảnh dưới 3MB.");
                avatarInput.value = '';
                return;
            }

            avatarLoading.classList.remove('hidden');

            try {
                // Nén ảnh bằng Canvas HTML5 sang Base64
                const reader = new FileReader();
                reader.readAsDataURL(file);
                
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = async () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        // Kích thước chuẩn vuông 250x250 để lưu cực nhẹ
                        const size = 250;
                        canvas.width = size;
                        canvas.height = size;
                        
                        // Cắt cúp khung hình vuông tỷ lệ 1:1
                        const minDimension = Math.min(img.width, img.height);
                        const startX = (img.width - minDimension) / 2;
                        const startY = (img.height - minDimension) / 2;
                        
                        ctx.drawImage(img, startX, startY, minDimension, minDimension, 0, 0, size, size);
                        
                        // Xuất ảnh ra chuỗi Base64 với chất lượng 80%
                        const base64Avatar = canvas.toDataURL('image/jpeg', 0.8);
                        
                        // Lưu lên Firestore
                        await updateDoc(doc(db, "users", currentUserUid), {
                            avatar: base64Avatar
                        });

                        // Cập nhật giao diện ngay lập tức
                        let imgElement = avatarContainer.querySelector('img');
                        if (!imgElement) {
                            imgElement = document.createElement('img');
                            avatarContainer.insertBefore(imgElement, avatarContainer.firstChild);
                            const icon = document.getElementById('defaultAvatarIcon');
                            if (icon) icon.remove();
                        }
                        imgElement.src = base64Avatar;

                        // Cập nhật avatar trên thanh Menu ngang
                        const navAvatar = document.querySelector('.header-avatar-placeholder');
                        if (navAvatar) {
                            navAvatar.outerHTML = `<img src="${base64Avatar}" alt="Avatar" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover;">`;
                        }

                        alert("Cập nhật ảnh đại diện thành công!");
                    };
                };
            } catch (error) {
                console.error("Lỗi cập nhật ảnh: ", error);
                alert("Đã xảy ra lỗi khi tải ảnh lên. Vui lòng thử lại!");
            } finally {
                avatarLoading.classList.add('hidden');
                avatarInput.value = ''; // Reset input
            }
        });

        // --- KIỂM TRA ĐĂNG NHẬP & TẠO HEADER ---
        setTimeout(() => {
            const welcomeTitle = document.getElementById('welcomeTitle');
            const roleBadge = document.getElementById('roleBadge');
            const navLinks = document.getElementById('nav-links');
            const btnAuthNav = document.getElementById('btnAuthNav');

            if (btnAuthNav) btnAuthNav.remove(); 
            
            if (navLinks) {
                // Tạo User Profile
                const profileBtn = document.createElement('a');
                profileBtn.href = "profile.html";
                profileBtn.className = "user-profile-header";
                profileBtn.innerHTML = `
                    <div class="header-avatar-placeholder" id="navAvatarPlaceholder"><i class="fas fa-user"></i></div>
                    <span id="headerNameDisplay">Đang tải...</span>
                `;

                // Tạo nút Đăng xuất
                const logoutBtn = document.createElement('button');
                logoutBtn.className = "btn-logout";
                logoutBtn.innerHTML = `<i class="fas fa-sign-out-alt" style="margin-right: 6px;"></i> Đăng xuất`;
                
                logoutBtn.addEventListener('click', async () => {
                    await signOut(auth);
                    window.location.href = "login.html";
                });

                navLinks.appendChild(profileBtn);
                navLinks.appendChild(logoutBtn);
            }

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    // CẤM TRUY CẬP NẾU LÀ TÀI KHOẢN LỚP (Sinh viên/Học viên)
                    if (user.email.toLowerCase() === 'ths.phcn26@ump.edu.vn') {
                        window.location.href = "thong-bao.html";
                        return;
                    }

                    currentUserUid = user.uid; // Lấy UID
                    try {
                        const userDoc = await getDoc(doc(db, "users", user.uid));
                        
                        if (userDoc.exists()) {
                            const data = userDoc.data();
                            
                            let titleName = data.fullName || "Giảng viên";
                            if (data.degree) {
                                let degreePrefix = data.degree === 'ThS' ? 'ThS. ' : (data.degree === 'TS' ? 'TS. ' : '');
                                titleName = `${degreePrefix}${data.fullName}`;
                                currentUserName = titleName; 
                            }
                            
                            document.getElementById('headerNameDisplay').innerText = titleName;
                            welcomeTitle.innerText = `Xin chào, ${titleName}`;

                            // Hiển thị ảnh đại diện cũ (nếu có)
                            if (data.avatar) {
                                document.getElementById('navAvatarPlaceholder').outerHTML = `<img src="${data.avatar}" alt="Avatar" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover;">`;
                                const icon = document.getElementById('defaultAvatarIcon');
                                if (icon) icon.remove();
                                
                                let imgElement = avatarContainer.querySelector('img');
                                if (!imgElement) {
                                    imgElement = document.createElement('img');
                                    avatarContainer.insertBefore(imgElement, avatarContainer.firstChild);
                                }
                                imgElement.src = data.avatar;
                            }

                            const email = user.email.toLowerCase();
                            if (email === 'lethanhvan@ump.edu.vn') {
                                roleBadge.innerText = "Trưởng Bộ Môn";
                                roleBadge.className = "badge-role badge-hod";
                            } 
                            else if (email === 'phanthenguyenpt@ump.edu.vn') {
                                roleBadge.innerText = "Giáo vụ";
                                roleBadge.className = "badge-role badge-manager";
                            } 
                            else {
                                roleBadge.innerText = "Giảng viên";
                                roleBadge.className = "badge-role";
                            }

                            scanForNotifications();

                        }
                    } catch (error) {
                        console.error("Lỗi tải dữ liệu người dùng:", error);
                    }
                } else {
                    window.location.href = "login.html";
                }
            });
        }, 150);

        // --- QUÉT THÔNG BÁO VÀ HIỂN THỊ LÊN THẺ THÔNG BÁO ---
        function scanForNotifications() {
            const cardNotifBadge = document.getElementById('cardNotifBadge');
            
            onSnapshot(collection(db, "assignments"), (snapshot) => {
                let history = JSON.parse(localStorage.getItem('notif_history_' + currentUserUid)) || {};
                let currentTasks = [];
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const subId = doc.id;

                    ['THS2025', 'THS2026'].forEach(cls => {
                        if (data[cls] && data[cls].status === 'approved' && data[cls].allocations) {
                            data[cls].allocations.forEach(a => {
                                if (a.gv && a.gv.includes(currentUserName)) {
                                    currentTasks.push({
                                        key: `${subId}_${cls}_${a.task}_${a.student || ''}`,
                                        assigned: a.assigned,
                                        note: a.note,
                                        role: a.role
                                    });
                                }
                            });
                        }
                    });
                });

                let currentKeys = new Set(currentTasks.map(t => t.key));
                let unreadCount = 0;

                currentTasks.forEach(task => {
                    let h = history[task.key];
                    if (!h) {
                        unreadCount++;
                    } else if (h.isDeleted) {
                        unreadCount++;
                    } else {
                        let isSignificantChange = (h.assigned !== task.assigned || h.note !== task.note || h.role !== task.role);
                        if (isSignificantChange) {
                            unreadCount++;
                        } else if (h.read === false) {
                            unreadCount++;
                        }
                    }
                });

                for (let key in history) {
                    if (!currentKeys.has(key)) {
                        let h = history[key];
                        if (!h.isDeleted) {
                            unreadCount++;
                        } else if (h.read === false) {
                            unreadCount++;
                        }
                    }
                }

                if (unreadCount > 0) {
                    cardNotifBadge.classList.remove('hidden');
                    cardNotifBadge.innerText = unreadCount > 99 ? '99+' : unreadCount;
                } else {
                    cardNotifBadge.classList.add('hidden');
                }
            });
        }
    </script>
</body>
</html>
