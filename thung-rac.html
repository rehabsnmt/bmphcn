<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Thùng rác & Lịch sử sao lưu - Bộ môn Phục hồi chức năng.">
    <title>Thùng Rác & Lịch Sử Sao Lưu - Bộ môn PHCN</title>

    <link rel="icon" href="images/logo_Bộ môn.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        html, body { min-height: 100vh; margin: 0; padding: 0; display: flex; flex-direction: column; background: var(--bg-page); }
        #header-placeholder { flex-shrink: 0; transition: 0.3s; z-index: 1001; position: relative;}
        
        main { flex: 1; max-width: 1200px; width: 96%; margin: 20px auto; box-sizing: border-box; }

        .top-toolbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--surface); border-bottom: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; box-shadow: var(--shadow-sm); flex-wrap: wrap; gap: 15px; }
        .top-toolbar h2 { margin: 0; font-size: clamp(1.1rem, 3vw, 1.4rem); color: var(--text-dark); display: flex; align-items: center; gap: 8px; font-weight: 800; text-transform: uppercase; }

        .controls-wrapper { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .filter-select { padding: 8px 12px; font-size: 0.9rem; font-weight: 600; border-radius: 6px; border: 1px solid var(--border); outline: none; cursor: pointer; color: var(--text-dark); background: white; }

        /* Table Styling */
        .table-container { background: white; border-radius: 8px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: left; }
        th, td { padding: 12px 15px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        th { background: #f8fafc; font-weight: 700; color: #475569; text-transform: uppercase; font-size: 0.8rem; }
        tr:hover { background-color: #f1f5f9; }

        .badge-type { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .badge-delete { background-color: #fef2f2; color: #ef4444; border: 1px solid #fca5a5; }
        .badge-update { background-color: #fefce8; color: #b45309; border: 1px solid #fde047; }

        .btn-action { padding: 6px 10px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; font-size: 0.8rem; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px; }
        .btn-restore { background-color: #10b981; color: white; }
        .btn-restore:hover { background-color: #059669; }
        .btn-purge { background-color: #ef4444; color: white; }
        .btn-purge:hover { background-color: #dc2626; }
        .btn-view { background-color: #0ea5e9; color: white; }
        .btn-view:hover { background-color: #0284c7; }

        /* Modal View JSON */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 2000; padding: 10px; }
        .modal-content { background: white; width: 95%; max-width: 600px; border-radius: 8px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); overflow: hidden; display: flex; flex-direction: column; }
        .modal-header { padding: 15px 20px; background: var(--primary); color: white; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { margin: 0; font-size: 1.1rem; }
        .modal-body { padding: 20px; max-height: 60vh; overflow-y: auto; background: #0f172a; color: #38bdf8; font-family: monospace; font-size: 0.85rem; line-height: 1.5; border-radius: 6px; margin: 15px; }
        .modal-footer { padding: 12px 20px; background: #f1f5f9; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--border); }

        .toast-container { position: fixed; top: 80px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { min-width: 250px; background-color: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 12px; transform: translateX(120%); transition: 0.4s; font-weight: 600; border-left: 5px solid #22c55e; opacity: 0; }
        .toast.show { transform: translateX(0); opacity: 1; }
        .toast.danger { border-left-color: #ef4444; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>
    <div id="toastContainer" class="toast-container"></div>

    <main>
        <div class="top-toolbar">
            <h2><i class="fas fa-trash-alt" style="color: #ef4444;"></i> THÙNG RÁC & LỊCH SỬ SAO LƯU</h2>
            <div class="controls-wrapper">
                <select id="filterCollection" class="filter-select" onchange="renderRecycleBin()">
                    <option value="ALL">-- Tất cả Bảng Dữ liệu --</option>
                    <option value="calendar_events">Thời khóa biểu / Lịch dạy</option>
                    <option value="assignments">Phân công công tác</option>
                    <option value="subjects">Danh mục Môn học</option>
                    <option value="learners">Danh sách Học viên</option>
                    <option value="theses">Đề tài Luận văn</option>
                </select>

                <button class="btn-action btn-purge" onclick="emptyTrashBin()" title="Xóa sạch toàn bộ thùng rác">
                    <i class="fas fa-broom"></i> Dọn sạch Thùng rác
                </button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 50px; text-align: center;">STT</th>
                        <th>Thời gian lưu</th>
                        <th>Loại Dữ liệu</th>
                        <th>Hành động</th>
                        <th>Tên / Mô tả mục</th>
                        <th>Người thực hiện</th>
                        <th style="width: 220px; text-align: center;">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="recycleTableBody">
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 20px;"><i class="fas fa-spinner fa-spin"></i> Đang tải dữ liệu thùng rác...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div id="detailModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Chi tiết Dữ liệu Sao lưu</h3>
                <span style="cursor: pointer; font-weight: bold; font-size: 1.2rem;" onclick="document.getElementById('detailModal').classList.add('hidden')">✕</span>
            </div>
            <div class="modal-body" id="modalJsonBody">
                </div>
            <div class="modal-footer">
                <button class="btn-action btn-secondary" style="background:#cbd5e1; color:#0f172a;" onclick="document.getElementById('detailModal').classList.add('hidden')">Đóng</button>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="js/layout.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";
        import { getFirestore, doc, collection, onSnapshot, setDoc, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDVT4akTw65Uj6KHymwWtQ9xyHVyfTlXIY", authDomain: "bmphcn-aa9c6.firebaseapp.com", projectId: "bmphcn-aa9c6", storageBucket: "bmphcn-aa9c6.firebasestorage.app", messagingSenderId: "749494392719", appId: "1:749494392719:web:f220c751ff541620045dfa" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let recycleData = [];
        let currentUserEmail = '';

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            let icon = type === 'danger' ? 'fa-exclamation-triangle' : 'fa-check-circle';
            toast.innerHTML = `<i class="fas ${icon}" style="font-size: 1.2rem; color: ${type==='danger'?'#ef4444':'#22c55e'};"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3000);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserEmail = user.email.toLowerCase();
                
                // Lắng nghe dữ liệu Bảng 'recycle' Realtime
                onSnapshot(collection(db, "recycle"), (snapshot) => {
                    recycleData = [];
                    snapshot.forEach(docSnap => {
                        let data = docSnap.data();
                        data.recycleId = docSnap.id;
                        recycleData.push(data);
                    });

                    // Sắp xếp thời gian mới nhất lên đầu
                    recycleData.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                    window.renderRecycleBin();
                }, (error) => {
                    console.error("Lỗi lấy dữ liệu thùng rác:", error);
                    showToast("Bạn không có quyền truy cập Thùng rác!", "danger");
                });

            } else {
                window.location.href = "login.html";
            }
        });

        const collectionNameMap = {
            'calendar_events': 'Thời khóa biểu',
            'assignments': 'Phân công công tác',
            'subjects': 'Danh mục Môn học',
            'learners': 'Danh sách Học viên',
            'theses': 'Luận văn / Đề án'
        };

        window.renderRecycleBin = () => {
            const tbody = document.getElementById('recycleTableBody');
            const filterCol = document.getElementById('filterCollection').value;
            tbody.innerHTML = '';

            let filtered = recycleData;
            if (filterCol !== 'ALL') {
                filtered = recycleData.filter(item => item.originalCollection === filterCol);
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #94a3b8; padding: 30px;"><i class="fas fa-inbox fa-2x"></i><br>Thùng rác trống.</td></tr>`;
                return;
            }

            filtered.forEach((item, index) => {
                let dateStr = item.timestamp ? new Date(item.timestamp).toLocaleString('vi-VN') : 'Chưa rõ';
                let colName = collectionNameMap[item.originalCollection] || item.originalCollection;
                
                let actionBadge = item.actionType === 'DELETE' 
                    ? `<span class="badge-type badge-delete"><i class="fas fa-trash"></i> Đã xóa</span>`
                    : `<span class="badge-type badge-update"><i class="fas fa-edit"></i> Bản cũ (Đã sửa)</span>`;

                // Tìm tên hiển thị của mục
                let itemName = item.originalData.subject || item.originalData.name || item.originalData.title || item.originalData.fullName || item.originalDocId;

                tbody.innerHTML += `
                    <tr>
                        <td align="center" style="font-weight: bold; color: #94a3b8;">${index + 1}</td>
                        <td style="font-weight: 600; color: #334155;">${dateStr}</td>
                        <td><span style="font-weight: bold; color: var(--primary);">${colName}</span></td>
                        <td>${actionBadge}</td>
                        <td style="font-weight: bold; color: #0f172a;">${itemName}</td>
                        <td style="font-size: 0.85rem; color: #64748b;">${item.performedByName || item.performedByEmail || 'Hệ thống'}</td>
                        <td align="center">
                            <div style="display: flex; gap: 5px; justify-content: center;">
                                <button class="btn-action btn-view" onclick="viewDetail('${item.recycleId}')" title="Xem JSON gốc"><i class="fas fa-eye"></i></button>
                                <button class="btn-action btn-restore" onclick="restoreItem('${item.recycleId}')" title="Khôi phục dữ liệu"><i class="fas fa-undo"></i> Phục hồi</button>
                                <button class="btn-action btn-purge" onclick="deletePermanently('${item.recycleId}')" title="Xóa vĩnh viễn"><i class="fas fa-times"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        };

        window.viewDetail = (recycleId) => {
            const item = recycleData.find(i => i.recycleId === recycleId);
            if (!item) return;

            const modalBody = document.getElementById('modalJsonBody');
            modalBody.innerHTML = `<pre>${JSON.stringify(item.originalData, null, 2)}</pre>`;
            document.getElementById('detailModal').classList.remove('hidden');
        };

        // KHI BẤM KHÔI PHỤC (RESTORE)
        window.restoreItem = async (recycleId) => {
            const item = recycleData.find(i => i.recycleId === recycleId);
            if (!item) return;

            if (confirm(`Bạn có chắc muốn KHÔI PHỤC mục "${item.originalDocId}" về lại bảng gốc?`)) {
                try {
                    // 1. Trả lại dữ liệu về collection ban đầu
                    await setDoc(doc(db, item.originalCollection, item.originalDocId), item.originalData, { merge: true });
                    
                    // 2. Xóa mục này khỏi thùng rác
                    await deleteDoc(doc(db, "recycle", recycleId));

                    showToast("Đã khôi phục dữ liệu thành công!");
                } catch (e) {
                    showToast("Lỗi khôi phục: " + e.message, "danger");
                }
            }
        };

        // KHI BẤM XÓA VĨNH VIỄN 1 MỤC
        window.deletePermanently = async (recycleId) => {
            if (confirm("Hành động này sẽ XÓA VĨNH VIỄN bản sao lưu này và KHÔNG THỂ khôi phục lại. Bạn có chắc không?")) {
                try {
                    await deleteDoc(doc(db, "recycle", recycleId));
                    showToast("Đã xóa vĩnh viễn khỏi Thùng rác!");
                } catch (e) {
                    showToast("Lỗi xóa: " + e.message, "danger");
                }
            }
        };

        // KHI BẤM DỌN SẠCH THÙNG RÁC
        window.emptyTrashBin = async () => {
            if (recycleData.length === 0) {
                showToast("Thùng rác đang trống!", "danger");
                return;
            }

            if (confirm(`CẢNH BÁO: Bạn chuẩn bị XÓA SẠCH ${recycleData.length} mục trong thùng rác. Tiếp tục?`)) {
                try {
                    let promises = recycleData.map(item => deleteDoc(doc(db, "recycle", item.recycleId)));
                    await Promise.all(promises);
                    showToast("Đã dọn sạch thùng rác!");
                } catch (e) {
                    showToast("Lỗi dọn thùng rác: " + e.message, "danger");
                }
            }
        };
    </script>
</body>
</html>
