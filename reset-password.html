<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khôi phục mật khẩu - Bộ môn Phục hồi chức năng</title>
    
    <link rel="icon" href="images/logo_Bộ môn.png" type="image/png">
    
    <!-- Link CSS gốc để đồng bộ giao diện -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
            padding: 20px;
        }

        .auth-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .auth-icon {
            width: 60px;
            height: 60px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            margin: 0 auto 20px auto;
        }

        .auth-card h2 {
            margin-top: 0;
            color: var(--text-dark);
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .auth-card p {
            color: var(--text-body);
            font-size: 0.95rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            background-color: var(--bg-page);
            color: var(--text-dark);
            outline: none;
            transition: var(--transition);
            box-sizing: border-box;
            font-family: inherit;
        }

        .input-with-icon input:focus {
            border-color: var(--primary);
            background-color: var(--surface);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .input-with-icon .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }

        .input-with-icon .toggle-password:hover {
            color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        .btn-submit:hover:not(:disabled) {
            background-color: var(--primary-hover);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Thông báo trạng thái nếu không có token */
        #invalidState {
            display: none;
            color: #ef4444;
            background: #fef2f2;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #fecaca;
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Toast Container */
        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { min-width: 250px; background-color: var(--surface); color: var(--text-dark); padding: 15px 20px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 12px; transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 0.3s; font-weight: 600; border-left: 5px solid; opacity: 0; font-size: 0.95rem; }
        .toast.show { transform: translateX(0); opacity: 1; }
        .toast.success { border-left-color: #22c55e; }
        .toast.warning { border-left-color: #f59e0b; }
        .toast.danger { border-left-color: #ef4444; }
        .toast-icon { font-size: 1.2rem; }

        @media (max-width: 768px) {
            .auth-card { padding: 30px 20px; border-radius: 12px; }
            .toast-container { bottom: 10px; right: 10px; left: 10px; }
            .toast { width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; background-color: var(--bg-page);">

    <!-- HEADER CHUNG -->
    <div id="header-placeholder"></div>

    <!-- Khung chứa thông báo nổi -->
    <div id="toastContainer" class="toast-container"></div>

    <main style="flex: 1;">
        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="auth-icon">
                    <i class="fas fa-lock"></i>
                </div>
                <h2>Tạo mật khẩu mới</h2>
                <p>Vui lòng nhập mật khẩu mới cho tài khoản của bạn. Mật khẩu phải có ít nhất 6 ký tự.</p>

                <div id="invalidState">
                    <i class="fas fa-exclamation-circle"></i> Liên kết khôi phục không hợp lệ hoặc đã hết hạn. Vui lòng yêu cầu cấp lại mật khẩu mới.
                </div>

                <div id="resetFormArea">
                    <div class="form-group">
                        <label>Mật khẩu mới</label>
                        <div class="input-with-icon">
                            <input type="password" id="newPassword" placeholder="Nhập mật khẩu mới">
                            <i class="fas fa-eye toggle-password" onclick="toggleVisibility('newPassword', this)"></i>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Xác nhận mật khẩu mới</label>
                        <div class="input-with-icon">
                            <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu mới">
                            <i class="fas fa-eye toggle-password" onclick="toggleVisibility('confirmPassword', this)"></i>
                        </div>
                    </div>

                    <button id="btnSubmit" class="btn-submit" onclick="updatePassword()">
                        Cập nhật mật khẩu
                    </button>
                </div>
                
                <div style="margin-top: 20px; font-size: 0.9rem;">
                    <a href="dang-nhap.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">
                        <i class="fas fa-arrow-left"></i> Quay lại trang đăng nhập
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER CHUNG -->
    <div id="footer-placeholder"></div>

    <script src="js/layout.js"></script>

    <!-- JS TÍCH HỢP SUPABASE VÀ XỬ LÝ ĐỔI MẬT KHẨU -->
    <script>
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            let icon = 'fa-check-circle';
            if (type === 'warning') icon = 'fa-exclamation-triangle';
            if (type === 'danger') icon = 'fa-times-circle';
            toast.innerHTML = `<i class="fas ${icon} toast-icon"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400); 
            }, 3000);
        }

        // Ẩn/hiện mật khẩu
        window.toggleVisibility = function(inputId, iconElement) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                iconElement.classList.remove("fa-eye");
                iconElement.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                iconElement.classList.remove("fa-eye-slash");
                iconElement.classList.add("fa-eye");
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            // Kiểm tra xem Supabase đã load chưa
            let attempts = 0;
            const timer = setInterval(() => {
                attempts++;
                if (window.supabaseClient) {
                    clearInterval(timer);
                    initRecoveryCheck();
                } else if (attempts >= 50) {
                    clearInterval(timer);
                    showToast("Lỗi kết nối hệ thống. Vui lòng tải lại trang.", "danger");
                }
            }, 100);
        });

        async function initRecoveryCheck() {
            // Khi người dùng bấm link trong email, Supabase sẽ tự động đăng nhập tạm thời
            // Chúng ta lắng nghe sự kiện auth để đảm bảo họ đang ở trạng thái có thể đổi mật khẩu
            window.supabaseClient.auth.onAuthStateChange((event, session) => {
                if (event === "PASSWORD_RECOVERY") {
                    console.log("Đã kích hoạt chế độ khôi phục mật khẩu.");
                }
            });

            // Có thể kiểm tra thêm Hash trên URL nếu muốn chắc chắn
            const hash = window.location.hash;
            if (!hash && !window.location.search.includes('code=')) {
                // Nếu URL hoàn toàn sạch sẽ, mà họ không có session, thì báo lỗi
                const { data } = await window.supabaseClient.auth.getSession();
                if (!data.session) {
                    document.getElementById('invalidState').style.display = 'block';
                    document.getElementById('resetFormArea').style.display = 'none';
                }
            }
        }

        async function updatePassword() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!newPassword || !confirmPassword) {
                return showToast("Vui lòng điền đầy đủ mật khẩu!", "warning");
            }

            if (newPassword !== confirmPassword) {
                return showToast("Mật khẩu xác nhận không khớp!", "warning");
            }

            if (newPassword.length < 6) {
                return showToast("Mật khẩu phải có ít nhất 6 ký tự!", "warning");
            }

            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang xử lý...';

            try {
                // Lệnh update password của Supabase (yêu cầu user phải đang có phiên bản khôi phục hợp lệ)
                const { data, error } = await window.supabaseClient.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                showToast("Cập nhật mật khẩu thành công! Đang chuyển hướng...", "success");
                
                // Đổi mật khẩu xong thì sign out để ép họ đăng nhập lại bằng MK mới cho an toàn
                await window.supabaseClient.auth.signOut();

                setTimeout(() => {
                    window.location.href = 'login.html'; // Điều chỉnh tên file nếu cần
                }, 2000);

            } catch (err) {
                showToast("Lỗi: " + err.message, "danger");
                btn.disabled = false;
                btn.innerHTML = 'Cập nhật mật khẩu';
            }
        }
    </script>
</body>
</html>
