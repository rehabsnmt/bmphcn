    <style>
        header { gap: 3rem; }

        .logo-link {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            cursor: pointer;
        }

        .logo-text { display: flex; flex-direction: column; justify-content: center; }
        .logo-text div { white-space: nowrap; width: max-content; line-height: 1.2; transform-origin: left; }
        #logo-line-1 { font-weight: 700; color: var(--text-dark, #0f172a); }
        #logo-line-2 { font-weight: 600; color: var(--text-body, #475569); margin-top: 0.25em; }
        #logo-line-3 { font-weight: 500; color: var(--text-body, #475569); margin-top: 0.15em; }

        footer { text-align: center; padding: 2rem 1rem; background-color: var(--surface, #ffffff); border-top: 1px solid var(--border, #e2e8f0); color: var(--text-body, #475569); margin-top: auto; overflow: hidden; }
        footer p { margin: 0; white-space: nowrap; font-size: clamp(0.55rem, 2.5vw, 0.9rem); }

        .intro-container { max-width: 1100px; margin: 0 auto; width: 100%; padding: 2.5rem 3%; }
        .section-title { text-align: center; margin-bottom: 3rem; }
        .section-title h2 { font-size: 2.2rem; color: var(--text-dark); margin-bottom: 0; }

        /* Lưới 3 cột rộng rãi, giúp khung thoải mái chứa tên dài */
        .faculty-grid { 
            display: grid; 
            grid-template-columns: repeat(3, minmax(0, 1fr)); 
            gap: 2.5rem; 
            align-items: stretch;
        }

        /* Khung card rộng rãi, đồng bộ chiều cao và rộng tuyệt đối */
        .faculty-card { 
            background: var(--surface); 
            border-radius: var(--radius-md, 16px); 
            padding: 2.8rem 1.8rem; 
            text-align: center; 
            border: 1px solid var(--border); 
            box-shadow: var(--shadow-sm); 
            transition: var(--transition); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }
        
        .faculty-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-hover); border-color: var(--primary); }

        .faculty-avatar { width: 115px; height: 115px; border-radius: 50%; object-fit: cover; margin-bottom: 1.2rem; border: 3px solid var(--primary); background: var(--bg-page); display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--text-body); box-shadow: 0 4px 10px rgba(2, 132, 199, 0.1); flex-shrink: 0; overflow: hidden; }
        .faculty-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .faculty-degree { 
            font-size: 0.9rem; 
            font-weight: 600; 
            color: var(--text-body); 
            margin-bottom: 0.2rem; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Tên giảng viên không ngắt dòng, thoải mái hiển thị trong khung rộng */
        .faculty-name { 
            font-size: 1.2rem; 
            font-weight: 700; 
            color: var(--text-dark); 
            margin-bottom: 0.4rem; 
            white-space: nowrap;
        }

        .faculty-position { font-size: 0.95rem; font-weight: 600; color: var(--primary); margin-bottom: 0.8rem; }
        
        .faculty-email { 
            font-size: 0.85rem; 
            color: var(--text-body); 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            margin-top: auto; 
            word-break: break-all; 
        }

        .loading-state, .empty-state { grid-column: 1 / -1; text-align: center; padding: 4rem 0; color: var(--text-body); font-size: 1.1rem; }

        @media (max-width: 900px) {
            .faculty-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 600px) {
            header { gap: 1rem; }
            .faculty-grid { grid-template-columns: repeat(1, minmax(0, 1fr)); }
        }
    </style>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

        <script>
            function perfectAlignLogo() {
                const l1 = document.getElementById('logo-line-1');
                const l2 = document.getElementById('logo-line-2');
                const l3 = document.getElementById('logo-line-3');
                const logoImg = document.querySelector('.logo-link img');
                const logoText = document.querySelector('.logo-text');
                
                if (!l1 || !l2 || !l3 || !logoImg || !logoText) return;
                if (logoImg.complete === false || logoImg.naturalHeight === 0) {
                    logoImg.onload = perfectAlignLogo; return;
                }

                const isMobile = window.innerWidth <= 768;
                const baseFontSize = isMobile ? 16.8 : 22.4; 
                l1.style.fontSize = '20px'; l2.style.fontSize = '20px'; l3.style.fontSize = '20px';
                
                const w1 = l1.getBoundingClientRect().width;
                const w2 = l2.getBoundingClientRect().width;
                const w3 = l3.getBoundingClientRect().width;
                
                let targetWidth = (w1 / 20) * baseFontSize;
                const applySizes = (width) => {
                    l1.style.fontSize = (20 * width / w1) + 'px';
                    l2.style.fontSize = (20 * width / w2) + 'px';
                    l3.style.fontSize = (20 * width / w3) + 'px';
                };
                applySizes(targetWidth);
                
                const imgHeight = logoImg.getBoundingClientRect().height || 48; 
                const textHeight = logoText.getBoundingClientRect().height; 
                if (textHeight > imgHeight && imgHeight > 0) {
                    targetWidth = targetWidth * (imgHeight / textHeight);
                    applySizes(targetWidth); 
                }
            }
            perfectAlignLogo(); window.addEventListener('resize', perfectAlignLogo); document.fonts.ready.then(perfectAlignLogo);
        </script>

    <script>
        const mobileMenu = document.getElementById('mobile-menu');
        const navLinks = document.getElementById('nav-links');
        const icon = mobileMenu.querySelector('i');

        mobileMenu.addEventListener('click', () => {
            navLinks.classList.toggle('active');

    <!-- Khai báo thư viện Firebase (để duy trì trạng thái nút Đăng nhập) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <script>
        // Xử lý đổi tên nút đăng nhập nếu có tài khoản Auth
        document.addEventListener("DOMContentLoaded", () => {
            const btnAuthNav = document.getElementById('btnAuthNav');
            if (typeof auth !== 'undefined' && typeof db !== 'undefined') {
                auth.onAuthStateChanged((user) => {
                    if (user) {
                        db.collection("users").where("email", "==", user.email).get()
                        .then((querySnapshot) => {
                            if (!querySnapshot.empty) {
                                const userData = querySnapshot.docs[0].data();
                                let degreePrefix = "";
                                if (userData.degree === 'ThS') degreePrefix = "ThS. ";
                                else if (userData.degree === 'TS') degreePrefix = "TS. ";
                                else if (userData.degree === 'CN') degreePrefix = "CN. ";
                                else if (userData.degree === 'PGS.TS') degreePrefix = "PGS.TS. ";
                                btnAuthNav.innerHTML = `<i class="fas fa-user-circle" style="margin-right: 5px;"></i> ${degreePrefix}${userData.fullName || 'Giảng viên'}`;
                            } else {
                                btnAuthNav.innerHTML = `<i class="fas fa-user-circle" style="margin-right: 5px;"></i> Giảng viên`;
                            }
                        }).catch(() => {});
                    } else {
                        btnAuthNav.innerHTML = 'Đăng nhập giảng viên';
                        btnAuthNav.href = "login.html";
                    }
                });
            }
        });

        // ==========================================
        // DANH SÁCH GIẢNG VIÊN (Dữ liệu tĩnh)
        // ==========================================
        const facultyGrid = document.getElementById('facultyGrid');

        const facultyList = [
            { degree: "Tiến sĩ", name: "Lê Thanh Vân", position: "Trưởng Bộ môn", email: "lethanhvan@ump.edu.vn", image: "images/TS. Lê Thanh Vân.jpg" },
            { degree: "Tiến sĩ", name: "Nguyễn Thanh Duy", position: "Phó trưởng Bộ môn", email: "thduypt@ump.edu.vn", image: "images/TS. Nguyễn Thanh Duy.jpg" },
            { degree: "Thạc sĩ", name: "Phan Thế Nguyên", position: "Giáo vụ Sau Đại học", email: "phanthenguyenpt@ump.edu.vn", image: "images/ThS. Phan Thế Nguyên.jpg" },
            { degree: "Thạc sĩ", name: "Nguyễn Mai Ngọc Đoan", position: "Giáo vụ Đại học", email: "nguyenmaingocdoan@ump.edu.vn", image: "images/ThS. Nguyễn Mai Ngọc Đoan.jpg" },
            { degree: "Thạc sĩ", name: "Trần Hữu Đức", position: "Giáo vụ Đại học", email: "tranhuuduc@ump.edu.vn", image: "images/ThS. Trần Hữu Đức.jpg" },
            { degree: "Thạc sĩ", name: "Huỳnh Chung", position: "Giảng viên", email: "huynhchungpt@ump.edu.vn", image: "images/ThS. Huỳnh Chung.jpg" },
            { degree: "Thạc sĩ", name: "Nguyễn Minh Sang", position: "Giảng viên", email: "ngmsangpt@ump.edu.vn", image: "images/ThS. Nguyễn Minh Sang.jpg" },
            { degree: "Thạc sĩ", name: "Trần Thị Bích Hạnh", position: "Giảng viên", email: "hanhtranpt@ump.edu.vn", image: "images/ThS. Trần Thị Bích Hạnh.jpg" },
            { degree: "Tiến sĩ", name: "Nguyễn Ngọc Minh", position: "Giảng viên", email: "minhngpt@ump.edu.vn", image: "images/TS. Nguyễn Ngọc Minh.jpg" },
            { degree: "Thạc sĩ", name: "Nguyễn Đức Sinh", position: "Giảng viên", email: "nguyenducsinhpt@ump.edu.vn", image: "images/ThS. Nguyễn Đức Sinh.jpg" },
            { degree: "Thạc sĩ", name: "Trần Long Biên", position: "Giảng viên", email: "tlbien@ump.edu.vn", image: "images/ThS. Trần Long Biên.jpg" },

            { degree: "Thạc sĩ", name: "Cao Minh Hạnh", position: "Giáo viên trung học", email: "cmhanhpt@ump.edu.vn", image: "images/ThS. Cao Minh Hạnh.jpg" },
            { degree: "Thạc sĩ", name: "Phạm Ngọc Đạt", position: "Giảng viên", email: "", image: "images/ThS. Phạm Ngọc Đạt.jpg" }
        ];

        // Hàm render ngay lập tức khi load trang
        function renderFaculty() {
            facultyGrid.innerHTML = ""; 

            facultyList.forEach((data) => {
                const card = document.createElement('div');
                card.className = 'faculty-card';

                // Xử lý fallback cho đường link email
                const emailHtml = data.email 
                    ? `<a href="mailto:${data.email}" style="color: inherit; text-decoration: none;">${data.email}</a>` 
                    : `<span style="font-style: italic; color: #94a3b8;">Đang cập nhật</span>`;

                // Xử lý fallback cho đường dẫn ảnh (nếu hỏng hoặc không có, tự đưa về icon)
                const avatarHtml = `<img src="${data.image}" alt="Ảnh ${data.name}" onerror="this.onerror=null; this.parentElement.innerHTML='<i class=\\'fas fa-user\\' style=\\'font-size: 3rem; color: var(--text-body);\\'></i>';">`;

                card.innerHTML = `
                    <div class="faculty-avatar">
                        ${avatarHtml}
                    </div>
                    <div class="faculty-degree">${data.degree}</div>
                    <div class="faculty-name">${data.name}</div>
                    <div class="faculty-position">${data.position}</div>
                    <div class="faculty-email">
                        <i class="fas fa-envelope" style="margin-right: 6px; color: var(--primary);"></i> ${emailHtml}
                    </div>
                `;

                facultyGrid.appendChild(card);
            });
        }

        renderFaculty();
    </script>
