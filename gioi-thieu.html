<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Đội ngũ giảng viên Bộ môn Phục hồi chức năng.">
    <title>Giới thiệu Giảng viên - Bộ môn Phục hồi chức năng</title>
    
    <link rel="icon" href="images/logo_Bộ môn.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        header { gap: 3rem; }
        .logo-link { display: flex; align-items: center; gap: 15px; text-decoration: none; cursor: pointer; }
        .logo-text { display: flex; flex-direction: column; justify-content: center; }
        #logo-line-1 { font-weight: 700; color: var(--text-dark, #0f172a); }
        #logo-line-2 { font-weight: 600; color: var(--text-body, #475569); }
        #logo-line-3 { font-weight: 500; color: var(--text-body, #475569); }

        footer { text-align: center; padding: 2rem; background: var(--surface); border-top: 1px solid var(--border); margin-top: auto; }

        .intro-container { max-width: 1100px; margin: 0 auto; width: 100%; padding: 2.5rem 3%; }
        .section-title { text-align: center; margin-bottom: 3rem; }

        /* Container chứa lưới giảng viên */
        .faculty-grid { 
            position: relative;
            min-height: 400px;
            display: grid; 
            grid-template-columns: repeat(3, minmax(0, 1fr)); 
            gap: 2.5rem; 
        }

        .faculty-card { 
            background: var(--surface); border-radius: 16px; padding: 2.5rem 1.5rem; 
            text-align: center; border: 1px solid var(--border); box-shadow: var(--shadow-sm); 
            display: flex; flex-direction: column; align-items: center; height: 100%;
        }

        .faculty-avatar { width: 115px; height: 115px; border-radius: 50%; object-fit: cover; margin-bottom: 1.2rem; border: 3px solid var(--primary); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 3rem; }
        .faculty-degree { font-size: 0.85rem; font-weight: 600; color: var(--text-body); text-transform: uppercase; margin-bottom: 0.2rem; }
        .faculty-name { font-size: 1.15rem; font-weight: 700; color: var(--text-dark); margin-bottom: 0.4rem; white-space: nowrap; }
        .faculty-position { font-size: 0.9rem; font-weight: 600; color: var(--primary); margin-bottom: 0.8rem; }
        .faculty-email { font-size: 0.8rem; color: var(--text-body); margin-top: auto; }

        /* Fix lỗi nhảy chữ khi load */
        .loading-state {
            position: absolute; width: 100%; top: 50px; text-align: center; color: var(--text-body);
        }
    </style>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">
    
    <header>
        <a href="index.html" class="logo-link">
            <div class="logo"><img src="images/logo_Bộ môn.png" alt="Logo"></div>
            <div class="logo-text">
                <div id="logo-line-1">Bộ môn Phục hồi chức năng</div>
                <div id="logo-line-2">Trường Điều dưỡng - Kỹ thuật Y học</div>
                <div id="logo-line-3">Đại học Y Dược Thành Phố Hồ Chí Minh</div>
            </div>
        </a>
        <nav class="nav-links" id="nav-links">
            <a href="gioi-thieu.html" class="nav-item" style="color: var(--primary);">Giới thiệu</a>
            <a href="login.html" class="btn-login">Đăng nhập</a>
        </nav>
    </header>

    <main style="flex: 1; padding-top: 2rem;">
        <div class="intro-container">
            <div class="section-title"><h2>Đội ngũ Giảng viên</h2></div>
            <div class="faculty-grid" id="facultyGrid">
                <div class="loading-state">
                    <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--primary);"></i>
                    <p>Đang tải danh sách...</p>
                </div>
            </div>
        </div>
    </main>

    <footer><p>&copy; 2026 Bộ môn Phục hồi chức năng.</p></footer>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <script>
        const facultyGrid = document.getElementById('facultyGrid');
        function getFullDegreeText(d) {
            if (d === 'CN') return 'Cử nhân';
            if (d === 'ThS') return 'Thạc sĩ';
            if (d === 'TS') return 'Tiến sĩ';
            return d || '';
        }

        firebase.firestore().collection("users").get().then((snapshot) => {
            facultyGrid.innerHTML = "";
            let list = [];
            snapshot.forEach(doc => list.push(doc.data()));

            list.sort((a, b) => {
                const rank = (p) => p === "Trưởng Bộ môn" ? 1 : p === "Phó Trưởng Bộ môn" ? 2 : 3;
                if (rank(a.position) !== rank(b.position)) return rank(a.position) - rank(b.position);
                return (a.fullName || "").localeCompare(b.fullName || "", 'vi');
            });

            list.forEach(data => {
                const card = document.createElement('div');
                card.className = 'faculty-card';
                card.innerHTML = `
                    <div class="faculty-avatar">${data.avatar ? `<img src="${data.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">` : '<i class="fas fa-user"></i>'}</div>
                    <div class="faculty-degree">${getFullDegreeText(data.degree)}</div>
                    <div class="faculty-name">${data.fullName}</div>
                    <div class="faculty-position">${data.position || 'Giảng viên'}</div>
                    <div class="faculty-email"><i class="fas fa-envelope"></i> ${data.email || ''}</div>
                `;
                facultyGrid.appendChild(card);
            });
        });
    </script>
</body>
</html>
