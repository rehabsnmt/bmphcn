<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đội ngũ Giảng viên - Bộ môn Phục hồi chức năng</title>
    
    <link rel="icon" href="images/logo_Bộ môn.png" type="image/png">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* CSS tối ưu cho Grid để không bao giờ bị nhảy layout */
        .faculty-grid { 
            display: grid; 
            grid-template-columns: repeat(4, minmax(0, 1fr)); 
            gap: 2rem; 
            min-height: 400px;
            margin-top: 2rem;
            margin-bottom: 4rem;
        }

        .faculty-card { 
            background: var(--surface); 
            border-radius: var(--radius-md); 
            padding: 2rem 1.5rem; 
            text-align: center; 
            border: 1px solid var(--border); 
            box-shadow: var(--shadow-sm); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            height: 100%; 
            transition: var(--transition);
        }

        .faculty-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary-light);
        }

        .faculty-name { 
            font-weight: 700; 
            color: var(--text-dark); 
            font-size: 1.1rem; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
            margin-top: 0.5rem;
        }

        .faculty-avatar-box {
            width: 100px; 
            height: 100px; 
            border-radius: 50%; 
            overflow: hidden; 
            margin-bottom: 1rem; 
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--border);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .faculty-avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Giúp ảnh không bị méo, tự động cắt vừa khung tròn */
        }

        @media (max-width: 1024px) { .faculty-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (max-width: 768px) { .faculty-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 480px) { .faculty-grid { grid-template-columns: repeat(1, minmax(0, 1fr)); } }
    </style>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

    <!-- HEADER DÙNG CHUNG -->
    <header>
        <a href="index.html" class="logo-link">
            <div class="logo" style="margin: 0; border: none; padding: 0;">
                <img src="images/logo_Bộ môn.png" alt="Logo Bộ môn Phục hồi chức năng">
            </div>
            <div class="logo-text">
                <div id="logo-line-1" style="font-weight: 700; color: var(--text-dark);">Bộ môn Phục hồi chức năng</div>
                <div id="logo-line-2" style="font-size: 0.85rem; color: var(--text-body);">Trường Điều dưỡng - Kỹ thuật Y học</div>
                <div id="logo-line-3" style="font-size: 0.85rem; color: var(--text-body);">Đại học Y Dược Thành Phố Hồ Chí Minh</div>
            </div>
        </a>
        <div class="menu-toggle" id="mobile-menu" aria-label="Menu"><i class="fas fa-bars"></i></div>
        <nav class="nav-links" id="nav-links">
            <a href="gioi-thieu.html" class="nav-item" style="color:var(--primary); font-weight: 600;">Giới thiệu</a>
            <a href="cong-bo.html" class="nav-item">Công bố khoa học</a>
            <a href="luan-van.html" class="nav-item">Luận văn & Khóa luận</a>
            <a href="tai-nguyen.html" class="nav-item">Tài nguyên</a>
            <a href="thong-bao.html" class="nav-item">Thông báo</a>
            <a href="login.html" class="btn-login" id="btnAuthNav">Đăng nhập</a>
        </nav>
    </header>

    <main style="flex: 1; padding: 2rem 5%; max-width: 1200px; margin: 0 auto; width: 100%;">
        <div class="section-title" style="text-align: center; margin-bottom: 2rem;">
            <h2 style="font-size: 2rem; color: var(--text-dark); margin: 0;">ĐỘI NGŨ GIẢNG VIÊN</h2>
            <div style="font-size: 1rem; color: var(--text-body); font-weight: 600; margin-top: 5px;">BỘ MÔN PHỤC HỒI CHỨC NĂNG</div>
        </div>
        
        <div class="faculty-grid" id="facultyGrid">
            <!-- Dữ liệu sẽ được render bằng Javascript ngay lập tức -->
        </div>
    </main>

    <footer style="text-align: center; padding: 2rem; color: var(--text-body); font-size: 0.9rem; border-top: 1px solid var(--border); margin-top: auto;">
        <p>&copy; 2026 Bộ môn Phục hồi chức năng. Mọi quyền được bảo lưu.</p>
    </footer>

    <!-- SCRIPT KIỂM TRA TRẠNG THÁI ĐĂNG NHẬP TRÊN HEADER -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <script>
        // Xử lý Menu Mobile
        const mobileMenu = document.getElementById('mobile-menu');
        const navLinks = document.getElementById('nav-links');
        mobileMenu.addEventListener('click', () => { navLinks.classList.toggle('active'); });

        // Xử lý Nút Đăng nhập trên thanh Nav
        document.addEventListener("DOMContentLoaded", () => {
            const btnAuthNav = document.getElementById('btnAuthNav');
            if (typeof auth !== 'undefined' && typeof db !== 'undefined') {
                auth.onAuthStateChanged((user) => {
                    if (user) {
                        db.collection("users").where("email", "==", user.email).get()
                        .then((querySnapshot) => {
                            if (!querySnapshot.empty) {
                                const userData = querySnapshot.docs[0].data();
                                let degreePrefix = "";
                                if (userData.degree === 'ThS') degreePrefix = "ThS. ";
                                else if (userData.degree === 'TS') degreePrefix = "TS. ";
                                else if (userData.degree === 'CN') degreePrefix = "CN. ";
                                else if (userData.degree === 'PGS.TS') degreePrefix = "PGS.TS. ";
                                btnAuthNav.innerHTML = `<i class="fas fa-user-circle" style="margin-right: 5px;"></i> ${degreePrefix}${userData.fullName || 'Giảng viên'}`;
                            } else {
                                btnAuthNav.innerHTML = `<i class="fas fa-user-circle" style="margin-right: 5px;"></i> Giảng viên`;
                            }
                        }).catch(() => { btnAuthNav.innerHTML = `<i class="fas fa-user-circle" style="margin-right: 5px;"></i> Giảng viên`; });
                    } else {
                        btnAuthNav.innerHTML = 'Đăng nhập';
                        btnAuthNav.href = "login.html";
                    }
                });
            }
        });

        // HIỂN THỊ DANH SÁCH GIẢNG VIÊN KÈM ẢNH
        const facultyList = [
            { name: "Lê Thanh Vân", position: "Trưởng Bộ môn", email: "lethanhvan@ump.edu.vn", image: "images/TS. Lê Thanh Vân.jpg" },
            { name: "Nguyễn Thanh Duy", position: "Phó trưởng Bộ môn", email: "thduypt@ump.edu.vn", image: "images/TS. Nguyễn Thanh Duy.jpg" },
            { name: "Phan Thế Nguyên", position: "Giáo vụ Sau Đại học", email: "phanthenguyenpt@ump.edu.vn", image: "images/ThS. Phan Thế Nguyên.jpg" },
            { name: "Nguyễn Mai Ngọc Đoan", position: "Giáo vụ Đại học", email: "nguyenmaingocdoan@ump.edu.vn", image: "images/ThS. Nguyễn Mai Ngọc Đoan.jpg" },
            { name: "Trần Hữu Đức", position: "Giáo vụ Đại học", email: "tranhuuduc@ump.edu.vn", image: "images/ThS. Trần Hữu Đức.jpg" },
            { name: "Huỳnh Chung", position: "Giảng viên", email: "huynhchungpt@ump.edu.vn", image: "images/ThS. Huỳnh Chung.jpg" },
            { name: "Nguyễn Minh Sang", position: "Giảng viên", email: "ngmsangpt@ump.edu.vn", image: "images/ThS. Nguyễn Minh Sang.jpg" },
            { name: "Trần Thị Bích Hạnh", position: "Giảng viên", email: "hanhtranpt@ump.edu.vn", image: "images/ThS. Trần Thị Bích Hạnh.jpg" },
            { name: "Nguyễn Ngọc Minh", position: "Giảng viên", email: "minhngpt@ump.edu.vn", image: "images/TS. Nguyễn Ngọc Minh.jpg" },
            { name: "Nguyễn Đức Sinh", position: "Giảng viên", email: "nguyenducsinhpt@ump.edu.vn", image: "images/ThS. Nguyễn Đức Sinh.jpg" },
            { name: "Trần Long Biên", position: "Giảng viên", email: "tlbien@ump.edu.vn", image: "images/ThS. Trần Long Biên.jpg" },
            { name: "Nguyễn Huỳnh Ngọc Mai Trâm", position: "Giảng viên", email: "", image: "images/ThS. Nguyễn Huỳnh Ngọc Mai Trâm.jpg" },
            { name: "Cao Minh Hạnh", position: "Giáo viên trung học", email: "cmhanhpt@ump.edu.vn", image: "images/ThS. Cao Minh Hạnh.jpg" },
            { name: "Phạm Ngọc Đạt", position: "Giảng viên", email: "", image: "images/ThS. Phạm Ngọc Đạt.jpg" }
        ];

        const facultyGrid = document.getElementById('facultyGrid');
        
        // Render ngay lập tức
        facultyGrid.innerHTML = ""; 
        
        facultyList.forEach(data => {
            const card = document.createElement('div');
            card.className = 'faculty-card';
            
            // Xử lý hiển thị email nếu rỗng
            const emailHtml = data.email 
                ? `<a href="mailto:${data.email}" style="color: inherit; text-decoration: none;">${data.email}</a>` 
                : `<span style="color: #94a3b8; font-style: italic;">Đang cập nhật</span>`;
                
            // Xử lý hiển thị ảnh (nếu có lỗi đường dẫn sẽ fallback về icon người)
            const imageHtml = data.image 
                ? `<img src="${data.image}" alt="Ảnh ${data.name}" onerror="this.onerror=null; this.outerHTML='<i class=\\'fas fa-user-tie\\' style=\\'font-size: 2.5rem; color: var(--primary);\\'></i>';">`
                : `<i class="fas fa-user-tie" style="font-size: 2.5rem; color: var(--primary);"></i>`;

            card.innerHTML = `
                <div class="faculty-avatar-box">
                    ${imageHtml}
                </div>
                <div class="faculty-name" title="${data.name}">${data.name}</div>
                <div class="faculty-position" style="color: var(--accent); font-weight: 600; margin: 0.5rem 0 0.8rem 0; font-size: 0.85rem; text-transform: uppercase;">
                    ${data.position}
                </div>
                <div class="faculty-email" style="font-size: 0.8rem; margin-top: auto; color: var(--text-body);">
                    <i class="fas fa-envelope" style="margin-right: 5px; color: var(--border);"></i>${emailHtml}
                </div>
            `;
            facultyGrid.appendChild(card);
        });
    </script>
</body>
</html>
