<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Thời khóa biểu Thạc sĩ 2026 - Bộ môn Phục hồi chức năng.">
    <title>Thời khóa biểu Thạc sĩ 2026 - Bộ môn Phục hồi chức năng</title>

    <link rel="icon" href="images/logo_Bộ môn.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- FullCalendar CSS & JS -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/vi.js'></script>

    <style>
        /* APP LAYOUT */
        html, body { min-height: 100vh; margin: 0; padding: 0; display: flex; flex-direction: column; background: var(--bg-page); }

        #header-placeholder { flex-shrink: 0; transition: 0.3s; z-index: 1001; position: relative;}
        /* Lớp ẩn Header khi cuộn chuột */
        body.header-hidden #header-placeholder { display: none !important; }

        #footer-placeholder { display: none; }

        /* Tiêu đề gọn nhẹ, luôn bám sát trên cùng (Sticky) */
        .top-toolbar { 
            position: sticky; 
            top: 75px; /* Chiều cao tương đương của Header */
            z-index: 990; /* Nằm dưới z-index của Header để không đè lên menu dropdown */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 15px 2%; 
            background: var(--surface); 
            border-bottom: 1px solid var(--border); 
            margin-bottom: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            transition: top 0.3s; 
        }
        
        /* Khi header ẩn, kéo Toolbar lên đỉnh màn hình */
        body.header-hidden .top-toolbar { top: 0; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }

        .top-toolbar h2 { margin: 0; font-size: clamp(1.2rem, 3.5vw, 1.5rem); color: var(--text-dark); font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Khu vực Lịch */
        main { flex: 1; max-width: 1000px; width: 100%; margin: 0 auto; padding: 0 3% 30px 3%; box-sizing: border-box; }

        /* Khung Lịch */
        #calendar-container { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 15px; box-shadow: var(--shadow-sm); overflow: hidden; }

        /* ĐIỀU CHỈNH FULLCALENDAR TOOLBAR CHỐNG ĐÈ NHAU */
        .fc-toolbar { flex-wrap: wrap; gap: 10px; margin-bottom: 15px !important; }
        .fc-toolbar-chunk { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; justify-content: center; }
        .fc-toolbar-title { font-size: clamp(1.1rem, 2.5vw, 1.3rem) !important; color: var(--primary); font-weight: 700; text-transform: capitalize; }
        
        /* Chỉnh Nút FullCalendar */
        .fc-button-primary { 
            background-color: var(--primary) !important; border-color: var(--primary) !important; 
            text-transform: capitalize; font-weight: 600 !important; 
            padding: 6px 12px !important; font-size: 0.9rem !important;
            border-radius: 6px !important; transition: 0.2s;
        }
        .fc-button-primary:hover, .fc-button-active { background-color: var(--primary-hover) !important; border-color: var(--primary-hover) !important; }
        .fc-button-primary:focus { box-shadow: none !important; }
        .fc-today-button { text-transform: capitalize !important; }

        /* TÙY CHỈNH THẺ SỰ KIỆN GOM NHÓM (GROUPED EVENT) TRÊN LỊCH */
        .fc-event-main { padding: 0 !important; }

        .evt-group-container {
            background: #f0f9ff; border: 1px solid #bae6fd;
            border-radius: 6px; padding: 8px; box-sizing: border-box;
            height: 100%; display: flex; flex-direction: column;
            overflow: hidden; border-left: 4px solid var(--primary);
            color: var(--text-dark);
        }
        .evt-group-header {
            font-size: 0.8rem; font-weight: 700; color: #64748b;
            margin-bottom: 6px; padding-bottom: 4px;
            border-bottom: 1px solid #e0f2fe;
            display: flex; align-items: center; justify-content: flex-start;
        }
        .evt-items-list { flex: 1; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 8px; }
        
        .evt-item { display: flex; flex-direction: column; gap: 2px; }
        .evt-item-row1 { display: flex; gap: 6px; align-items: flex-start; }
        .evt-room-badge { 
            background: #fbbf24; color: #78350f; font-weight: 800; font-size: 0.7rem; 
            padding: 2px 4px; border-radius: 3px; flex-shrink: 0; min-width: 22px; text-align: center; margin-top: 1px;
        }
        .evt-gv-name { font-size: 0.75rem; font-weight: 700; color: var(--text-dark); line-height: 1.3; }
        .evt-item-row2 { font-size: 0.75rem; color: var(--primary); padding-left: 28px; line-height: 1.3; font-weight: 600; }

        .hidden { display: none !important; }

        /* Tooltip Rà chuột */
        #eventTooltip { position: fixed; z-index: 9999; background: rgba(15, 23, 42, 0.95); color: white; padding: 12px 15px; border-radius: 8px; font-size: 0.9rem; pointer-events: none; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.3); line-height: 1.6; max-width: 300px; border-left: 4px solid var(--primary); }

        /* Modal Chi tiết chung */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 2000; padding: 10px; }
        .modal-content { background: white; width: 95%; max-width: 500px; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); overflow: hidden; display: flex; flex-direction: column; }
        .modal-header { padding: 15px 20px; background: var(--primary); color: white; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { margin: 0; font-size: 1.1rem; }
        .modal-body { padding: 20px; line-height: 1.8; text-align: left; overflow-y: auto; max-height: 70vh;}
        .modal-footer { padding: 15px 20px; background: #f8fafc; display: flex; justify-content: flex-end; border-top: 1px solid var(--border); }
        .btn-secondary { background: white; color: var(--text-dark); border: 1px solid var(--border); padding: 8px 20px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-weight: 600; }
        .btn-secondary:hover { background: #e2e8f0; }

        /* Dành riêng cho Dạng danh sách trên Mobile */
        .mobile-list-item { padding: 8px 6px; border-bottom: 1px dashed #e2e8f0; text-align: left; line-height: 1.5; }

        /* TỐI ƯU HIỂN THỊ ĐIỆN THOẠI (Mobile Responsive) */
        @media (max-width: 768px) {
            #calendar-container { padding: 10px 5px; border-radius: 8px; border: none; box-shadow: none; }
            .top-toolbar { top: 60px; } /* Header mobile thường mỏng hơn một chút */

            /* Tái cấu trúc thanh Toolbar của FullCalendar trên Mobile */
            .fc-toolbar { flex-direction: column; gap: 8px; }
            .fc-toolbar-chunk:nth-child(1) { order: 2; width: 100%; justify-content: space-between; } /* Prev/Next/Today */
            .fc-toolbar-chunk:nth-child(2) { order: 1; width: 100%; margin-bottom: 5px; } /* Tiêu đề Tháng/Tuần */
            .fc-toolbar-chunk:nth-child(3) { order: 3; width: 100%; } /* Nút View Tab */
            
            .fc-button-primary { padding: 5px 10px !important; font-size: 0.8rem !important; }
            
            /* Ẩn cột thời gian trong lịch tuần để có chỗ trống */
            .fc .fc-timegrid-axis, .fc .fc-timegrid-slot-label { width: 0 !important; padding: 0 !important; border: none !important; }
            .fc .fc-timegrid-slot-label-cushion, .fc .fc-timegrid-axis-cushion { display: none !important; }

            /* Ép chữ Lịch không rớt dòng */
            .fc-event-main, .fc-list-event-title { white-space: nowrap !important; overflow: hidden !important; text-overflow: ellipsis !important; }
            
            .evt-group-container { padding: 4px; }
            .evt-group-header { font-size: clamp(0.6rem, 2vw, 0.75rem) !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .evt-item-row1 { flex-wrap: nowrap; overflow: hidden; min-width: 0; }
            .evt-gv-name { font-size: clamp(0.6rem, 2.2vw, 0.8rem) !important; white-space: nowrap !important; overflow: hidden; text-overflow: ellipsis; display: block; }
            .evt-item-row2 { font-size: clamp(0.6rem, 2.2vw, 0.8rem) !important; white-space: nowrap !important; overflow: hidden; text-overflow: ellipsis; padding-left: 22px; display: block; }
            .evt-room-badge { font-size: clamp(0.55rem, 2vw, 0.7rem) !important; min-width: auto; padding: 1px 4px; }
            
            /* Dạng List gọn gàng */
            .mobile-list-item { font-size: clamp(0.7rem, 2.5vw, 0.9rem); }
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>
    <div id="eventTooltip"></div>

    <div class="top-toolbar">
        <h2>THỜI KHÓA BIỂU LỚP THS2026</h2>
    </div>

    <main>
        <!-- KHUNG LỊCH CHÍNH -->
        <div id="calendar-container">
            <div id="calendar"></div>
        </div>
    </main>

    <!-- MODAL CHI TIẾT TỔ HỢP SỰ KIỆN -->
    <div id="multiEventModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header" id="multiEventModalHeader">
                <h3 id="multiEventModalTitle">Chi tiết Lịch học</h3>
                <span style="cursor: pointer; font-weight: bold; font-size: 1.2rem;" onclick="document.getElementById('multiEventModal').classList.add('hidden')">X</span>
            </div>
            <div class="modal-body" id="multiEventModalBody">
                <!-- Nội dung được đổ bằng JS -->
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="document.getElementById('multiEventModal').classList.add('hidden')">Đóng</button>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="js/layout.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDVT4akTw65Uj6KHymwWtQ9xyHVyfTlXIY", authDomain: "bmphcn-aa9c6.firebaseapp.com", projectId: "bmphcn-aa9c6", storageBucket: "bmphcn-aa9c6.firebasestorage.app", messagingSenderId: "749494392719", appId: "1:749494392719:web:f220c751ff541620045dfa" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // HIỆU ỨNG ẨN HEADER KHI CUỘN CHUỘT XUỐNG
        window.addEventListener('scroll', function() {
            if (window.scrollY > 60) {
                document.body.classList.add('header-hidden');
            } else {
                document.body.classList.remove('header-hidden');
            }
        });

        let calendar;
        let scheduledEvents = [];
        let subjectsData = [];
        let gvShortNameMap = {};

        // TỰ ĐỘNG CHỌN VIEW LIST NẾU LÀ MOBILE
        const isMobile = window.innerWidth <= 768;
        const initialCalendarView = isMobile ? 'listWeek' : 'timeGridWeek';

        // TẢI DỮ LIỆU CẦN THIẾT
        async function loadInitialData() {
            try {
                const snapSubjects = await getDocs(collection(db, "subjects"));
                subjectsData = [];
                snapSubjects.forEach(doc => {
                    const d = doc.data();
                    d.id = doc.id;
                    subjectsData.push(d);
                });

                const snapUser = await getDocs(collection(db, "users"));
                snapUser.forEach(doc => {
                    const d = doc.data();
                    if(d.fullName) {
                        let pref = d.degree === 'ThS' ? 'ThS. ' : (d.degree === 'TS' ? 'TS. ' : '');
                        let savedName = `${pref}${d.fullName}`; 
                        let nameParts = d.fullName.trim().split(' ');
                        let firstName = nameParts[nameParts.length - 1]; 
                        let genderPref = d.gender === 'm' ? 'Thầy ' : (d.gender === 'f' ? 'Cô ' : 'GV ');
                        gvShortNameMap[savedName] = `${genderPref}${firstName}`;
                    }
                });

                const snapVisiting = await getDocs(collection(db, "visiting_lecturers"));
                snapVisiting.forEach(doc => {
                    const d = doc.data();
                    if (d.name && d.gender) {
                        let nameParts = d.name.trim().split(' ');
                        let firstName = nameParts[nameParts.length - 1]; 
                        let genderPref = d.gender === 'm' ? 'Thầy ' : (d.gender === 'f' ? 'Cô ' : 'GV ');
                        gvShortNameMap[d.name] = `${d.name}`; 
                    } else if (d.name) {
                        gvShortNameMap[d.name] = `${d.name}`; 
                    }
                });

            } catch(e) { console.error("Lỗi lấy dữ liệu phụ:", e); }

            initCalendar();
            listenToDatabase();
        }

        window.formatGvName = (gvString) => {
            if (!gvString) return '';
            let gvs = gvString.split(/,|&/).map(s => s.trim());
            let shortGvs = gvs.map(gv => {
                if (gvShortNameMap[gv]) return gvShortNameMap[gv];
                return gv; 
            });
            return shortGvs.join(', ');
        };

        function listenToDatabase() {
            onSnapshot(collection(db, "calendar_events"), (snapshot) => {
                scheduledEvents = [];
                snapshot.forEach(doc => { scheduledEvents.push(doc.data()); });
                processAndRenderEvents();
            }, (error) => console.error("Lỗi lấy lịch:", error));
        }

        function initCalendar() {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                locale: 'vi',
                height: 'auto', 
                initialView: initialCalendarView, 
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'timeGridWeek,timeGridDay,listWeek'
                },
                slotMinTime: '07:00:00',
                slotMaxTime: '21:00:00',
                allDaySlot: false, 
                slotLabelFormat: { hour: 'numeric', minute: '2-digit', omitZeroMinute: false, meridiem: false, hour12: false },
                eventTimeFormat: { hour: 'numeric', minute: '2-digit', meridiem: false, hour12: false },
                editable: false, 
                droppable: false, 
                events: [],

                eventContent: function(arg) {
                    const props = arg.event.extendedProps;

                    if (props.type === 'grouped_normal') {
                        let sTime = arg.event.start ? arg.event.start.toLocaleTimeString('vi-VN', {hour: 'numeric', minute:'2-digit', hour12: false}) : '';
                        let eTime = '';
                        if (arg.event.end) {
                            eTime = arg.event.end.toLocaleTimeString('vi-VN', {hour: 'numeric', minute:'2-digit', hour12: false});
                        } else if (arg.event.start) {
                            let eObj = new Date(arg.event.start.getTime() + 4.5 * 3600000); 
                            eTime = eObj.toLocaleTimeString('vi-VN', {hour: 'numeric', minute:'2-digit', hour12: false});
                        }
                        const timeStr = `${sTime}–${eTime}`;

                        // Chế độ xem LIST WEEK (Điện thoại mặc định)
                        if (arg.view.type === 'listWeek' || arg.view.type === 'listDay') {
                            let listHtml = props.events.map(e => {
                                let gvDisplay = window.formatGvName(e.gv);
                                let shortRoom = e.room ? e.room.replace('Phòng ', 'P').replace('Hội trường', 'HT') : '??';
                                let orientHtml = e.orientation ? `<div style="font-size: 0.8rem; color: #64748b; margin-top: 2px;"><i class="fas fa-compass"></i> Định hướng: ${e.orientation}</div>` : '';
                                
                                return `
                                <div class="mobile-list-item">
                                    <div style="font-weight: bold; color: #b45309;"><i class="fas fa-map-marker-alt"></i> ${shortRoom}</div>
                                    <div style="font-weight: 700; color: var(--text-dark); margin-top: 2px;">${gvDisplay}</div>
                                    <div style="color: var(--primary); margin-top: 2px; white-space: normal; font-weight: 600;">${e.subject}</div>
                                    ${orientHtml}
                                </div>
                                `;
                            }).join('');
                            return { html: `<div>${listHtml}</div>` };
                        }

                        // Chế độ xem TIME GRID (Máy tính)
                        let headerHtml = `<div class="evt-group-header"><span>${timeStr}</span></div>`;

                        let itemsHtml = props.events.map(e => {
                            let gvDisplay = window.formatGvName(e.gv);
                            let shortRoom = e.room && e.room !== 'Khác...' ? e.room.replace('Phòng ', 'P').replace('Hội trường', 'HT') : '??';
                            let orientHtml = e.orientation ? `<div style="font-size: 0.75rem; color: #64748b; margin-top: 2px; font-style: italic;"><i class="fas fa-compass"></i> ĐH: ${e.orientation}</div>` : '';

                            return `
                            <div class="evt-item" style="margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed rgba(2, 132, 199, 0.2); text-align: left; line-height: 1.4;">
                                <div style="font-size: 0.75rem; font-weight: 800; color: #b45309;"><i class="fas fa-map-marker-alt"></i> ${shortRoom}</div>
                                <div style="font-size: 0.75rem; font-weight: 700; color: var(--text-dark); margin-top: 2px;">${gvDisplay}</div>
                                <div style="font-size: 0.75rem; color: var(--primary); margin-top: 2px; white-space: normal; word-break: break-word; font-weight: 600;">${e.subject}</div>
                                ${orientHtml}
                            </div>
                            `;
                        }).join('');

                        return {
                            html: `
                            <div class="evt-group-container">
                                ${headerHtml}
                                <div class="evt-items-list">${itemsHtml}</div>
                            </div>
                            `
                        };
                    }
                },

                eventMouseEnter: function(info) {
                    const props = info.event.extendedProps;
                    const tooltip = document.getElementById('eventTooltip');

                    if (props.type === 'grouped_normal') {
                        let html = `<strong><i class="fas fa-layer-group"></i> Lịch học chi tiết</strong><br>`;
                        props.events.forEach(e => {
                            let gvDisplay = window.formatGvName(e.gv);
                            let orientHtml = e.orientation ? `<br><span style="font-size:0.8rem; color:#cbd5e1;"><i class="fas fa-compass"></i> Định hướng: ${e.orientation}</span>` : '';
                            html += `<div style="margin-top:6px; border-top:1px dashed rgba(255,255,255,0.2); padding-top:6px; line-height: 1.4; text-align: left;">
                                <span style="color:#fbbf24; font-weight:bold;">${e.room || '??'}</span> | <span style="color:#bae6fd;">${gvDisplay}</span><br>
                                <span style="font-size:0.85rem;">${e.subject}</span>
                                ${orientHtml}
                            </div>`;
                        });
                        tooltip.innerHTML = html;
                    }

                    tooltip.style.display = 'block';

                    const moveTooltip = (e) => {
                        let x = e.clientX + 15;
                        let y = e.clientY + 15;
                        const rect = tooltip.getBoundingClientRect();
                        if (x + rect.width > window.innerWidth) x = e.clientX - rect.width - 15;
                        if (y + rect.height > window.innerHeight) y = e.clientY - rect.height - 15;
                        tooltip.style.left = x + 'px';
                        tooltip.style.top = y + 'px';
                    };
                    moveTooltip(info.jsEvent);
                    info.el.addEventListener('mousemove', moveTooltip);
                    info.el._moveTooltip = moveTooltip; 
                },

                eventMouseLeave: function(info) {
                    const tooltip = document.getElementById('eventTooltip');
                    tooltip.style.display = 'none';
                    if (info.el._moveTooltip) {
                        info.el.removeEventListener('mousemove', info.el._moveTooltip);
                    }
                },

                eventClick: function(info) {
                    const props = info.event.extendedProps;
                    const modal = document.getElementById('multiEventModal');
                    const modalBody = document.getElementById('multiEventModalBody');

                    if (props.type === 'grouped_normal') {
                        let sTime = info.event.start ? info.event.start.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'}) : '';
                        let eTime = info.event.end ? info.event.end.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'}) : '';
                        if (!eTime && info.event.start) {
                            eTime = new Date(info.event.start.getTime() + 4.5*3600000).toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'});
                        }
                        const dateStr = info.event.start ? info.event.start.toLocaleDateString('vi-VN', {weekday: 'long', day:'2-digit', month:'2-digit', year:'numeric'}) : '';

                        let html = `<div style="color: var(--primary); font-weight:bold; font-size:1.1rem; margin-bottom:15px; border-bottom: 2px solid var(--border); padding-bottom:10px;">
                                        <i class="far fa-clock"></i> ${sTime} - ${eTime} (${dateStr})
                                    </div>`;

                        props.events.forEach(e => {
                            let orientHtml = e.orientation ? `<p style="margin:0 0 5px 0; color: var(--text-dark);"><strong>Định hướng:</strong> ${e.orientation}</p>` : '';
                            html += `
                            <div style="background:#f8fafc; border:1px solid #cbd5e1; border-radius:8px; padding:15px; margin-bottom:12px; text-align: left; line-height: 1.6;">
                                <p style="margin:0 0 5px 0; font-size: 1.05rem; font-weight: 700; color: var(--primary);">${e.subject}</p>
                                ${orientHtml}
                                <p style="margin:0 0 5px 0; color: var(--text-dark);"><strong>Phòng học:</strong> <span style="background:#fbbf24; color:#78350f; padding:2px 8px; border-radius:4px; font-weight:bold;">${e.room || 'Chưa XĐ'}</span></p>
                                <p style="margin:0 0 5px 0; color: var(--text-dark);"><strong>Giảng viên:</strong> <span style="font-weight:bold;">${e.gv}</span></p>
                                <p style="margin:0; font-size:0.9rem; color:#64748b;"><strong>Nhiệm vụ:</strong> ${e.task}</p>
                            </div>
                            `;
                        });

                        modalBody.innerHTML = html;
                        modal.classList.remove('hidden');
                    }
                }
            });
            calendar.render();
        }

        function processAndRenderEvents() {
            if (!calendar) return;

            calendar.removeAllEvents();
            
            // CHỈ LẤY LỊCH CỦA LỚP THS2026 VÀ KHÔNG BỊ TRẢ VỀ
            let ths2026Events = scheduledEvents.filter(e => e.class === 'THS2026' && e.status !== 'returned');

            // Xử lý loại bỏ trùng lặp nếu cần
            let deduplicatedEventsMap = new Map();
            ths2026Events.forEach(e => {
                let subObj = subjectsData.find(s => s.name === e.subject);
                let baseSubId = subObj ? subObj.id : e.subject; 
                let deduplicateKey = `${e.start}_${e.end}_${e.room}_${baseSubId}_${e.task}_${e.gv}`;

                if (!deduplicatedEventsMap.has(deduplicateKey)) {
                    deduplicatedEventsMap.set(deduplicateKey, e);
                }
            });
            let deduplicatedEvents = Array.from(deduplicatedEventsMap.values());

            let groupedEvents = {};

            deduplicatedEvents.forEach(e => {
                let sTime = new Date(e.start).getTime();
                let eTime = e.end ? new Date(e.end).getTime() : sTime + 4.5 * 3600 * 1000;
                let key = `${sTime}_${eTime}`;

                if (!groupedEvents[key]) {
                    groupedEvents[key] = {
                        start: e.start,
                        end: e.end,
                        allDay: e.allDay,
                        events: []
                    };
                }
                groupedEvents[key].events.push(e);
            });

            let currentClassEvents = [];
            for (let key in groupedEvents) {
                let group = groupedEvents[key];
                currentClassEvents.push({
                    id: 'group_' + key,
                    start: group.start,
                    end: group.end,
                    allDay: group.allDay,
                    backgroundColor: 'transparent',
                    borderColor: 'transparent',
                    textColor: '#0f172a',
                    extendedProps: {
                        type: 'grouped_normal',
                        events: group.events
                    }
                });
            }
            calendar.addEventSource(currentClassEvents);
        }

        // Khởi động
        loadInitialData();

    </script>
</body>
</html>
