<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nội dung Thông báo - Bộ môn Phục hồi chức năng</title>
    
    <link rel="icon" href="images/logo_Bộ môn.png" type="image/png">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        header { gap: 3rem; background: var(--surface, #ffffff); }
        .logo-link { display: flex; align-items: center; gap: 15px; text-decoration: none; cursor: pointer; }
        .logo-text { display: flex; flex-direction: column; justify-content: center; }
        .logo-text div { white-space: nowrap; width: max-content; line-height: 1.2; transform-origin: left; }
        #logo-line-1 { font-weight: 700; color: var(--text-dark, #0f172a); }
        #logo-line-2 { font-weight: 600; color: var(--text-body, #475569); margin-top: 0.25em; }
        #logo-line-3 { font-weight: 500; color: var(--text-body, #475569); margin-top: 0.15em; }
        footer { text-align: center; padding: 2rem 1rem; background-color: var(--surface, #ffffff); border-top: 1px solid var(--border, #e2e8f0); color: var(--text-body, #475569); margin-top: auto; overflow: hidden; }
        footer p { margin: 0; white-space: nowrap; font-size: clamp(0.55rem, 2.5vw, 0.9rem); }

        /* --- BỐ CỤC BÀI ĐỌC --- */
        main { max-width: 800px; padding: 2rem 3%; margin: 0 auto; width: 100%; box-sizing: border-box; }
        
        .btn-back { display: inline-flex; align-items: center; gap: 8px; color: var(--text-body); text-decoration: none; font-weight: 600; margin-bottom: 2rem; transition: var(--transition); }
        .btn-back:hover { color: var(--primary); }

        .article-card { background: var(--surface); padding: 2.5rem; border-radius: 12px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
        
        .article-tag { display: inline-block; padding: 4px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; margin-bottom: 1rem; }
        .tag-tuyensinh { background-color: #fef3c7; color: #166534; border: 1px solid #d1fae5; }
        .tag-daotao { background-color: #e0f2fe; color: #075985; border: 1px solid #bae6fd; }
        .tag-chung { background-color: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }

        .article-title { font-size: 2rem; font-weight: 800; color: var(--text-dark); margin: 0 0 1rem 0; line-height: 1.3; }
        
        .article-meta { display: flex; gap: 20px; font-size: 0.9rem; color: var(--text-body); padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); margin-bottom: 2rem; }
        .article-meta span { display: flex; align-items: center; gap: 6px; }

        .article-content { font-size: 1.05rem; line-height: 1.8; color: var(--text-dark); white-space: pre-wrap; /* Giữ nguyên định dạng ngắt dòng từ textarea */ }

        .loading-state { text-align: center; padding: 4rem 0; color: var(--text-body); }
        
        @media (max-width: 768px) { header { gap: 1rem; } .article-card { padding: 1.5rem; } .article-title { font-size: 1.5rem; } }
    </style>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; background-color: var(--bg-page);">

    <!-- HEADER -->
    <header>
        <a href="index.html" class="logo-link">
            <div class="logo" style="margin: 0; border: none; padding: 0;">
                <img src="images/logo_Bộ môn.png" alt="Logo Bộ môn Phục hồi chức năng">
            </div>
            <div class="logo-text">
                <div id="logo-line-1">Bộ môn Phục hồi chức năng</div>
                <div id="logo-line-2">Trường Điều dưỡng - Kỹ thuật Y học</div>
                <div id="logo-line-3">Đại học Y Dược Thành Phố Hồ Chí Minh</div>
            </div>
        </a>
        <div class="menu-toggle" id="mobile-menu" aria-label="Menu"><i class="fas fa-bars"></i></div>
        <nav class="nav-links" id="nav-links">
            <a href="gioi-thieu.html" class="nav-item">Giới thiệu</a>
            <a href="cong-bo.html" class="nav-item">Công bố khoa học</a>
            <a href="luan-van.html" class="nav-item">Luận văn & Khóa luận</a>
            <a href="tai-nguyen.html" class="nav-item">Tài nguyên</a>
            <a href="thong-bao.html" class="nav-item" style="color: var(--primary); font-weight: 600;">Thông báo</a>
            <a href="login.html" class="btn-login" id="btnAuthNav">Đăng nhập</a>
        </nav>
    </header>

    <main style="flex: 1;">
        <a href="thong-bao.html" class="btn-back"><i class="fas fa-arrow-left"></i> Quay lại danh sách thông báo</a>
        
        <div id="articleContainer" class="article-card">
            <div class="loading-state">
                <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 10px;"></i>
                <p>Đang tải nội dung...</p>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Bộ môn Phục hồi chức năng. Mọi quyền được bảo lưu.</p>
    </footer>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <script>
        // Xử lý Menu mobile & Auth Header
        document.getElementById('mobile-menu').addEventListener('click', () => { document.getElementById('nav-links').classList.toggle('active'); });
        
        firebase.auth().onAuthStateChanged((user) => {
            const btnAuthNav = document.getElementById('btnAuthNav');
            if (user) {
                db.collection("users").doc(user.uid).get().then(doc => {
                    if (doc.exists) {
                        let degreePrefix = doc.data().degree === 'ThS' ? 'ThS. ' : (doc.data().degree === 'TS' ? 'TS. ' : '');
                        btnAuthNav.innerHTML = `<i class="fas fa-user-circle"></i> ${degreePrefix}${doc.data().fullName || "Giảng viên"}`;
                    }
                });
            } else { btnAuthNav.innerHTML = 'Đăng nhập giảng viên'; }
        });

        // Hàm helper lấy class màu thẻ tag
        function getTagClass(cat) {
            if (cat === "Tuyển sinh") return "tag-tuyensinh";
            if (cat === "Đào tạo") return "tag-daotao";
            return "tag-chung";
        }

        // Lấy tham số ID từ URL
        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');
        const container = document.getElementById('articleContainer');

        if (!articleId) {
            container.innerHTML = '<div class="loading-state" style="color:var(--accent);"><i class="fas fa-exclamation-triangle" style="font-size:2rem;"></i><p>Không tìm thấy thông báo (Mã ID không hợp lệ).</p></div>';
        } else {
            db.collection("announcements").doc(articleId).get().then((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    
                    let dateStr = "Không rõ thời gian";
                    if (data.createdAt) {
                        const dateObj = data.createdAt.toDate();
                        dateStr = dateObj.toLocaleDateString('vi-VN') + ' - ' + dateObj.toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'});
                    }

                    container.innerHTML = `
                        <div class="article-tag ${getTagClass(data.category)}">${data.category}</div>
                        <h1 class="article-title">${data.title}</h1>
                        
                        <div class="article-meta">
                            <span><i class="fas fa-calendar-alt"></i> ${dateStr}</span>
                            <span><i class="fas fa-user-edit"></i> Đăng bởi: ${data.author || 'Hệ thống'}</span>
                        </div>

                        <div class="article-content">${data.content}</div>
                    `;
                } else {
                    container.innerHTML = '<div class="loading-state" style="color:var(--accent);"><i class="fas fa-search" style="font-size:2rem;"></i><p>Bài viết này đã bị xóa hoặc không tồn tại.</p></div>';
                }
            }).catch(err => {
                container.innerHTML = `<div class="loading-state"><p>Lỗi kết nối cơ sở dữ liệu: ${err.message}</p></div>`;
            });
        }
        
        // Căn chỉnh logo
        function perfectAlignLogo() {
            const l1 = document.getElementById('logo-line-1'); const l2 = document.getElementById('logo-line-2'); const l3 = document.getElementById('logo-line-3');
            const logoImg = document.querySelector('.logo-link img'); const logoText = document.querySelector('.logo-text');
            if (!l1 || !l2 || !l3 || !logoImg || !logoText) return;
            if (logoImg.complete === false || logoImg.naturalHeight === 0) { logoImg.onload = perfectAlignLogo; return; }
            const isMobile = window.innerWidth <= 768; const baseFontSize = isMobile ? 16.8 : 22.4; 
            l1.style.fontSize = '20px'; l2.style.fontSize = '20px'; l3.style.fontSize = '20px';
            const w1 = l1.getBoundingClientRect().width; const w2 = l2.getBoundingClientRect().width; const w3 = l3.getBoundingClientRect().width;
            let targetWidth = (w1 / 20) * baseFontSize;
            const applySizes = (w) => { l1.style.fontSize=(20*w/w1)+'px'; l2.style.fontSize=(20*w/w2)+'px'; l3.style.fontSize=(20*w/w3)+'px'; };
            applySizes(targetWidth);
            const imgHeight = logoImg.getBoundingClientRect().height || 48; const textHeight = logoText.getBoundingClientRect().height; 
            if (textHeight > imgHeight && imgHeight > 0) { targetWidth = targetWidth * (imgHeight / textHeight); applySizes(targetWidth); }
        }
        perfectAlignLogo(); window.addEventListener('resize', perfectAlignLogo); document.fonts.ready.then(perfectAlignLogo);
    </script>
</body>
</html>
