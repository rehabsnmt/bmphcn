<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Khu vực đăng nhập dành cho giảng viên Bộ môn Phục hồi chức năng.">
    <title>Đăng nhập Giảng viên - Bộ môn Phục hồi chức năng</title>
    
    <link rel="icon" href="images/logo_Bộ môn.png" type="image/png">
    <link rel="apple-touch-icon" href="images/logo_Bộ môn.png">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- CSS RIÊNG CHO KHU VỰC ĐĂNG NHẬP --- */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-page, #f8fafc);
            margin: 0;
        }

        .login-wrapper {
            width: 100%;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .login-card {
            background: var(--surface, #ffffff);
            width: 100%;
            max-width: 420px;
            padding: 3rem 2rem;
            border-radius: var(--radius-md, 16px);
            box-shadow: var(--shadow-hover, 0 12px 30px rgba(2, 132, 199, 0.08));
            border: 1px solid var(--border, #e2e8f0);
            text-align: center;
        }

        .login-card i.fa-user-shield {
            font-size: 3.5rem;
            color: var(--primary, #0284c7);
            margin-bottom: 1.5rem;
        }

        .login-card h2 {
            color: var(--text-dark, #0f172a);
            margin-bottom: 0.5rem;
            font-size: 1.6rem;
        }

        .login-card p {
            color: var(--text-body, #475569);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        /* --- FORM ĐĂNG NHẬP EMAIL --- */
        .input-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--border, #e2e8f0);
            border-radius: var(--radius-sm, 8px);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition, all 0.3s ease);
            background-color: var(--bg-page, #f8fafc);
            color: var(--text-dark, #0f172a);
        }

        .input-group input:focus {
            border-color: var(--primary, #0284c7);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
            background-color: var(--surface, #ffffff);
        }

        .btn-email-login {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--primary, #0284c7);
            color: white;
            border: none;
            border-radius: var(--radius-sm, 8px);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition, all 0.3s ease);
            box-shadow: var(--shadow-sm, 0 1px 2px rgba(2, 132, 199, 0.05));
            margin-bottom: 0.5rem;
        }

        .btn-email-login:hover {
            background-color: var(--primary-hover, #0369a1);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
        }
        
        .back-home {
            display: block;
            margin-top: 1.5rem;
            color: var(--primary, #0284c7);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition, all 0.3s ease);
        }
        
        .back-home:hover {
            text-decoration: underline;
        }

        .error-message {
            color: var(--accent, #e11d48);
            font-size: 0.85rem;
            margin-top: 1.5rem;
            display: none; 
            background: var(--accent-light, #fff1f2);
            padding: 0.8rem;
            border-radius: var(--radius-sm, 8px);
            border: 1px solid rgba(225, 29, 72, 0.2);
        }

        @media (max-width: 768px) {
            .login-card { padding: 2.5rem 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- NỘI DUNG CHÍNH (KHU VỰC ĐĂNG NHẬP) -->
    <main class="login-wrapper">
        <div class="login-card">
            <i class="fas fa-user-shield"></i>
            <h2>Đăng nhập hệ thống</h2>
            <p>Quý Thầy Cô vui lòng đăng nhập để truy cập hệ thống.</p>
            
            <!-- Form Đăng nhập bằng Email -->
            <form id="emailLoginForm" onsubmit="return false;">
                <div class="input-group">
                    <input type="email" id="inputEmail" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <input type="password" id="inputPassword" placeholder="Mật khẩu" required>
                </div>
                <button type="submit" id="btnEmailLogin" class="btn-email-login">Đăng nhập</button>
            </form>

            <!-- Khu vực hiển thị lỗi -->
            <div id="errorMessage" class="error-message">
                Đăng nhập thất bại. Vui lòng thử lại.
            </div>
            
            <!-- Nút quay lại trang chủ -->
            <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Quay lại Trang chủ</a>
        </div>
    </main>

    <!-- FIREBASE SƠ CẤP & CẤU HÌNH CỦA BẠN -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <!-- SCRIPT XỬ LÝ ĐĂNG NHẬP BẰNG EMAIL -->
    <script>
        const btnEmailLogin = document.getElementById('btnEmailLogin');
        const inputEmail = document.getElementById('inputEmail');
        const inputPassword = document.getElementById('inputPassword');
        const errorMsg = document.getElementById('errorMessage');

        // Hàm hiển thị lỗi bằng tiếng Việt
        function showError(message) {
            errorMsg.style.display = "block";
            errorMsg.innerText = message;
        }

        // 1. Kiểm tra trạng thái: Nếu đã đăng nhập, chuyển qua trang Quản lý
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                window.location.href = "dashboard.html"; 
            }
        });

        // 2. Xử lý sự kiện đăng nhập bằng Email/Password
        btnEmailLogin.addEventListener('click', () => {
            const email = inputEmail.value.trim();
            const password = inputPassword.value;

            if (!email || !password) {
                return; // Trình duyệt sẽ tự báo lỗi require do thuộc tính required trong thẻ input
            }

            // Gọi hàm đăng nhập bằng Email của Firebase
            firebase.auth().signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    console.log("Đăng nhập Email thành công:", userCredential.user.email);
                })
                .catch((error) => {
                    console.error("Lỗi đăng nhập Email:", error.code);
                    if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                        showError("Email hoặc mật khẩu không chính xác.");
                    } else if (error.code === 'auth/invalid-email') {
                        showError("Định dạng email không hợp lệ.");
                    } else if (error.code === 'auth/too-many-requests') {
                        showError("Bạn đã nhập sai quá nhiều lần. Vui lòng thử lại sau.");
                    } else {
                        showError("Đã xảy ra lỗi: " + error.message);
                    }
                });
        });
    </script>
</body>
</html>
