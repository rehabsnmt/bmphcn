<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Khu vực đăng nhập dành cho giảng viên Bộ môn Phục hồi chức năng.">
    <title>Xác thực Giảng viên - Bộ môn Phục hồi chức năng</title>
    
    <link rel="icon" href="images/logo_Bộ môn.png" type="image/png">
    <link rel="apple-touch-icon" href="images/logo_Bộ môn.png">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- CSS RIÊNG CHO KHU VỰC ĐĂNG NHẬP --- */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-page, #f8fafc);
            margin: 0;
        }

        .login-wrapper {
            width: 100%;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .login-card {
            background: var(--surface, #ffffff);
            width: 100%;
            max-width: 420px;
            padding: 3.5rem 2.5rem;
            border-radius: var(--radius-md, 16px);
            box-shadow: var(--shadow-hover, 0 12px 30px rgba(2, 132, 199, 0.08));
            border: 1px solid var(--border, #e2e8f0);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login-card img.login-logo {
            width: 90px;
            height: auto;
            margin-bottom: 1.5rem;
            object-fit: contain;
        }

        .login-card h2 {
            color: var(--text-dark, #0f172a);
            margin-bottom: 2rem;
            font-size: 1.8rem;
            font-weight: 700;
        }

        /* --- FORM --- */
        .input-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 0.9rem;
            border: 1px solid var(--border, #e2e8f0);
            border-radius: var(--radius-sm, 8px);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition, all 0.3s ease);
            background-color: var(--bg-page, #f8fafc);
            color: var(--text-dark, #0f172a);
            box-sizing: border-box;
            font-family: inherit;
        }

        .input-group input:focus {
            border-color: var(--primary, #0284c7);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
            background-color: var(--surface, #ffffff);
        }

        /* --- CÁC TIỆN ÍCH LIÊN KẾT --- */
        .form-options {
            display: flex;
            justify-content: flex-end;
            margin-top: -0.5rem;
            margin-bottom: 1.2rem;
        }

        .text-link {
            font-size: 0.85rem;
            color: var(--primary, #0284c7);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .text-link:hover {
            text-decoration: underline;
            color: var(--primary-hover, #0369a1);
        }

        /* --- NÚT BẤM --- */
        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            background-color: var(--primary, #0284c7);
            color: white;
            border: none;
            border-radius: var(--radius-sm, 8px);
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition, all 0.3s ease);
            box-shadow: var(--shadow-sm, 0 1px 2px rgba(2, 132, 199, 0.05));
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover, #0369a1);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
        }
        
        .btn-submit:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
        }

        .back-home {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--text-body, #475569);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition, all 0.3s ease);
        }
        
        .back-home:hover {
            color: var(--primary, #0284c7);
        }

        /* --- THÔNG BÁO --- */
        .message-box {
            font-size: 0.85rem;
            margin-top: 1.2rem;
            display: none; 
            padding: 0.8rem;
            border-radius: var(--radius-sm, 8px);
            text-align: left;
            line-height: 1.5;
        }
        .msg-error {
            color: var(--accent, #e11d48);
            background: var(--accent-light, #fff1f2);
            border: 1px solid rgba(225, 29, 72, 0.2);
        }
        .msg-success {
            color: #15803d;
            background: #f0fdf4;
            border: 1px solid rgba(21, 128, 61, 0.2);
        }

        .hidden { display: none !important; }

        @media (max-width: 768px) {
            .login-card { padding: 2.5rem 1.5rem; }
        }
    </style>
</head>
<body>

    <main class="login-wrapper">
        <div class="login-card">
            <img src="images/logo_Bộ môn.png" alt="Logo Bộ môn Phục hồi chức năng" class="login-logo">
            
            <!-- THÔNG BÁO CHUNG -->
            <div id="messageBox" class="message-box"></div>

            <!-- FORM ĐĂNG NHẬP -->
            <div id="loginView">
                <h2>Đăng nhập</h2>
                <form id="formLogin" onsubmit="return false;">
                    <div class="input-group">
                        <input type="email" id="loginEmail" placeholder="Email (@ump.edu.vn)" required>
                    </div>
                    <div class="input-group" style="margin-bottom: 0.5rem;">
                        <input type="password" id="loginPassword" placeholder="Mật khẩu" required>
                    </div>
                    
                    <div class="form-options">
                        <a id="btnForgotPassword" class="text-link">Quên mật khẩu?</a>
                    </div>

                    <button type="submit" id="btnLoginSubmit" class="btn-submit">Đăng nhập</button>
                </form>
            </div>

            <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Về Trang chủ</a>
        </div>
    </main>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <!-- SCRIPT XỬ LÝ -->
    <script>
        // --- 1. CÁC PHẦN TỬ DOM & HIỂN THỊ THÔNG BÁO ---
        const msgBox = document.getElementById('messageBox');

        function showMessage(msg, isSuccess = false) {
            msgBox.style.display = "block";
            msgBox.className = "message-box " + (isSuccess ? "msg-success" : "msg-error");
            msgBox.innerText = msg;
        }
        
        function hideMessage() { 
            msgBox.style.display = "none"; 
        }

        // Tự chuyển hướng nếu ĐÃ ĐĂNG NHẬP (Bỏ yêu cầu xác minh email theo code gốc)
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                window.location.href = "dashboard.html"; 
            }
        });

        // --- 2. LOGIC ĐĂNG NHẬP ---
        document.getElementById('btnLoginSubmit').addEventListener('click', () => {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value;
            if (!email || !pass) return showMessage("Vui lòng nhập Email và Mật khẩu.");
            
            hideMessage();
            const btnSubmit = document.getElementById('btnLoginSubmit');
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Đang xử lý...";

            firebase.auth().signInWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    // Chuyển hướng thẳng sang dashboard
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = "Đăng nhập";
                    
                    if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                        showMessage("Tài khoản hoặc mật khẩu không chính xác.");
                    } else if (error.code === 'auth/too-many-requests') {
                        showMessage("Bạn đã nhập sai quá nhiều lần. Vui lòng thử lại sau.");
                    } else {
                        showMessage("Lỗi: " + error.message);
                    }
                });
        });

        // --- 3. QUÊN MẬT KHẨU ---
        document.getElementById('btnForgotPassword').addEventListener('click', () => {
            const email = document.getElementById('loginEmail').value.trim();
            if (!email) {
                showMessage("Vui lòng nhập Email của bạn vào ô bên trên trước khi bấm 'Quên mật khẩu'.");
                document.getElementById('loginEmail').focus();
                return;
            }

            hideMessage();
            firebase.auth().sendPasswordResetEmail(email)
                .then(() => {
                    showMessage("Liên kết đặt lại mật khẩu đã được gửi đến " + email + ". Vui lòng kiểm tra hộp thư (kể cả thư rác).", true);
                })
                .catch((error) => {
                    if (error.code === 'auth/user-not-found') {
                        showMessage("Không tìm thấy tài khoản với email này.");
                    } else {
                        showMessage("Lỗi: " + error.message);
                    }
                });
        });
    </script>
</body>
</html>
