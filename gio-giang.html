<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Thống kê giờ giảng - Bộ môn Phục hồi chức năng.">
    <title>Thống kê Giờ giảng - Bộ môn Phục hồi chức năng</title>
    
    <link rel="icon" href="images/logo_Bộ môn.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* APP LAYOUT */
        html, body { min-height: 100vh; margin: 0; padding: 0; display: flex; flex-direction: column; background: var(--bg-page); }
        #header-placeholder { flex-shrink: 0; }
        #footer-placeholder { display: none; }

        main { max-width: 1500px; padding: 2rem 2%; margin: 0 auto; min-height: 75vh; width: 100%; box-sizing: border-box; }
        
        .header-title-box { text-align: center; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid var(--border); overflow: hidden; }
        .header-title-box h2 { font-size: clamp(1rem, 3.5vw, 1.6rem); color: var(--text-dark); margin: 0; font-weight: 700; white-space: nowrap; text-overflow: ellipsis; }
        .header-title-box .subtitle { font-size: clamp(0.65rem, 2.2vw, 1rem); color: var(--text-body); font-weight: 600; margin-top: 5px; white-space: nowrap; text-overflow: ellipsis; }

        .hidden { display: none !important; }
        
        /* Controls */
        .controls-wrapper { display: flex; flex-wrap: wrap; justify-content: flex-start; align-items: center; background: var(--surface); padding: 15px 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; gap: 15px; box-shadow: var(--shadow-sm); }
        .filter-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .filter-select { padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); outline: none; font-size: 0.95rem; font-weight: 600; color: var(--primary); background-color: #f0f9ff; cursor: pointer; border-color: #bae6fd; }

        /* Buttons */
        .btn-primary { background-color: var(--primary); color: white; padding: 0.6rem 1.2rem; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-primary:hover { background-color: var(--primary-hover); }

        /* Bảng */
        .table-container { overflow-x: auto; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow-sm); }
        table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
        th { background-color: #f8fafc; font-weight: bold; color: var(--text-dark); text-transform: uppercase; font-size: 0.85rem; position: sticky; top: 0; z-index: 10; border-bottom: 2px solid #cbd5e1; line-height: 1.4;}
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; white-space: nowrap; }
        .badge-cohuu { background: #dbeafe; color: #0369a1; border: 1px solid #7dd3fc;}
        .badge-thinhgiang { background: #fefce8; color: #b45309; border: 1px solid #fde047;}

        .cls-section { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed #e2e8f0; }
        .cls-section:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        .cls-title { font-weight: bold; color: #0369a1; font-size: 0.95rem; margin-bottom: 5px; }
        .cls-title.ths2026 { color: #b45309; }

        .breakdown { margin: 0; padding-left: 20px; color: #475569; font-size: 0.9rem; line-height: 1.6; }
        .breakdown li { margin-bottom: 4px; }
        .td-gv-name { font-weight: bold; color: var(--text-dark); font-size: 1.05rem; }

        /* Tiến độ */
        .progress-container { width: 100%; max-width: 150px; background-color: #e2e8f0; border-radius: 4px; margin-top: 5px; overflow: hidden; height: 6px; display: inline-block;}
        .progress-bar { height: 100%; background-color: #16a34a; transition: width 0.4s ease; }

        /* Toast */
        .toast-container { position: fixed; top: 80px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none;}
        .toast { min-width: 250px; background-color: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 12px; transform: translateX(120%); transition: 0.4s; font-weight: 600; border-left: 5px solid #22c55e; opacity: 0; }
        .toast.show { transform: translateX(0); opacity: 1; }
        .toast.danger { border-left-color: #ef4444; }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>
    <div id="toastContainer" class="toast-container"></div>

    <main>
        <div class="header-title-box">
            <h2>THỐNG KÊ GIỜ GIẢNG</h2>
            <div class="subtitle">THEO DÕI SỐ BUỔI PHÂN CÔNG VÀ TIẾN ĐỘ HOÀN THÀNH</div>
        </div>

        <div class="controls-wrapper">
            <div class="filter-controls">
                <span style="font-weight: 600; color: var(--text-body); font-size: 0.95rem;">Lọc theo Năm Học: </span>
                <select id="academicYear" class="filter-select" onchange="window.renderTable()">
                    <option value="2025-2026">Năm học 2025 - 2026</option>
                    <option value="2026-2027" selected>Năm học 2026 - 2027</option>
                    <option value="2027-2028">Năm học 2027 - 2028</option>
                </select>
                <button class="btn-primary" onclick="window.renderTable()"><i class="fas fa-sync-alt"></i> Tải lại</button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 50px; text-align: center;">STT</th>
                        <th style="width: 200px;">Tên Giảng Viên</th>
                        <th style="width: 120px; text-align: center;">Phân Loại</th>
                        <th style="min-width: 250px;">Số Buổi Phân Công (Dự kiến)</th>
                        <th style="min-width: 250px;">Số Buổi Đã Hoàn Thành</th>
                        <th style="width: 200px; text-align: center;">Tiến Độ (%)</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="6" style="text-align:center; padding:30px;"><i class="fas fa-spinner fa-spin"></i> Đang tính toán dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/layout.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDVT4akTw65Uj6KHymwWtQ9xyHVyfTlXIY", authDomain: "bmphcn-aa9c6.firebaseapp.com", projectId: "bmphcn-aa9c6", storageBucket: "bmphcn-aa9c6.firebasestorage.app", messagingSenderId: "749494392719", appId: "1:749494392719:web:f220c751ff541620045dfa" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let calendarEvents = [];
        let assignmentsData = {};
        let usersMap = {}; 
        let visitingMap = {}; 
        let currentUserName = '';

        const getYearConfig = (yearStr) => {
            if (yearStr === '2025-2026') return {
                'THS2025': ['Học kỳ 1', 'Học kỳ 2'],
                'THS2026': [],
                'start': '2025-08-01', 'end': '2026-07-31'
            };
            if (yearStr === '2026-2027') return {
                'THS2025': ['Học kỳ 3', 'Học kỳ 4'],
                'THS2026': ['Học kỳ 1', 'Học kỳ 2'],
                'start': '2026-08-01', 'end': '2027-07-31'
            };
            if (yearStr === '2027-2028') return {
                'THS2025': [],
                'THS2026': ['Học kỳ 3', 'Học kỳ 4'],
                'start': '2027-08-01', 'end': '2028-07-31'
            };
            return null;
        }

        window.showToast = (message, type = 'success') => {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3000);
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Nạp Data Cán bộ
                try {
                    const snapUsers = await getDocs(collection(db, "users"));
                    snapUsers.forEach(doc => {
                        const d = doc.data();
                        if(d.fullName) {
                            let pref = d.degree === 'ThS' ? 'ThS. ' : (d.degree === 'TS' ? 'TS. ' : '');
                            usersMap[`${pref}${d.fullName}`] = "Cơ hữu";
                            if (doc.id === user.uid) currentUserName = d.fullName; // Không kèm học vị trên header
                        }
                    });
                    
                    const snapVisit = await getDocs(collection(db, "visiting_lecturers"));
                    snapVisit.forEach(doc => { visitingMap[doc.data().name] = "Thỉnh giảng"; });
                } catch(e) { console.error("Lỗi nạp User: ", e); }

                setTimeout(() => {
                    const btnAuthNav = document.getElementById('btnAuthNav');
                    if (btnAuthNav) {
                        btnAuthNav.innerHTML = `<i class="fas fa-user-circle" style="margin-right:5px;"></i> ${currentUserName}`;
                        btnAuthNav.href = "dashboard.html";
                    }
                }, 300);

                // Lắng nghe Phân công
                onSnapshot(collection(db, "assignments"), (snapshot) => {
                    assignmentsData = {};
                    snapshot.forEach(doc => { assignmentsData[doc.id] = doc.data(); });
                    window.renderTable();
                });

                // Lắng nghe Lịch
                onSnapshot(collection(db, "calendar_events"), (snapshot) => {
                    calendarEvents = [];
                    snapshot.forEach(doc => calendarEvents.push(doc.data()));
                    window.renderTable();
                });

            } else {
                window.location.href = "login.html";
            }
        });

        // Hàm chính tính toán & vẽ bảng
        window.renderTable = () => {
            let selectedYear = document.getElementById('academicYear').value;
            let yearConf = getYearConfig(selectedYear);
            if (!yearConf) return;

            let yStart = new Date(yearConf.start);
            let yEnd = new Date(yearConf.end);
            yEnd.setHours(23, 59, 59);

            let gvStats = {}; // Cấu trúc: gvStats[gv][cls][task] = { assigned: 0, completed: 0 }

            // ==========================================
            // 1. TÍNH SỐ BUỔI DỰ KIẾN TỪ PHÂN CÔNG (ASSIGNED)
            // ==========================================
            for (let subId in assignmentsData) {
                let asgDoc = assignmentsData[subId];
                for (let dbKey in asgDoc) {
                    let asg = asgDoc[dbKey];
                    if (asg.status !== 'approved') continue; // Bỏ qua nếu chưa được duyệt
                    
                    let cls = asg.class || dbKey.split('_')[0];
                    let allowedSems = yearConf[cls];
                    if (!allowedSems || allowedSems.length === 0) continue; // Bỏ qua nếu lớp ko học trong năm này

                    let isValidSemester = false;
                    if (asg.name && asg.name.toLowerCase().includes('công việc chuyên môn khác')) {
                        isValidSemester = true; // Tính theo năm
                    } else if (allowedSems.includes(asg.semester)) {
                        isValidSemester = true;
                    }

                    if (!isValidSemester) continue;

                    if (asg.allocations) {
                        asg.allocations.forEach(alloc => {
                            if (alloc.task && alloc.task.includes('Hướng dẫn LV')) return;

                            let gv = alloc.gv;
                            let task = alloc.task || 'Công việc khác';
                            let assigned = parseInt(alloc.assigned) || 0;

                            if (!gvStats[gv]) gvStats[gv] = {};
                            if (!gvStats[gv][cls]) gvStats[gv][cls] = {};
                            if (!gvStats[gv][cls][task]) gvStats[gv][cls][task] = { assigned: 0, completed: 0 };
                            
                            gvStats[gv][cls][task].assigned += assigned;
                        });
                    }
                }
            }

            // ==========================================
            // 2. TÍNH SỐ BUỔI ĐÃ DẠY TỪ LỊCH (COMPLETED)
            // ==========================================
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            // 2.1 Loại bỏ các thẻ bị Trả về hoặc thiếu thời gian
            let validCalEvents = calendarEvents.filter(e => e.status !== 'returned' && e.start);
            
            // 2.2 Gộp các thẻ bị trùng lặp (ví dụ 1 lịch chèn 2 hệ NC/UD sẽ thành 1 thẻ dạy chung)
            let deduplicatedCalMap = new Map();
            validCalEvents.forEach(e => {
                let eStart = new Date(e.start);
                // CHỈ TÍNH NHỮNG LỊCH RƠI VÀO PHẠM VI NĂM HỌC ĐANG XEM
                if (eStart < yStart || eStart > yEnd) return; 

                let sTime = eStart.getTime();
                let eTime = e.end ? new Date(e.end).getTime() : sTime + 4.5 * 3600 * 1000;
                
                // Key gộp không phân biệt Định hướng để đếm đúng 1 buổi
                let deduplicateKey = `${sTime}_${eTime}_${e.room}_${e.subject}_${e.task}_${e.gv}_${e.class}`;

                if (!deduplicatedCalMap.has(deduplicateKey)) {
                    deduplicatedCalMap.set(deduplicateKey, e);
                }
            });

            // 2.3 Đếm số buổi hoàn thành
            deduplicatedCalMap.forEach(e => {
                let cls = e.class;
                let allowedSems = yearConf[cls];
                if (!allowedSems || allowedSems.length === 0) return; // Lớp không học năm nay

                let eStart = new Date(e.start);
                let eEnd = e.end ? new Date(e.end) : new Date(eStart.getTime() + 4.5 * 3600000);

                // Chỉ tính là hoàn thành khi buổi học đã trôi qua
                if (eEnd < today) {
                    let taskName = e.task || 'Công việc khác';
                    if (taskName.toLowerCase().includes('thực hành') && !taskName.toLowerCase().includes('bệnh viện')) taskName = 'Thực hành';

                    let gvs = e.gv ? e.gv.split(/,|&/).map(s => s.trim()).filter(s => s) : [];
                    gvs.forEach(gv => {
                        // Thêm vào Object nếu GV vô tình dạy mà không có trong bảng phân công
                        if (!gvStats[gv]) gvStats[gv] = {};
                        if (!gvStats[gv][cls]) gvStats[gv][cls] = {};
                        if (!gvStats[gv][cls][taskName]) gvStats[gv][cls][taskName] = { assigned: 0, completed: 0 };
                        
                        gvStats[gv][cls][taskName].completed += 1;
                    });
                }
            });

            // ==========================================
            // 3. XUẤT RA HTML
            // ==========================================
            let tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            if (Object.keys(gvStats).length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 30px; color:#64748b;">Không có dữ liệu phân công / hoàn thành nào được ghi nhận trong ${selectedYear}.</td></tr>`;
                return;
            }

            let sortedGVs = Object.keys(gvStats).sort((a,b) => a.localeCompare(b, 'vi'));
            let stt = 1;

            sortedGVs.forEach(gv => {
                let type = usersMap[gv] ? "Cơ hữu" : (visitingMap[gv] ? "Thỉnh giảng" : "Chưa phân loại");
                let badgeClass = usersMap[gv] ? "badge-cohuu" : "badge-thinhgiang";
                
                let assignedHtml = '';
                let completedHtml = '';
                let totalAssignedAll = 0;
                let totalCompletedAll = 0;

                ['THS2025', 'THS2026'].forEach(cls => {
                    if (gvStats[gv][cls] && Object.keys(gvStats[gv][cls]).length > 0) {
                        let clsTitle = cls === 'THS2026' ? 'cls-title ths2026' : 'cls-title';
                        
                        assignedHtml += `<div class="cls-section"><div class="${clsTitle}">[${cls}]</div><ul class="breakdown">`;
                        completedHtml += `<div class="cls-section"><div class="${clsTitle}">[${cls}]</div><ul class="breakdown">`;

                        for (let task in gvStats[gv][cls]) {
                            let stat = gvStats[gv][cls][task];
                            
                            totalAssignedAll += stat.assigned;
                            totalCompletedAll += stat.completed;

                            assignedHtml += `<li><b>${task}</b>: <span style="color:var(--primary); font-weight:bold;">${stat.assigned}</span> buổi</li>`;
                            
                            let compColor = stat.completed > 0 ? '#16a34a' : '#64748b';
                            let overText = stat.completed > stat.assigned && stat.assigned > 0 ? ' <span style="color:#ef4444; font-size:0.8rem;">(Vượt mức!)</span>' : '';
                            completedHtml += `<li><b>${task}</b>: <span style="color:${compColor}; font-weight:bold;">${stat.completed}</span> buổi${overText}</li>`;
                        }
                        assignedHtml += '</ul></div>';
                        completedHtml += '</ul></div>';
                    }
                });

                let pct = 0;
                if (totalAssignedAll > 0) {
                    pct = Math.min(100, Math.round((totalCompletedAll / totalAssignedAll) * 100));
                } else if (totalCompletedAll > 0) {
                    pct = 100; // Dạy vượt/dạy tự do không qua phân công
                }
                
                let pColor = '#16a34a'; 
                if (pct < 100) pColor = '#f59e0b'; 
                if (pct === 0) pColor = '#e2e8f0';

                let progressHtml = `
                    <div style="text-align:center;">
                        <div style="font-size:1.2rem; font-weight:900; color:${pColor};">${pct}%</div>
                        <div class="progress-container"><div class="progress-bar" style="width: ${pct}%; background-color: ${pColor};"></div></div>
                        <div style="font-size:0.8rem; color:#64748b; margin-top:5px;">(${totalCompletedAll}/${totalAssignedAll} buổi)</div>
                    </div>
                `;

                tbody.innerHTML += `
                    <tr style="transition:0.2s;" onmouseover="this.style.backgroundColor='#f8fafc'" onmouseout="this.style.backgroundColor='transparent'">
                        <td style="text-align:center; font-weight:bold; color:#94a3b8;">${stt++}</td>
                        <td class="td-gv-name">${gv}</td>
                        <td style="text-align:center;"><span class="badge ${badgeClass}">${type}</span></td>
                        <td>${assignedHtml}</td>
                        <td>${completedHtml}</td>
                        <td>${progressHtml}</td>
                    </tr>
                `;
            });
        };

    </script>
</body>
</html>
