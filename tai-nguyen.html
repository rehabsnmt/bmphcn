<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Kho tài nguyên chuyên môn - Bộ môn Phục hồi chức năng.">
    <title>Tài nguyên chuyên môn - Bộ môn PHCN</title>
    
    <link rel="icon" href="images/logo_Bộ môn.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        main { max-width: 1200px; padding: 2rem 5%; margin: 0 auto; min-height: 75vh; box-sizing: border-box; }
        
        .page-header { text-align: center; margin-bottom: 3rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
        .page-header h2 { font-size: 1.8rem; color: var(--text-dark); margin-bottom: 10px; font-weight: 800; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px;}
        .page-header h2 i { color: var(--primary); }
        .page-header p { color: var(--text-body); font-size: 1.05rem; margin: 0;}

        /* LƯỚI TÀI NGUYÊN */
        .resource-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        
        /* THẺ TÀI NGUYÊN (CARD) */
        .resource-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md, 12px);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            transition: var(--transition, 0.3s);
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
            border-top: 4px solid var(--primary);
        }
        
        .resource-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-color: var(--primary-light);
        }

        .resource-icon {
            width: 50px;
            height: 50px;
            background: #e0f2fe;
            color: #0284c7;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .resource-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .resource-desc {
            font-size: 0.9rem;
            color: var(--text-body);
            line-height: 1.5;
            flex-grow: 1;
            margin-bottom: 1.5rem;
        }

        .resource-action {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }

        .resource-card:hover .resource-action {
            gap: 8px;
            color: #0284c7;
        }

        /* TRẠNG THÁI LOADING & ERROR */
        .status-container {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-body);
            grid-column: 1 / -1;
        }
        .status-container i.fa-spinner { font-size: 2.5rem; color: var(--primary); margin-bottom: 15px; }
        .status-container i.fa-exclamation-triangle { font-size: 2.5rem; color: #ef4444; margin-bottom: 15px; }

        @media (max-width: 768px) {
            .page-header h2 { font-size: 1.5rem; }
            .resource-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- GỌI HEADER CHUNG -->
    <div id="header-placeholder"></div>

    <main>
        <div class="page-header">
            <h2><i class="fas fa-folder-open"></i> KHO TÀI NGUYÊN CHUYÊN MÔN</h2>
            <p>Hệ thống biểu mẫu, thang điểm và tài liệu chuyên môn của Bộ môn.</p>
        </div>

        <div class="resource-grid" id="resourceGrid">
            <!-- Khu vực trạng thái tải dữ liệu -->
            <div class="status-container" id="loadingState">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Đang tải danh sách tài nguyên...</p>
            </div>
        </div>
    </main>

    <!-- GỌI FOOTER CHUNG -->
    <div id="footer-placeholder"></div>

    <script src="js/layout.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchResourcesFromJson();
        });

        async function fetchResourcesFromJson() {
            const grid = document.getElementById('resourceGrid');
            
            try {
                // Tự động tải danh sách từ file cấu hình tai-nguyen.json
                // Bạn có thể chỉnh thời gian cache bằng cách thêm ?t=timestamp
                const response = await fetch(`tai-nguyen.json?t=${new Date().getTime()}`);
                
                if (!response.ok) {
                    throw new Error("Không thể tải file cấu hình danh sách.");
                }

                const resourceList = await response.json();

                grid.innerHTML = ''; // Xóa trạng thái loading
                
                if (resourceList.length > 0) {
                    resourceList.forEach(item => {
                        grid.appendChild(createResourceCard(item.file, item.name, item.desc));
                    });
                } else {
                    grid.innerHTML = `
                        <div class="status-container">
                            <i class="fas fa-folder-minus" style="font-size: 2.5rem; color: #94a3b8; margin-bottom:15px;"></i>
                            <p>Kho tài nguyên hiện đang trống.</p>
                        </div>
                    `;
                }

            } catch (error) {
                console.error("Lỗi:", error.message);
                grid.innerHTML = `
                    <div class="status-container">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p style="color: #ef4444; font-weight: bold;">Lỗi hệ thống khi tải danh sách tài nguyên.</p>
                        <p style="font-size: 0.9rem;">Vui lòng đảm bảo bạn đã tạo file <b>tai-nguyen.json</b> đúng định dạng.</p>
                    </div>
                `;
            }
        }

        // Hàm tạo phần tử HTML cho thẻ tài nguyên
        function createResourceCard(filePath, name, desc) {
            const card = document.createElement('a');
            card.href = filePath;
            card.className = 'resource-card';

            // Luân phiên thay đổi icon dựa vào độ dài tên file để giao diện sinh động
            const icons = ['fa-file-medical-alt', 'fa-clipboard-list', 'fa-notes-medical', 'fa-laptop-medical'];
            const randomIcon = icons[filePath.length % icons.length];

            card.innerHTML = `
                <div class="resource-icon">
                    <i class="fas ${randomIcon}"></i>
                </div>
                <div class="resource-title">${name}</div>
                <div class="resource-desc">${desc}</div>
                <div class="resource-action">
                    Truy cập tài nguyên <i class="fas fa-arrow-right"></i>
                </div>
            `;
            
            return card;
        }
    </script>
</body>
</html>
