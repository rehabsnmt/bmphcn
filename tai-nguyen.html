<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Kho tài nguyên chuyên môn - Bộ môn Phục hồi chức năng.">
    <title>Tài nguyên chuyên môn - Bộ môn PHCN</title>
    
    <link rel="icon" href="images/logo_Bộ môn.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        main { max-width: 1200px; padding: 2rem 5%; margin: 0 auto; min-height: 75vh; box-sizing: border-box; }
        
        .page-header { text-align: center; margin-bottom: 3rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
        .page-header h2 { font-size: 1.8rem; color: var(--text-dark); margin-bottom: 10px; font-weight: 800; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px;}
        .page-header h2 i { color: var(--primary); }
        .page-header p { color: var(--text-body); font-size: 1.05rem; margin: 0;}

        /* LƯỚI TÀI NGUYÊN */
        .resource-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        
        /* THẺ TÀI NGUYÊN (CARD) */
        .resource-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md, 12px);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            transition: var(--transition, 0.3s);
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
            border-top: 4px solid var(--primary);
        }
        
        .resource-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-color: var(--primary-light);
        }

        .resource-icon {
            width: 50px;
            height: 50px;
            background: #e0f2fe;
            color: #0284c7;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .resource-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .resource-desc {
            font-size: 0.9rem;
            color: var(--text-body);
            line-height: 1.5;
            flex-grow: 1;
            margin-bottom: 1.5rem;
        }

        .resource-action {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }

        .resource-card:hover .resource-action {
            gap: 8px;
            color: #0284c7;
        }

        /* TRẠNG THÁI LOADING & ERROR */
        .status-container {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-body);
            grid-column: 1 / -1;
        }
        .status-container i.fa-spinner { font-size: 2.5rem; color: var(--primary); margin-bottom: 15px; }
        .status-container i.fa-exclamation-triangle { font-size: 2.5rem; color: #f59e0b; margin-bottom: 15px; }

        .sys-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #f1f5f9;
            color: #475569;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .page-header h2 { font-size: 1.5rem; }
            .resource-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- GỌI HEADER CHUNG -->
    <div id="header-placeholder"></div>

    <main>
        <div class="page-header">
            <h2><i class="fas fa-folder-open"></i> KHO TÀI NGUYÊN CHUYÊN MÔN</h2>
            <p>Hệ thống tự động quét và nhận diện các biểu mẫu, thang điểm từ máy chủ lưu trữ.</p>
        </div>

        <div class="resource-grid" id="resourceGrid">
            <!-- Khu vực trạng thái tải dữ liệu -->
            <div class="status-container" id="loadingState">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Đang quét các file tài nguyên trên hệ thống...</p>
            </div>
        </div>
    </main>

    <!-- GỌI FOOTER CHUNG -->
    <div id="footer-placeholder"></div>

    <script src="js/layout.js"></script>

    <script>
        // ==========================================
        // CẤU HÌNH GITHUB CỦA BẠN ĐÃ ĐƯỢC CẬP NHẬT
        // ==========================================
        const GITHUB_OWNER = 'rehabsnmt'; 
        const GITHUB_REPO = 'bmphcn';         
        const GITHUB_BRANCH = 'main';                   

        // Danh sách dự phòng (Phòng trường hợp GitHub API bị lỗi hoặc repo cài đặt Private)
        const fallbackResources = [
            { path: 'tai-nguyen-koos.html', name: 'Thang điểm KOOS', desc: 'Công cụ đánh giá mức độ tổn thương và kết quả chức năng khớp gối.' },
            { path: 'tai-nguyen-dash.html', name: 'Thang điểm DASH', desc: 'Đánh giá chức năng chi trên (vai, cánh tay, bàn tay).' },
            { path: 'tai-nguyen-start-back.html', name: 'STarT Back Screening Tool', desc: 'Công cụ sàng lọc, đánh giá tiên lượng đau thắt lưng.' }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            fetchResourcesFromGithub();
        });

        async function fetchResourcesFromGithub() {
            const grid = document.getElementById('resourceGrid');
            
            try {
                // Gọi API GitHub để lấy cấu trúc cây thư mục của nhánh main
                const response = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`);
                
                if (!response.ok) {
                    throw new Error(`GitHub API Error: ${response.status}`);
                }

                const data = await response.json();
                
                // Lọc các file nằm ở thư mục gốc, bắt đầu bằng "tai-nguyen-" và kết thúc bằng ".html"
                // Loại trừ chính file "tai-nguyen.html"
                const resourceFiles = data.tree.filter(file => 
                    file.type === 'blob' && 
                    file.path.startsWith('tai-nguyen-') && 
                    file.path.endsWith('.html') &&
                    file.path !== 'tai-nguyen.html'
                );

                if (resourceFiles.length > 0) {
                    // Render danh sách lấy được từ GitHub
                    grid.innerHTML = '';
                    resourceFiles.forEach(file => {
                        grid.appendChild(createResourceCard(file.path));
                    });
                } else {
                    // Nếu thư mục trống nhưng không lỗi
                    grid.innerHTML = `
                        <div class="status-container">
                            <i class="fas fa-folder-minus" style="font-size: 2.5rem; color: #94a3b8; margin-bottom:15px;"></i>
                            <p>Không tìm thấy file tài nguyên nào bắt đầu bằng 'tai-nguyen-' trên GitHub.</p>
                        </div>
                    `;
                }

            } catch (error) {
                console.warn("Không thể kết nối GitHub API. Sử dụng dữ liệu dự phòng (Fallback). Lỗi:", error.message);
                
                // Hiển thị dữ liệu dự phòng nếu chưa cấu hình đúng tên Repo hoặc Repo bị Private
                grid.innerHTML = '';
                fallbackResources.forEach(item => {
                    grid.appendChild(createResourceCard(item.path, item.name, item.desc, true));
                });
            }
        }

        // Hàm xử lý chuỗi: 'tai-nguyen-koos.html' -> 'KOOS'
        function formatResourceName(filename) {
            // Cắt đuôi .html
            let name = filename.replace('.html', '');
            // Cắt chữ 'tai-nguyen-'
            name = name.replace('tai-nguyen-', '');
            // Thay dấu gạch ngang thành dấu cách
            name = name.replace(/-/g, ' ');
            // Viết hoa chữ cái đầu hoặc viết hoa toàn bộ nếu là từ viết tắt
            if(name.length <= 6) {
                return name.toUpperCase(); // Nếu tên ngắn (như koos, dash), viết hoa hết
            }
            return name.charAt(0).toUpperCase() + name.slice(1);
        }

        // Hàm tạo phần tử HTML cho thẻ tài nguyên
        function createResourceCard(filePath, customName = null, customDesc = null, isFallback = false) {
            const card = document.createElement('a');
            card.href = filePath;
            card.className = 'resource-card';

            // Xử lý Tên và Mô tả
            const displayName = customName || `Tài nguyên ${formatResourceName(filePath)}`;
            const displayDesc = customDesc || `Bấm vào để xem và sử dụng tài liệu chuyên môn: ${formatResourceName(filePath)}.`;
            const badge = isFallback ? `<div class="sys-badge"><i class="fas fa-database"></i> Dữ liệu Offline</div>` : `<div class="sys-badge"><i class="fab fa-github"></i> Đã đồng bộ</div>`;

            // Luân phiên thay đổi icon dựa vào độ dài tên file để giao diện sinh động
            const icons = ['fa-file-medical-alt', 'fa-clipboard-list', 'fa-notes-medical', 'fa-laptop-medical'];
            const randomIcon = icons[filePath.length % icons.length];

            card.innerHTML = `
                ${badge}
                <div class="resource-icon">
                    <i class="fas ${randomIcon}"></i>
                </div>
                <div class="resource-title">${displayName}</div>
                <div class="resource-desc">${displayDesc}</div>
                <div class="resource-action">
                    Truy cập tài nguyên <i class="fas fa-arrow-right"></i>
                </div>
            `;
            
            return card;
        }
    </script>
</body>
</html>
