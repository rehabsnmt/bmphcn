<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quản trị Dữ liệu (Database Admin) - Bộ môn PHCN</title>
    
    <link rel="icon" href="images/logo_Bộ môn.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Handsontable CSS & JS (Thư viện tạo bảng Excel mạnh nhất) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.css">
    <script src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>
    
    <style>
        /* Mở rộng main để khung Excel chiếm toàn màn hình */
        main { max-width: 98%; padding: 1.5rem 1%; margin: 0 auto; display: flex; flex-direction: column; height: calc(100vh - 70px); box-sizing: border-box;}
        
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid var(--border); }
        .page-header h2 { font-size: 1.5rem; color: var(--accent); margin: 0; font-weight: 800; text-transform: uppercase; display: flex; align-items: center; gap: 10px;}
        
        .hidden { display: none !important; }

        /* Toolbar công cụ */
        .toolbar { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 15px; box-shadow: var(--shadow-sm); flex-wrap: wrap; gap: 10px; }
        
        .toolbar-left { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .toolbar-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-left: 2px dashed #cbd5e1; padding-left: 15px;}

        .form-select { padding: 8px 12px; border-radius: 6px; border: 1px solid var(--primary); font-size: 0.95rem; outline: none; background: #f0f9ff; color: var(--primary); font-weight: 600; cursor: pointer; min-width: 250px;}
        .form-select:focus { box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2); }

        .btn { padding: 8px 15px; border-radius: 6px; font-weight: bold; font-size: 0.9rem; cursor: pointer; transition: 0.2s; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px);}
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; transform: translateY(-1px);}
        .btn-danger { background: var(--accent); color: white; }
        .btn-danger:hover { background: #dc2626; transform: translateY(-1px);}
        .btn-outline { background: white; color: #475569; border: 1px solid #cbd5e1; }
        .btn-outline:hover { background: #f1f5f9; color: var(--text-dark); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none;}

        /* Khung Excel */
        .excel-wrapper { flex: 1; width: 100%; background: white; border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden; position: relative; box-shadow: var(--shadow-sm); z-index: 1;}
        #hot-container { width: 100%; height: 100%; overflow: hidden; }

        /* Tùy chỉnh Handsontable */
        .handsontable th { font-weight: bold; background-color: #f1f5f9; color: var(--text-dark); text-transform: uppercase; font-size: 0.85rem;}
        .htDimmed { background-color: #f8fafc !important; color: #94a3b8 !important; font-family: monospace; font-size: 0.85rem;}

        /* Toast */
        .toast-container { position: fixed; top: 80px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none;}
        .toast { min-width: 250px; background-color: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 12px; transform: translateX(120%); transition: 0.4s; font-weight: 600; border-left: 5px solid #22c55e; opacity: 0; pointer-events: auto; }
        .toast.show { transform: translateX(0); opacity: 1; }
        .toast.danger { border-left-color: #ef4444; }

        @media (max-width: 768px) {
            .toolbar { flex-direction: column; align-items: flex-start; }
            .toolbar-right { border-left: none; padding-left: 0; border-top: 2px dashed #cbd5e1; padding-top: 10px; width: 100%;}
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>
    <div id="toastContainer" class="toast-container"></div>

    <div id="loadingScreen" style="text-align: center; padding: 5rem 0; color: var(--primary); font-weight: 600; font-size: 1.2rem;">
        <i class="fas fa-spinner fa-spin fa-2x"></i><br><br>Đang xác thực quyền Super Admin...
    </div>

    <main id="mainContent" class="hidden">
        <div class="page-header">
            <h2><i class="fas fa-database"></i> Quản Trị CSDL Nâng Cao</h2>
            <div style="font-size: 0.9rem; color: #64748b;">
                <i class="fas fa-info-circle"></i> Click tiêu đề để <b>Sắp xếp/Lọc</b>. Chuột phải để <b>Chèn Cột, Hàng, Xóa</b>.
            </div>
        </div>

        <div class="toolbar">
            <div class="toolbar-left">
                <select id="colSelect" class="form-select" onchange="clearTable()">
                    <option value="subjects">Danh mục Môn học (subjects)</option>
                    <option value="learners">Danh sách Người học (learners)</option>
                    <option value="theses">Đề tài Luận văn (theses)</option>
                    <option value="calendar_events">Lịch giảng dạy (calendar_events)</option>
                    <option value="clinical_schedules">Lịch đi bệnh viện (clinical_schedules)</option> <!-- Bổ sung bảng lịch đi BV -->
                    <option value="assignments">Phân công (assignments)</option>
                    <option value="announcements">Thông báo (announcements)</option>
                    <option value="users">Tài khoản (users)</option>
                    <option value="visiting_lecturers">GV Thỉnh giảng (visiting_lecturers)</option>
                </select>
                <button class="btn btn-primary" onclick="loadData()"><i class="fas fa-sync"></i> Tải dữ liệu bảng</button>
                <button class="btn btn-success" onclick="saveData()"><i class="fas fa-save"></i> Lưu Thay Đổi Của Bảng Lên DB</button>
            </div>
            
            <div class="toolbar-right">
                <span style="font-size: 0.85rem; color: #94a3b8; font-weight: bold;">Toàn hệ thống:</span>
                <button class="btn btn-outline" onclick="exportDataToJSON()"><i class="fas fa-file-export"></i> Xuất JSON</button>
                <input type="file" id="jsonFileInput" accept=".json" hidden onchange="importDataFromJSON(event)">
                <button class="btn btn-danger" onclick="document.getElementById('jsonFileInput').click()"><i class="fas fa-file-import"></i> Nhập JSON (Ghi đè)</button>
            </div>
        </div>

        <div class="excel-wrapper">
            <div id="hot-container">
                <div style="text-align: center; padding-top: 100px; color: #94a3b8;">
                    <i class="fas fa-table" style="font-size: 3rem; margin-bottom: 10px; opacity: 0.5;"></i><br>
                    Chọn bảng và bấm "Tải dữ liệu bảng" để bắt đầu làm việc.
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/layout.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDVT4akTw65Uj6KHymwWtQ9xyHVyfTlXIY", authDomain: "bmphcn-aa9c6.firebaseapp.com", projectId: "bmphcn-aa9c6", storageBucket: "bmphcn-aa9c6.firebasestorage.app", messagingSenderId: "749494392719", appId: "1:749494392719:web:f220c751ff541620045dfa" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ALL_COLLECTIONS = [
            'calendar_events', 'assignments', 'subjects', 'learners', 
            'theses', 'announcements', 'users', 'visiting_lecturers', 'clinical_schedules'
        ];

        let hotInstance = null;
        let currentCollection = '';
        let headers = [];
        let originalIds = [];

        window.showToast = (message, type = 'success') => {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            let icon = type === 'danger' ? 'fa-exclamation-triangle' : 'fa-check-circle';
            toast.innerHTML = `<i class="fas ${icon}" style="font-size: 1.2rem; color: ${type==='danger'?'#ef4444':'#22c55e'};"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3000);
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (user.email.toLowerCase() === 'hoangtran1483@gmail.com') {
                    document.getElementById('loadingScreen').classList.add('hidden');
                    document.getElementById('mainContent').classList.remove('hidden');
                } else {
                    alert("Chỉ Super Admin mới có quyền truy cập khu vực này!");
                    window.location.href = "dashboard.html";
                }
            } else {
                window.location.href = "login.html";
            }
        });

        // ----------------------------------------------------
        // 1. TẢI DỮ LIỆU LÊN BẢNG HANDSONTABLE (EXCEL)
        // ----------------------------------------------------
        window.clearTable = () => {
            if(hotInstance) {
                hotInstance.destroy();
                hotInstance = null;
            }
            document.getElementById('hot-container').innerHTML = `
                <div style="text-align: center; padding-top: 100px; color: #94a3b8;">
                    <i class="fas fa-table" style="font-size: 3rem; margin-bottom: 10px; opacity: 0.5;"></i><br>
                    Chọn bảng và bấm "Tải dữ liệu bảng" để bắt đầu làm việc.
                </div>`;
        };

        window.loadData = async () => {
            const col = document.getElementById('colSelect').value;
            currentCollection = col;
            const container = document.getElementById('hot-container');
            
            container.innerHTML = '<div style="text-align:center; padding: 50px;"><i class="fas fa-spinner fa-spin fa-2x"></i></div>';
            
            try {
                const snap = await getDocs(collection(db, col));
                let rawDocs = [];
                let keySet = new Set();
                
                snap.forEach(d => {
                    let data = d.data();
                    rawDocs.push({ _docId: d.id, ...data });
                    Object.keys(data).forEach(k => keySet.add(k));
                });

                headers = ["_docId", ...Array.from(keySet).sort()];
                originalIds = rawDocs.map(d => d._docId);

                // Chuyển Data thành mảng 2 chiều
                let dataMatrix = rawDocs.map(doc => {
                    return headers.map(h => {
                        let val = doc[h];
                        if (val === undefined || val === null) return '';
                        if (typeof val === 'object') return JSON.stringify(val);
                        return String(val);
                    });
                });

                // Nếu bảng trống
                if (dataMatrix.length === 0) {
                    dataMatrix = [ headers.map(h => '') ];
                }

                container.innerHTML = '';
                
                hotInstance = new Handsontable(container, {
                    data: dataMatrix,
                    colHeaders: headers,
                    rowHeaders: true, // Đánh số thứ tự 1, 2, 3...
                    manualColumnResize: true,
                    manualRowResize: true,
                    undo: true,
                    width: '100%',
                    height: '100%',
                    licenseKey: 'non-commercial-and-evaluation', // Phiên bản miễn phí
                    
                    /* BẬT TÍNH NĂNG SẮP XẾP VÀ LỌC GIỐNG EXCEL */
                    dropdownMenu: true, // Menu xổ xuống ở Header
                    filters: true,      // Bộ lọc dữ liệu Excel
                    columnSorting: true, // Sắp xếp A-Z, Z-A khi click Header

                    contextMenu: {
                        items: {
                            "row_above": { name: '<i class="fas fa-arrow-up"></i> Chèn hàng lên trên' },
                            "row_below": { name: '<i class="fas fa-arrow-down"></i> Chèn hàng xuống dưới' },
                            "col_left": { name: '<i class="fas fa-arrow-left"></i> Chèn cột sang trái' },
                            "col_right": { name: '<i class="fas fa-arrow-right"></i> Chèn cột sang phải' },
                            "hsep1": "---------",
                            "remove_row": { name: '<i class="fas fa-trash" style="color:red;"></i> Xóa hàng' },
                            "remove_col": { name: '<i class="fas fa-times" style="color:red;"></i> Xóa cột' },
                            "hsep2": "---------",
                            "rename_col": {
                                name: '<i class="fas fa-edit"></i> <b>Đổi Tên Thuộc Tính (Key Cột)</b>',
                                callback: function(key, selection) {
                                    let colIndex = selection[0].start.col;
                                    if (colIndex === 0) {
                                        alert("Không thể đổi tên cột khóa chính (_docId)!");
                                        return;
                                    }
                                    let currentName = headers[colIndex] || hotInstance.getColHeader(colIndex);
                                    let newName = prompt("Nhập tên trường dữ liệu (field key) mới:", currentName);
                                    if (newName && newName.trim() !== '') {
                                        headers[colIndex] = newName.trim();
                                        hotInstance.updateSettings({ colHeaders: headers });
                                        showToast(`Đã đổi tên cột thành [${newName}]`);
                                    }
                                }
                            },
                            "hsep3": "---------",
                            "undo": { name: '<i class="fas fa-undo"></i> Hoàn tác (Undo)' },
                            "redo": { name: '<i class="fas fa-redo"></i> Làm lại (Redo)' }
                        }
                    },
                    cells: function(row, col) {
                        let cellProperties = {};
                        if (col === 0) {
                            // Khóa cột _docId
                            cellProperties.readOnly = true;
                            cellProperties.className = 'htDimmed';
                        }
                        return cellProperties;
                    },
                    afterCreateCol: function(index, amount) {
                        for(let i = 0; i < amount; i++) {
                            headers.splice(index + i, 0, 'new_field_' + Date.now() + i);
                        }
                        this.updateSettings({ colHeaders: headers });
                    },
                    afterRemoveCol: function(index, amount) {
                        headers.splice(index, amount);
                        this.updateSettings({ colHeaders: headers });
                    }
                });
                
                showToast(`Tải thành công ${rawDocs.length} bản ghi.`);
            } catch(e) {
                showToast("Lỗi tải bảng: " + e.message, 'danger');
            }
        };

        // ----------------------------------------------------
        // 2. LƯU TOÀN BỘ THAY ĐỔI LÊN FIREBASE
        // ----------------------------------------------------
        window.saveData = async () => {
            if(!hotInstance) {
                showToast("Chưa có bảng nào được tải!", "danger");
                return;
            }
            if(!confirm(`Lưu ý: Hệ thống sẽ quét toàn bộ bảng Excel và cập nhật lên Firebase. Hành động này sẽ CẬP NHẬT hàng đã sửa, THÊM hàng mới và XÓA các hàng bạn đã xóa trên Excel. Xác nhận lưu?`)){
                return;
            }

            // getData() sẽ lấy toàn bộ dữ liệu (kể cả những dòng đang bị bộ lọc ẩn đi)
            const data = hotInstance.getData();
            let currentIds = [];
            let promises = [];
            let countAdd = 0, countUpdate = 0;

            try {
                // Bước 1: Quét từng dòng Excel để Update hoặc Add
                for (let r = 0; r < data.length; r++) {
                    let row = data[r];
                    // Bỏ qua hàng nếu tất cả các ô đều rỗng
                    let isEmpty = row.every(cell => cell === null || cell === '');
                    if (isEmpty) continue;

                    let docId = row[0];
                    let docData = {};

                    // Ghép cột thành Object JSON
                    for (let c = 1; c < headers.length; c++) {
                        let key = headers[c];
                        let val = row[c];
                        if (val !== null && val !== '') {
                            // Tự động ép kiểu dữ liệu chuẩn Firebase
                            if (val === 'true') val = true;
                            else if (val === 'false') val = false;
                            else if (!isNaN(val) && val !== '') val = Number(val);
                            else {
                                try {
                                    let parsed = JSON.parse(val);
                                    if (typeof parsed === 'object') val = parsed;
                                } catch(e) {}
                            }
                            docData[key] = val;
                        }
                    }

                    // Lưu Firestore
                    if (docId) {
                        currentIds.push(docId);
                        promises.push(setDoc(doc(db, currentCollection, docId), docData));
                        countUpdate++;
                    } else {
                        // Tạo mới nếu chưa có _docId
                        let newDocRef = doc(collection(db, currentCollection));
                        promises.push(setDoc(newDocRef, docData));
                        currentIds.push(newDocRef.id);
                        countAdd++;
                    }
                }

                // Bước 2: Dò tìm các dòng đã bị xóa trên Excel để xóa khỏi Firebase
                let deletedIds = originalIds.filter(id => !currentIds.includes(id));
                for (let id of deletedIds) {
                    promises.push(deleteDoc(doc(db, currentCollection, id)));
                }

                await Promise.all(promises);
                showToast(`Lưu DB thành công! (Thêm mới: ${countAdd}, Cập nhật: ${countUpdate}, Xóa: ${deletedIds.length})`);
                
                // Tải lại bảng để nhận _docId mới cho các hàng vừa chèn
                loadData(); 

            } catch(e) {
                showToast("Lỗi trong quá trình lưu: " + e.message, "danger");
            }
        };

        // ----------------------------------------------------
        // 3. XUẤT / NHẬP JSON (TOÀN HỆ THỐNG)
        // ----------------------------------------------------
        window.exportDataToJSON = async () => {
            try {
                let exportData = {};
                for (const colName of ALL_COLLECTIONS) {
                    exportData[colName] = {};
                    const snap = await getDocs(collection(db, colName));
                    snap.forEach(docSnap => {
                        exportData[colName][docSnap.id] = docSnap.data();
                    });
                }

                const jsonString = JSON.stringify(exportData, null, 2);
                const blob = new Blob([jsonString], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                
                const link = document.createElement("a");
                link.href = url;
                let dateStr = new Date().toLocaleDateString('vi-VN').replace(/\//g, '-');
                link.download = `Full_DB_Backup_${dateStr}.json`;
                
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                showToast("Đã tải xuống toàn bộ CSDL!");
            } catch (error) {
                showToast("Lỗi xuất dữ liệu: " + error.message, "danger");
            }
        };

        window.importDataFromJSON = (event) => {
            const file = event.target.files[0];
            if (!file) return;

            if (!confirm(`CẢNH BÁO TỐI CAO: Khôi phục từ file [${file.name}] sẽ ghi đè toàn bộ các bảng trong CSDL. Bạn có chắc không?`)) {
                event.target.value = ''; // Reset input
                return;
            }

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    let promises = [];
                    
                    for (const [colName, docsObj] of Object.entries(data)) {
                        for (const [docId, docData] of Object.entries(docsObj)) {
                            promises.push(setDoc(doc(db, colName, docId), docData));
                        }
                    }

                    await Promise.all(promises);
                    showToast(`Khôi phục dữ liệu toàn hệ thống thành công!`);
                    event.target.value = ''; 
                    
                    if(currentCollection) loadData(); // Load lại bảng Excel nếu đang mở

                } catch (err) {
                    showToast("Lỗi nhập dữ liệu: JSON sai định dạng.", "danger");
                }
            };
            reader.readAsText(file);
        };

    </script>
</body>
</html>
