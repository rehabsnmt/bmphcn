<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quản lý Người học - Bộ môn Phục hồi chức năng.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdnjs.cloudflare.com https://www.gstatic.com https://*.firebaseio.com https://*.googleapis.com; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' https://www.gstatic.com;">
    <title>Quản lý Người học - Bộ môn Phục hồi chức năng</title>
    
    <link rel="icon" href="images/logo_Bộ môn.png" type="image/png">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        main { max-width: 1200px; padding: 2rem 3%; margin: 0 auto; }
        
        /* Bảng điều khiển Lọc Dữ Liệu */
        .controls-wrapper { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; background: var(--surface); padding: 15px 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 25px; gap: 15px; box-shadow: var(--shadow-sm); }
        .filter-group { display: flex; gap: 10px; align-items: center; }
        .filter-group label { font-weight: 600; color: var(--text-dark); font-size: 0.95rem; }
        .filter-group select { padding: 8px 15px; border-radius: 6px; border: 1px solid var(--border); font-size: 0.95rem; font-weight: 600; color: var(--text-dark); background-color: var(--bg-page); outline: none; cursor: pointer; transition: 0.2s; }
        .filter-group select:focus { border-color: var(--primary); }

        .search-box { display: flex; align-items: center; background: var(--bg-page); border: 1px solid var(--border); border-radius: 6px; padding: 0 10px; }
        .search-box input { border: none; background: transparent; padding: 10px; outline: none; font-size: 0.95rem; width: 250px; }
        .search-box i { color: var(--text-body); }

        /* Lưới Card Danh sách Người Học */
        .learners-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        .learner-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; display: flex; align-items: flex-start; gap: 15px; transition: all 0.3s ease; cursor: pointer; position: relative; overflow: hidden; box-shadow: var(--shadow-sm); }
        .learner-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-color: var(--primary); }
        
        .learner-avatar { width: 60px; height: 60px; border-radius: 50%; background: #e0f2fe; color: #0284c7; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; font-weight: bold; flex-shrink: 0; border: 2px solid var(--primary-light); }
        
        .learner-info { flex: 1; }
        .learner-info h3 { margin: 0 0 5px 0; color: var(--text-dark); font-size: 1.15rem; font-weight: 700; line-height: 1.3; }
        .learner-info p { margin: 0 0 3px 0; color: var(--text-body); font-size: 0.9rem; display: flex; align-items: center; gap: 5px; }
        .learner-info i { width: 15px; text-align: center; color: #94a3b8; }
        
        .badge-class { position: absolute; top: 15px; right: 15px; background: var(--primary); color: white; padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
        .badge-status-has-thesis { background: #10b981; color: white; display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; margin-top: 5px; }

        /* Modal Chi tiết */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: white; width: 600px; max-width: 95%; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); overflow: hidden; display: flex; flex-direction: column; max-height: 90vh; }
        
        .modal-header-profile { background: linear-gradient(135deg, #0284c7, #0ea5e9); color: white; padding: 30px 20px 20px; position: relative; text-align: center; }
        .btn-close-modal { position: absolute; top: 15px; right: 20px; background: rgba(255,255,255,0.2); border: none; color: white; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; font-weight: bold; transition: 0.2s; }
        .btn-close-modal:hover { background: rgba(255,255,255,0.4); transform: rotate(90deg); }
        
        .modal-avatar-lg { width: 90px; height: 90px; border-radius: 50%; background: white; color: var(--primary); display: flex; justify-content: center; align-items: center; font-size: 2.5rem; font-weight: bold; margin: 0 auto 15px; border: 4px solid rgba(255,255,255,0.3); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        .modal-body { padding: 20px 30px; overflow-y: auto; }
        .info-section { margin-bottom: 25px; }
        .info-section h4 { color: var(--primary); font-size: 1.05rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .info-item { display: flex; flex-direction: column; gap: 3px; }
        .info-label { font-size: 0.8rem; color: #64748b; font-weight: 600; text-transform: uppercase; }
        .info-value { font-size: 1rem; color: var(--text-dark); font-weight: 500; }

        .thesis-card { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 15px; border-left: 4px solid #10b981; }
        .thesis-card p { margin: 0 0 8px 0; line-height: 1.5; color: var(--text-dark); }
        .thesis-score { display: inline-block; background: #dcfce7; color: #16a34a; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 0.9rem; }

        .hidden { display: none !important; }
        
        /* Skeleton Loading */
        .skeleton { background: #e2e8f0; border-radius: 4px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        @media (max-width: 768px) {
            .controls-wrapper { flex-direction: column; align-items: stretch; }
            .search-box input { width: 100%; }
            .info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <main id="mainContent">
        <div style="text-align: center; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid var(--border);">
            <h2 style="font-size: 1.6rem; color: var(--text-dark); margin: 0; font-weight: 700;"><i class="fas fa-users-cog" style="color: var(--primary);"></i> QUẢN LÝ NGƯỜI HỌC</h2>
            <div style="font-size: 1rem; color: var(--text-body); font-weight: 600; margin-top: 5px;">Hệ thống Dữ liệu Cử nhân & Thạc sĩ</div>
        </div>

        <!-- BẢNG ĐIỀU KHIỂN -->
        <div class="controls-wrapper">
            <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                <div class="filter-group">
                    <label>Hệ Đào tạo:</label>
                    <select id="filterSystem" onchange="updateClassOptions()">
                        <option value="ALL">Tất cả Hệ</option>
                        <option value="CN">Cử nhân (CN)</option>
                        <option value="THS">Thạc sĩ (THS)</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label>Lớp / Khóa:</label>
                    <select id="filterClass" onchange="renderLearners()">
                        <option value="ALL">Tất cả Lớp</option>
                    </select>
                </div>
            </div>

            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Tìm tên, mã số..." oninput="renderLearners()">
            </div>
        </div>

        <!-- DANH SÁCH THẺ NGƯỜI HỌC -->
        <div class="learners-grid" id="learnersGrid">
            <!-- JS Render -->
            <div style="grid-column: 1 / -1; text-align: center; padding: 50px; color: var(--text-body);">
                <i class="fas fa-spinner fa-spin fa-2x"></i><br><br>Đang tải dữ liệu người học...
            </div>
        </div>
    </main>

    <!-- MODAL CHI TIẾT NGƯỜI HỌC -->
    <div id="learnerModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header-profile">
                <button class="btn-close-modal" onclick="closeModal()">X</button>
                <div class="modal-avatar-lg" id="mdlAvatar">A</div>
                <h2 style="margin: 0 0 5px 0; font-size: 1.5rem;" id="mdlName">Tên Người Học</h2>
                <div style="font-size: 0.95rem; opacity: 0.9;"><i class="fas fa-id-card"></i> <span id="mdlId">MSSV</span> | <i class="fas fa-graduation-cap"></i> Lớp: <b id="mdlClass"></b></div>
            </div>
            
            <div class="modal-body">
                <div class="info-section">
                    <h4><i class="fas fa-user"></i> Thông tin cá nhân</h4>
                    <div class="info-grid">
                        <div class="info-item">
                            <span class="info-label">Ngày sinh</span>
                            <span class="info-value" id="mdlDob">--/--/----</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Giới tính</span>
                            <span class="info-value" id="mdlGender">---</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Số điện thoại</span>
                            <span class="info-value" id="mdlPhone">---</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Email</span>
                            <span class="info-value" id="mdlEmail">---</span>
                        </div>
                        <div class="info-item" style="grid-column: 1 / -1;">
                            <span class="info-label">Quê quán / Địa chỉ</span>
                            <span class="info-value" id="mdlAddress">---</span>
                        </div>
                    </div>
                </div>

                <div class="info-section" id="thesisSection" class="hidden">
                    <h4><i class="fas fa-book-reader"></i> Thông tin Học thuật (Luận văn/Khóa luận)</h4>
                    <div id="thesisContent">
                        <div style="text-align: center; color: #94a3b8; font-size: 0.9rem; padding: 10px;">Đang dò tìm liên kết dữ liệu... <i class="fas fa-spinner fa-spin"></i></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="js/layout.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDVT4akTw65Uj6KHymwWtQ9xyHVyfTlXIY", authDomain: "bmphcn-aa9c6.firebaseapp.com", projectId: "bmphcn-aa9c6", storageBucket: "bmphcn-aa9c6.firebasestorage.app", messagingSenderId: "749494392719", appId: "1:749494392719:web:f220c751ff541620045dfa" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let learnersData = [];
        let thesesData = []; // Tải sẵn Data Luận văn để map chéo nhanh

        // XỬ LÝ QUYỀN TRUY CẬP (Yêu cầu đăng nhập, ưu tiên Giảng viên)
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await loadAllData();
            } else {
                window.location.href = "login.html";
            }
        });

        async function loadAllData() {
            try {
                // 1. Tải danh sách Người học (Giả lập Bảng `learners` nếu có)
                // Do bạn nói lấy từ "learners trong database", hệ thống sẽ query bảng này.
                const lSnap = await getDocs(collection(db, "learners"));
                learnersData = [];
                lSnap.forEach(doc => {
                    const data = doc.data();
                    data.id = doc.id;
                    learnersData.push(data);
                });

                // Nếu bảng learners chưa có dữ liệu, tạo một vài Data mẫu để hiển thị
                if(learnersData.length === 0) {
                    learnersData = [
                        { id: "SV01", studentId: "4012025001", fullName: "Nguyễn Văn A", system: "THS", className: "THS2025", dob: "15/04/1995", gender: "Nam", phone: "0901234567", email: "nva@ump.edu.vn", address: "Quận 5, TP.HCM" },
                        { id: "SV02", studentId: "4012026002", fullName: "Trần Thị B", system: "THS", className: "THS2026", dob: "20/08/1996", gender: "Nữ", phone: "0912345678", email: "ttb@ump.edu.vn", address: "Đồng Nai" },
                        { id: "SV03", studentId: "4022023010", fullName: "Lê Hoàng C", system: "CN", className: "CNVLTL2023", dob: "05/01/2003", gender: "Nam", phone: "0987654321", email: "lhc@ump.edu.vn", address: "Bình Dương" }
                    ];
                }

                // 2. Tải danh sách Luận văn để Map tự động
                const tSnap = await getDocs(collection(db, "theses"));
                thesesData = [];
                tSnap.forEach(doc => thesesData.push(doc.data()));

                updateClassOptions();
                
            } catch (error) {
                console.error("Lỗi tải Data:", error);
                document.getElementById('learnersGrid').innerHTML = `<div style="grid-column: 1/-1; color:red; text-align:center;">Lỗi tải dữ liệu: ${error.message}</div>`;
            }
        }

        window.updateClassOptions = () => {
            const system = document.getElementById('filterSystem').value;
            const classSelect = document.getElementById('filterClass');
            classSelect.innerHTML = '<option value="ALL">Tất cả Lớp</option>';

            let classes = new Set();
            learnersData.forEach(l => {
                if (system === 'ALL' || l.system === system) {
                    if (l.className) classes.add(l.className);
                }
            });

            Array.from(classes).sort().forEach(c => {
                classSelect.innerHTML += `<option value="${c}">${c}</option>`;
            });

            renderLearners();
        };

        window.renderLearners = () => {
            const grid = document.getElementById('learnersGrid');
            const system = document.getElementById('filterSystem').value;
            const cls = document.getElementById('filterClass').value;
            const queryTxt = document.getElementById('searchInput').value.toLowerCase();

            grid.innerHTML = '';

            let filtered = learnersData.filter(l => {
                let matchSys = system === 'ALL' || l.system === system;
                let matchCls = cls === 'ALL' || l.className === cls;
                let matchTxt = (l.fullName || '').toLowerCase().includes(queryTxt) || (l.studentId || '').toLowerCase().includes(queryTxt);
                return matchSys && matchCls && matchTxt;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:30px; color:var(--text-body);">Không tìm thấy người học nào phù hợp.</div>`;
                return;
            }

            filtered.forEach(l => {
                // Kiểm tra xem Học viên này có làm Luận văn không (Dò tìm bằng Tên)
                const hasThesis = thesesData.some(t => t.author && t.author.toLowerCase() === (l.fullName || '').toLowerCase());
                
                let avatarLetter = l.fullName ? l.fullName.charAt(0).toUpperCase() : '?';

                grid.innerHTML += `
                    <div class="learner-card" onclick="openLearnerModal('${l.id}')">
                        <span class="badge-class">${l.className || 'Chưa xếp lớp'}</span>
                        <div class="learner-avatar">${avatarLetter}</div>
                        <div class="learner-info">
                            <h3>${l.fullName || 'Chưa cập nhật tên'}</h3>
                            <p><i class="fas fa-id-badge"></i> MSSV: <b>${l.studentId || 'N/A'}</b></p>
                            <p><i class="fas fa-envelope"></i> ${l.email || 'Không có email'}</p>
                            ${hasThesis ? `<span class="badge-status-has-thesis"><i class="fas fa-check-circle"></i> Đang thực hiện LV/ĐA</span>` : ''}
                        </div>
                    </div>
                `;
            });
        };

        window.openLearnerModal = (id) => {
            const l = learnersData.find(x => x.id === id);
            if (!l) return;

            document.getElementById('mdlName').innerText = l.fullName || 'N/A';
            document.getElementById('mdlAvatar').innerText = l.fullName ? l.fullName.charAt(0).toUpperCase() : '?';
            document.getElementById('mdlId').innerText = l.studentId || 'N/A';
            document.getElementById('mdlClass').innerText = l.className || 'N/A';
            
            document.getElementById('mdlDob').innerText = l.dob || '---';
            document.getElementById('mdlGender').innerText = l.gender || '---';
            document.getElementById('mdlPhone').innerText = l.phone || '---';
            document.getElementById('mdlEmail').innerText = l.email || '---';
            document.getElementById('mdlAddress').innerText = l.address || '---';

            // AUTO LINKER: Dò tìm Luận văn / Đề án của Học viên này
            const thesisContainer = document.getElementById('thesisContent');
            const myTheses = thesesData.filter(t => t.author && t.author.toLowerCase() === (l.fullName || '').toLowerCase());

            if (myTheses.length > 0) {
                let html = '';
                myTheses.forEach(t => {
                    html += `
                        <div class="thesis-card">
                            <p><b>Đề tài:</b> ${t.title || 'Chưa cập nhật tên đề tài'}</p>
                            <p><b>GV Hướng dẫn:</b> ${t.advisor || 'Chưa phân công'}</p>
                            <p><b>Điểm số:</b> ${t.score ? `<span class="thesis-score">${t.score}</span>` : '<i style="color:#94a3b8;">Chưa có điểm</i>'}</p>
                        </div>
                    `;
                });
                thesisContainer.innerHTML = html;
            } else {
                thesisContainer.innerHTML = `<div style="text-align: center; color: #94a3b8; font-style: italic; padding: 15px; border: 1px dashed #cbd5e1; border-radius: 6px; background: #f8fafc;">Không tìm thấy thông tin Đề tài/Luận văn của người học này trong hệ thống.</div>`;
            }

            document.getElementById('learnerModal').classList.remove('hidden');
        };

        window.closeModal = () => {
            document.getElementById('learnerModal').classList.add('hidden');
        };

    </script>
</body>
</html>
