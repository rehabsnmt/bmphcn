<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Quản lý Người học - Bộ môn Phục hồi chức năng.">
    <title>Quản lý Người học - Bộ môn Phục hồi chức năng</title>
    
    <link rel="icon" href="images/logo_Bộ môn.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        main { max-width: 1400px; padding: 2rem 2%; margin: 0 auto; min-height: 75vh; }
        
        .page-header { text-align: center; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .page-header h2 { font-size: 1.6rem; color: var(--text-dark); margin: 0; font-weight: 700; text-transform: uppercase; }
        .page-header p { font-size: 1rem; color: var(--text-body); font-weight: 600; margin-top: 5px; }

        .hidden { display: none !important; }

        /* Bảng điều khiển Lọc Dữ Liệu */
        .controls-wrapper { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; background: var(--surface); padding: 15px 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; gap: 15px; box-shadow: var(--shadow-sm); }
        
        .filter-controls { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .filter-group { display: flex; align-items: center; gap: 8px; }
        .filter-group label { font-weight: 600; color: var(--text-dark); font-size: 0.9rem; }
        .filter-group select { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); font-size: 0.9rem; font-weight: 600; color: var(--text-dark); background-color: var(--bg-page); outline: none; cursor: pointer; transition: 0.2s; }
        .filter-group select:focus { border-color: var(--primary); }

        .search-box { display: flex; align-items: center; background: var(--bg-page); border: 1px solid var(--border); border-radius: 6px; padding: 0 10px; width: 250px; }
        .search-box input { border: none; background: transparent; padding: 8px; outline: none; font-size: 0.9rem; width: 100%; }
        .search-box i { color: var(--text-body); }
        
        .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-export { background-color: #10b981; color: white; padding: 8px 15px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; font-size: 0.9rem; }
        .btn-export:hover { background-color: #059669; transform: translateY(-1px); }

        /* Bảng Danh sách Người Học */
        .table-container { overflow-x: auto; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow-sm); }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; white-space: nowrap; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
        th { background-color: var(--bg-page); font-weight: bold; color: var(--text-dark); text-transform: uppercase; font-size: 0.8rem; position: sticky; top: 0; z-index: 10; border-bottom: 2px solid #cbd5e1; }
        
        tbody tr { transition: background-color 0.2s; cursor: pointer; }
        tbody tr:hover { background-color: #f8fafc; }

        /* Highlight cho tên và mã số */
        .key-fullName { font-weight: bold; color: var(--primary); font-size: 0.95rem; }
        .key-studentId { font-family: monospace; font-weight: 600; color: #64748b; background: #f1f5f9; padding: 4px 6px; border-radius: 4px; border: 1px solid #e2e8f0; display: inline-block;}

        .btn-view-row { background: none; border: none; color: var(--primary); padding: 5px; border-radius: 4px; transition: 0.2s; font-size: 1.1rem; cursor: pointer;}
        .btn-view-row:hover { background: var(--primary-light); transform: scale(1.1); }

        /* Modal Chi tiết */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); display: flex; justify-content: center; align-items: center; z-index: 2000; padding: 15px; }
        .modal-content { background: white; width: 100%; max-width: 600px; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); overflow: hidden; display: flex; flex-direction: column; max-height: 90vh; }
        
        .modal-header-profile { background: linear-gradient(135deg, #0284c7, #0ea5e9); color: white; padding: 30px 20px 20px; position: relative; text-align: center; }
        .btn-close-modal { position: absolute; top: 15px; right: 20px; background: rgba(255,255,255,0.2); border: none; color: white; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; font-weight: bold; transition: 0.2s; }
        .btn-close-modal:hover { background: rgba(255,255,255,0.4); transform: rotate(90deg); }
        
        .modal-avatar-lg { width: 80px; height: 80px; border-radius: 50%; background: white; color: var(--primary); display: flex; justify-content: center; align-items: center; font-size: 2.5rem; font-weight: bold; margin: 0 auto 15px; border: 4px solid rgba(255,255,255,0.3); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        .modal-body { padding: 20px 30px; overflow-y: auto; }
        .info-section { margin-bottom: 25px; }
        .info-section h4 { color: var(--primary); font-size: 1.05rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .info-item { display: flex; flex-direction: column; gap: 3px; }
        .info-item.full-width { grid-column: 1 / -1; }
        .info-label { font-size: 0.8rem; color: #64748b; font-weight: 600; text-transform: uppercase; }
        .info-value { font-size: 0.95rem; color: var(--text-dark); font-weight: 500; word-break: break-word; white-space: pre-wrap; }

        .thesis-card { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 15px; border-left: 4px solid #10b981; }
        .thesis-card p { margin: 0 0 8px 0; line-height: 1.5; color: var(--text-dark); }
        .thesis-score { display: inline-block; background: #dcfce7; color: #16a34a; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 0.9rem; }

        /* Toast */
        .toast-container { position: fixed; top: 80px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none;}
        .toast { min-width: 250px; background-color: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 12px; transform: translateX(120%); transition: 0.4s; font-weight: 600; border-left: 5px solid #22c55e; opacity: 0; pointer-events: auto; }
        .toast.show { transform: translateX(0); opacity: 1; }
        .toast.danger { border-left-color: #ef4444; }

        @media (max-width: 768px) {
            .controls-wrapper { flex-direction: column; align-items: stretch; }
            .filter-controls { flex-direction: column; align-items: stretch; }
            .search-box { width: 100%; }
            .info-grid { grid-template-columns: 1fr; }
            .action-buttons { justify-content: center; }
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>
    <div id="toastContainer" class="toast-container"></div>

    <main id="mainContent">
        <div class="page-header">
            <h2><i class="fas fa-users-cog"></i> QUẢN LÝ NGƯỜI HỌC</h2>
            <p id="subHeaderText">Danh sách học viên / sinh viên thuộc Bộ môn quản lý</p>
        </div>

        <div id="loadingScreen" style="text-align: center; padding: 5rem 0; color: var(--primary); font-weight: 600; font-size: 1.2rem;">
            <i class="fas fa-spinner fa-spin fa-2x"></i><br><br>Đang tải dữ liệu người học...
        </div>

        <div id="dataWrapper" class="hidden">
            <!-- BẢNG ĐIỀU KHIỂN LỌC DỮ LIỆU -->
            <div class="controls-wrapper">
                <div class="filter-controls">
                    <div class="filter-group">
                        <label>Hệ đào tạo:</label>
                        <!-- Thêm onchange gọi updateClassOptions() để làm bộ lọc phân cấp (Cascading) -->
                        <select id="filterSystem" onchange="updateClassOptions()">
                            <option value="ALL">-- Tất cả --</option>
                            <option value="THS">Thạc sĩ (THS)</option>
                            <option value="CN">Cử nhân (CN)</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Khóa/Lớp:</label>
                        <select id="filterClass" onchange="renderTable()">
                            <option value="ALL">-- Tất cả --</option>
                        </select>
                    </div>
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="Tìm tên, mã số, số đt..." oninput="renderTable()">
                    </div>
                </div>
                <div class="action-buttons">
                    <button class="btn-export" onclick="exportToCSV()"><i class="fas fa-file-excel"></i> Xuất Excel</button>
                </div>
            </div>

            <!-- BẢNG DANH SÁCH -->
            <div class="table-container">
                <table>
                    <thead id="tableHead">
                        <!-- JS tự động quét và render cột -->
                    </thead>
                    <tbody id="tableBody">
                        <!-- JS render dữ liệu -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- MODAL CHI TIẾT NGƯỜI HỌC -->
    <div id="learnerModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header-profile">
                <button class="btn-close-modal" onclick="closeModal()">X</button>
                <div class="modal-avatar-lg" id="mdlAvatar">A</div>
                <h2 style="margin: 0 0 5px 0; font-size: 1.5rem;" id="mdlName">Tên Người Học</h2>
                <div style="font-size: 0.95rem; opacity: 0.9;">
                    <i class="fas fa-id-card"></i> <span id="mdlId">MSSV</span> | 
                    <i class="fas fa-graduation-cap"></i> Lớp: <b id="mdlClass"></b>
                </div>
            </div>
            
            <div class="modal-body">
                <div class="info-section">
                    <h4><i class="fas fa-address-book"></i> Hồ sơ chi tiết</h4>
                    <div class="info-grid" id="mdlDynamicInfo">
                        <!-- JS đổ dữ liệu động vào đây -->
                    </div>
                </div>

                <div class="info-section" id="thesisSection" class="hidden">
                    <h4><i class="fas fa-book-reader"></i> Thông tin Học thuật (Luận văn/Khóa luận)</h4>
                    <div id="thesisContent">
                        <div style="text-align: center; color: #94a3b8; font-size: 0.9rem; padding: 10px;">Đang dò tìm liên kết dữ liệu... <i class="fas fa-spinner fa-spin"></i></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="js/layout.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDVT4akTw65Uj6KHymwWtQ9xyHVyfTlXIY", authDomain: "bmphcn-aa9c6.firebaseapp.com", projectId: "bmphcn-aa9c6", storageBucket: "bmphcn-aa9c6.firebasestorage.app", messagingSenderId: "749494392719", appId: "1:749494392719:web:f220c751ff541620045dfa" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserName = '';
        let currentUserEmail = '';
        
        let learnersData = [];
        let thesesData = []; 
        let dynamicColumns = []; 

        // Các trường ưu tiên hiển thị theo đúng thứ tự yêu cầu
        const primaryColumns = ["studentId", "fullName", "className", "gender", "dob", "address", "ethnic", "orientation", "major", "workplace"];

        const columnTranslations = {
            "studentId": "Mã số",
            "fullName": "Họ và Tên",
            "className": "Lớp/Khóa",
            "gender": "Giới",
            "dob": "Ngày sinh",
            "address": "Nơi sinh",   // address được hiểu là Nơi sinh
            "ethnic": "Dân tộc",
            "orientation": "Định hướng",
            "major": "Chuyên ngành",
            "workplace": "Đơn vị công tác",
            "phone": "Điện thoại",
            "email": "Email",
            "id": "ID Hệ thống"
        };

        window.showToast = (message, type = 'success') => {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3000);
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserEmail = user.email.toLowerCase();
                
                // KHÓA HOÀN TOÀN TRUY CẬP ĐỐI VỚI TÀI KHOẢN HỌC VIÊN
                if (currentUserEmail === 'ths.phcn26@ump.edu.vn') {
                    alert("Tài khoản học viên không có quyền truy cập trang này!");
                    window.location.href = "thoi-khoa-bieu.html";
                    return; 
                }

                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists()) {
                        const data = userDoc.data();
                        let prefix = data.degree === 'ThS' ? 'ThS. ' : (data.degree === 'TS' ? 'TS. ' : '');
                        currentUserName = `${prefix}${data.fullName}`;
                        setTimeout(() => {
                            const btnAuthNav = document.getElementById('btnAuthNav');
                            if (btnAuthNav) {
                                btnAuthNav.innerHTML = `<i class="fas fa-user-circle" style="margin-right:5px;"></i> ${currentUserName}`;
                                btnAuthNav.href = "dashboard.html";
                            }
                        }, 300);
                    }
                    await loadAllData();
                } catch(e) { console.error("Lỗi:", e); }
            } else {
                window.location.href = "login.html";
            }
        });

        async function loadAllData() {
            try {
                const lSnap = await getDocs(collection(db, "learners"));
                learnersData = [];
                let keySet = new Set(); 

                lSnap.forEach(doc => {
                    const data = doc.data();
                    data.id = doc.id;
                    learnersData.push(data);
                    Object.keys(data).forEach(key => keySet.add(key));
                });

                if(learnersData.length === 0) {
                    learnersData = [
                        { id: "SV01", studentId: "4012025001", fullName: "Nguyễn Văn A", className: "THS2025", gender: "Nam", dob: "15/04/1995", address: "TP.HCM", ethnic: "Kinh", orientation: "UD", major: "VLTL", workplace: "BV Chợ Rẫy", phone: "0901234567", email: "nva@ump.edu.vn" }
                    ];
                    learnersData.forEach(d => Object.keys(d).forEach(k => keySet.add(k)));
                }

                learnersData.sort((a, b) => {
                    let idA = a.studentId ? String(a.studentId) : 'ZZZ';
                    let idB = b.studentId ? String(b.studentId) : 'ZZZ';
                    return idA.localeCompare(idB);
                });

                const tSnap = await getDocs(collection(db, "theses"));
                thesesData = [];
                tSnap.forEach(doc => thesesData.push(doc.data()));

                keySet.delete('id'); 
                keySet.delete('system'); 
                
                dynamicColumns = [];
                primaryColumns.forEach(pKey => {
                    if (keySet.has(pKey)) {
                        dynamicColumns.push(pKey);
                        keySet.delete(pKey);
                    }
                });
                Array.from(keySet).sort().forEach(extKey => dynamicColumns.push(extKey));

                // Khởi tạo List Lớp lần đầu tiên
                window.updateClassOptions();
                buildTableHeaders();

                document.getElementById('loadingScreen').classList.add('hidden');
                document.getElementById('dataWrapper').classList.remove('hidden');
                
            } catch (error) {
                console.error("Lỗi tải Data:", error);
                document.getElementById('loadingScreen').innerHTML = `<i class="fas fa-exclamation-triangle"></i><br><br>Lỗi tải dữ liệu: ${error.message}`;
            }
        }

        // HÀM TẠO BỘ LỌC CẤP BẬC (Cascading Filter)
        window.updateClassOptions = () => {
            const sys = document.getElementById('filterSystem').value;
            const classSelect = document.getElementById('filterClass');
            const currentVal = classSelect.value;
            classSelect.innerHTML = '<option value="ALL">-- Tất cả các Lớp --</option>';

            let classes = new Set();
            learnersData.forEach(l => {
                let matchSys = true;
                if (sys === 'THS') {
                    matchSys = l.className && l.className.toUpperCase().includes('THS');
                } else if (sys === 'CN') {
                    matchSys = l.className && (l.className.toUpperCase().includes('CN') || !l.className.toUpperCase().includes('THS'));
                }
                
                if (matchSys && l.className) {
                    classes.add(l.className);
                }
            });

            Array.from(classes).sort().forEach(c => {
                classSelect.innerHTML += `<option value="${c}">${c}</option>`;
            });

            // Phục hồi lại giá trị đang chọn nếu nó vẫn tồn tại trong danh sách lớp mới
            if (Array.from(classes).includes(currentVal)) {
                classSelect.value = currentVal;
            } else {
                classSelect.value = 'ALL';
            }
            
            // Tải lại bảng sau khi thay đổi bộ lọc lớp
            window.renderTable();
        };

        function buildTableHeaders() {
            const thead = document.getElementById('tableHead');
            let tr = '<tr>';
            tr += '<th style="width: 40px; text-align: center;"><i class="fas fa-eye"></i></th>';
            tr += '<th>Lớp/Khóa</th>';
            tr += '<th style="width: 50px; text-align: center;">STT</th>';
            
            dynamicColumns.forEach(col => {
                if (col !== 'system' && col !== 'className') {
                    let displayName = columnTranslations[col] || col.charAt(0).toUpperCase() + col.slice(1);
                    tr += `<th>${displayName}</th>`;
                }
            });
            
            tr += '</tr>';
            thead.innerHTML = tr;
        }

        window.renderTable = () => {
            const tbody = document.getElementById('tableBody');
            const sys = document.getElementById('filterSystem').value;
            const cls = document.getElementById('filterClass').value;
            const queryTxt = document.getElementById('searchInput').value.toLowerCase();

            tbody.innerHTML = '';

            let filtered = learnersData.filter(l => {
                let matchSys = true;
                if (sys === 'THS') {
                    matchSys = l.className && l.className.toUpperCase().includes('THS');
                } else if (sys === 'CN') {
                    matchSys = l.className && (l.className.toUpperCase().includes('CN') || !l.className.toUpperCase().includes('THS'));
                }

                let matchCls = cls === 'ALL' || l.className === cls;

                let matchTxt = false;
                if (!queryTxt) {
                    matchTxt = true;
                } else {
                    for (let key in l) {
                        if (key !== 'system' && l[key] && String(l[key]).toLowerCase().includes(queryTxt)) {
                            matchTxt = true;
                            break;
                        }
                    }
                }
                return matchSys && matchCls && matchTxt;
            });

            if (filtered.length === 0) {
                let colSpan = dynamicColumns.length + 3; 
                tbody.innerHTML = `<tr><td colspan="${colSpan}" style="text-align:center; padding:30px; color:var(--text-body);">Không tìm thấy người học nào phù hợp.</td></tr>`;
                return;
            }

            let stt = 1;
            filtered.forEach(l => {
                let rowHtml = `<tr onclick="openLearnerModal('${l.id}')">`;
                
                rowHtml += `<td align="center"><button class="btn-view-row" title="Xem chi tiết"><i class="fas fa-eye"></i></button></td>`;
                
                let clsVal = l['className'] || '';
                rowHtml += `<td class="key-className" style="font-weight:bold; color:var(--primary);">${clsVal}</td>`;
                rowHtml += `<td align="center" style="color:#94a3b8; font-weight:bold;">${stt++}</td>`;

                dynamicColumns.forEach(col => {
                    if (col !== 'system' && col !== 'className') {
                        let val = l[col] || '';
                        let extraClass = `key-${col}`;
                        rowHtml += `<td class="${extraClass}">${val}</td>`;
                    }
                });

                rowHtml += `</tr>`;
                
                tbody.innerHTML += rowHtml;
            });
        };

        window.openLearnerModal = (id) => {
            const l = learnersData.find(x => x.id === id);
            if (!l) return;

            document.getElementById('mdlName').innerText = l.fullName || 'Chưa cập nhật tên';
            document.getElementById('mdlAvatar').innerText = l.fullName ? l.fullName.charAt(0).toUpperCase() : '?';
            document.getElementById('mdlId').innerText = l.studentId || 'Chưa có MSSV';
            document.getElementById('mdlClass').innerText = l.className || 'Chưa phân lớp';
            
            const infoGrid = document.getElementById('mdlDynamicInfo');
            infoGrid.innerHTML = '';
            
            let skipKeys = ['id', 'fullName', 'studentId', 'className', 'system'];
            
            dynamicColumns.forEach(col => {
                if (!skipKeys.includes(col)) {
                    let val = l[col] || '---';
                    let displayName = columnTranslations[col] || col.charAt(0).toUpperCase() + col.slice(1);
                    
                    let widthClass = (col.toLowerCase().includes('address') || col.toLowerCase().includes('địa chỉ') || col.toLowerCase().includes('placeofbirth') || col.toLowerCase().includes('nơi sinh') || col.toLowerCase().includes('note') || col.toLowerCase().includes('ghi chú')) ? 'full-width' : '';

                    infoGrid.innerHTML += `
                        <div class="info-item ${widthClass}">
                            <span class="info-label">${displayName}</span>
                            <span class="info-value">${val}</span>
                        </div>
                    `;
                }
            });

            const thesisSection = document.getElementById('thesisSection');
            const thesisContainer = document.getElementById('thesisContent');
            const myTheses = thesesData.filter(t => t.author && t.author.toLowerCase() === (l.fullName || '').toLowerCase());

            if (myTheses.length > 0) {
                thesisSection.classList.remove('hidden');
                let html = '';
                myTheses.forEach(t => {
                    html += `
                        <div class="thesis-card">
                            <p><b>Đề tài:</b> ${t.title || 'Chưa cập nhật tên đề tài'}</p>
                            <p><b>GV Hướng dẫn:</b> ${t.advisor || 'Chưa phân công'}</p>
                            <p><b>Điểm số:</b> ${t.score ? `<span class="thesis-score">${t.score}</span>` : '<i style="color:#94a3b8;">Chưa có điểm</i>'}</p>
                        </div>
                    `;
                });
                thesisContainer.innerHTML = html;
            } else {
                thesisSection.classList.add('hidden');
            }

            document.getElementById('learnerModal').classList.remove('hidden');
        };

        window.closeModal = () => {
            document.getElementById('learnerModal').classList.add('hidden');
        };

        window.exportToCSV = () => {
            if (learnersData.length === 0) {
                showToast("Không có dữ liệu để xuất!", "danger");
                return;
            }

            const sys = document.getElementById('filterSystem').value;
            const cls = document.getElementById('filterClass').value;
            const queryTxt = document.getElementById('searchInput').value.toLowerCase();

            let filteredForExport = learnersData.filter(l => {
                let matchSys = true;
                if (sys === 'THS') {
                    matchSys = l.className && l.className.toUpperCase().includes('THS');
                } else if (sys === 'CN') {
                    matchSys = l.className && (l.className.toUpperCase().includes('CN') || !l.className.toUpperCase().includes('THS'));
                }

                let matchCls = cls === 'ALL' || l.className === cls;

                let matchTxt = false;
                if (!queryTxt) matchTxt = true;
                else {
                    for (let key in l) {
                        if (key !== 'system' && l[key] && String(l[key]).toLowerCase().includes(queryTxt)) {
                            matchTxt = true; break;
                        }
                    }
                }
                return matchSys && matchCls && matchTxt;
            });

            if (filteredForExport.length === 0) {
                showToast("Dữ liệu lọc trống, không có gì để xuất!", "danger");
                return;
            }

            let csvContent = "\uFEFF"; 
            
            let headers = ["Lớp/Khóa", "STT"];
            dynamicColumns.forEach(col => {
                if (col !== 'system' && col !== 'className') {
                    headers.push(columnTranslations[col] || col);
                }
            });
            csvContent += headers.join(",") + "\n";

            filteredForExport.forEach((l, idx) => {
                let row = [];
                
                let clsVal = l['className'] || '';
                clsVal = String(clsVal).replace(/"/g, '""');
                if (clsVal.search(/("|,|\n)/g) >= 0) {
                    clsVal = `"${clsVal}"`;
                }
                row.push(clsVal);

                row.push((idx + 1).toString());
                
                dynamicColumns.forEach(col => {
                    if (col !== 'system' && col !== 'className') {
                        let val = l[col] || '';
                        val = String(val).replace(/"/g, '""');
                        if (val.search(/("|,|\n)/g) >= 0) {
                            val = `"${val}"`;
                        }
                        row.push(val);
                    }
                });
                csvContent += row.join(",") + "\n";
            });

            let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            let link = document.createElement("a");
            let url = URL.createObjectURL(blob);
            
            let dateStr = new Date().toLocaleDateString('vi-VN').split('/').join('-');
            let fileName = `Danh_Sach_Nguoi_Hoc_${cls}_${dateStr}.csv`;
            
            link.setAttribute("href", url);
            link.setAttribute("download", fileName);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showToast("Đã xuất file CSV thành công!");
        };

    </script>
</body>
</html>
