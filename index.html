<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Trang thông tin chính thức của Bộ môn Phục hồi chức năng.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdnjs.cloudflare.com https://www.gstatic.com https://*.firebaseio.com https://*.googleapis.com; connect-src 'self' https://api64.ipify.org https://*.firebaseio.com https://*.googleapis.com; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' https://www.gstatic.com;">
    <title>Bộ môn Phục hồi chức năng</title>
    
    <link rel="icon" href="images/logo_Bộ môn.png" type="image/png">
    <link rel="apple-touch-icon" href="images/logo_Bộ môn.png">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- CSS CHO SLIDESHOW LƯỚT NGANG --- */
        .slideshow-container {
            width: 100%;
            position: relative;
            margin-bottom: 2.5rem;
            border-radius: var(--radius-md);
            overflow: hidden; 
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        .slider-track {
            display: flex;
            width: 100%;
            height: 450px;
            transition: transform 0.8s ease-in-out; 
        }

        .slider-track img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex-shrink: 0; 
        }

        /* --- CSS CHO LƯỚI QUICK LINKS --- */
        #quickLinksContainer {
            min-height: 200px;
            position: relative;
        }

        .loading-spinner {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: var(--primary);
            font-size: 2rem;
            text-align: center;
        }

        /* --- CSS CHO NÚT LƯỢT XEM --- */
        .view-counter-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            z-index: 1000;
        }

        .visitor-info-trigger {
            width: 52px;
            height: 52px;
            border: 2px solid rgba(255,255,255,0.25);
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(2, 132, 199, 0.3);
            font-size: 1.25rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .visitor-info-trigger:hover, .visitor-info-trigger:focus-visible {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(2, 132, 199, 0.4);
            outline: none;
        }

        .visitor-info-panel {
            position: absolute;
            right: 0;
            bottom: 64px;
            min-width: 260px;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--surface);
            color: var(--text-dark);
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.18);
            font-size: 0.9rem;
        }

        .visitor-info-row {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 0;
            border-bottom: 1px solid var(--border);
        }
        .visitor-info-row:last-child { border-bottom: 0; }
        .visitor-info-row i { width: 18px; color: var(--primary); text-align: center; }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 768px) {
            .slider-track { height: 250px; }
            .view-counter-widget {
                bottom: 15px;
                right: 15px;
            }
            .visitor-info-panel { right: 0; bottom: 60px; min-width: min(260px, calc(100vw - 30px)); }
        }
    </style>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">
    
    <!-- HEADER CHUNG -->
    <div id="header-placeholder"></div>

    <main style="flex: 1; padding-top: 2rem;">
        
        <!-- PHẦN SLIDESHOW CHẠY ẢNH -->
        <div class="slideshow-container">
            <div class="slider-track" id="slider-track">
                <img src="images/1.jpg" alt="Slide 1">
                <img src="images/2.jpg" alt="Slide 2">
                <img src="images/3.jpg" alt="Slide 3">
                <img src="images/4.jpg" alt="Slide 4">
                <img src="images/5.jpg" alt="Slide 5">
            </div>
        </div>

        <!-- LƯỚI CÁC PHÂN MỤC CHÍNH ĐƯỢC LOAD TỰ ĐỘNG -->
        <section class="quick-links" id="quickLinksContainer" style="margin-bottom: 2rem;">
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i><br>
                <span style="font-size: 1rem; color: var(--text-body); font-weight: normal;">Đang tải danh mục...</span>
            </div>
        </section>

    </main>

    <!-- NÚT HIỂN THỊ LƯỢT XEM NỔI -->
    <div class="view-counter-widget" id="viewCounterWidget" style="display: none;">
        <button type="button" id="visitorInfoTrigger" class="visitor-info-trigger" onclick="toggleVisitorInfo()" aria-label="Xem thông tin truy cập" aria-expanded="false"><i class="fas fa-info"></i></button>
        <div id="visitorInfoPanel" class="visitor-info-panel hidden" role="status">
            <div class="visitor-info-row"><i class="fas fa-eye"></i><span>Lượt xem: <b id="viewCountNumber">...</b></span></div>
            <div class="visitor-info-row"><i class="fas fa-network-wired"></i><span>IP: <b id="visitorIpAddress">Đang tải...</b></span></div>
            <div class="visitor-info-row"><i class="fas fa-laptop"></i><span>Thiết bị: <b id="visitorDevice">Đang xác định...</b></span></div>
        </div>
    </div>

    <!-- FOOTER CHUNG -->
    <div id="footer-placeholder"></div>

    <!-- GỌI LAYOUT CHUNG -->
    <script src="js/layout.js"></script>

    <!-- SCRIPT TẢI DỮ LIỆU JSON & XỬ LÝ GIAO DIỆN -->
    <script>
        // --- XỬ LÝ SLIDESHOW LƯỚT NGANG ---
        const track = document.getElementById('slider-track');
        let slideIndex = 0;
        const totalSlides = 5;

        function moveSlides() {
            slideIndex++;
            if (slideIndex >= totalSlides) {
                slideIndex = 0;
            }
            track.style.transform = `translateX(-${slideIndex * 100}%)`;
        }

        setInterval(moveSlides, 3000);

        // --- TẢI DANH MỤC TỪ JSON (TƯƠNG TỰ TRANG TÀI NGUYÊN) ---
        async function loadQuickLinks() {
            const container = document.getElementById('quickLinksContainer');
            try {
                // Đọc file json/index_links.json
                const response = await fetch('json/index_links.json');
                if (!response.ok) throw new Error('Không thể tải file cấu hình danh mục.');
                
                const linksData = await response.json();
                
                // Xóa trạng thái loading
                container.innerHTML = '';

                // Duyệt qua mảng JSON và tạo thẻ HTML tương ứng
                linksData.forEach(link => {
                    const card = document.createElement('a');
                    card.href = link.url;
                    card.className = 'quick-card';
                    
                    // Nếu JSON có quy định màu tùy chỉnh, thì áp dụng, nếu không để trống
                    let customStyle = '';
                    if (link.color || link.bgColor) {
                        customStyle = `style="color: ${link.color || 'inherit'}; background-color: ${link.bgColor || 'inherit'};"`;
                    }

                    card.innerHTML = `
                        <div class="icon-wrapper" ${customStyle}>
                            <i class="${link.icon}"></i>
                        </div>
                        <h3>${link.title}</h3>
                        <p>${link.description}</p>
                    `;
                    
                    container.appendChild(card);
                });

            } catch (error) {
                console.error("Lỗi tải danh mục từ JSON:", error);
                container.innerHTML = `<div style="text-align:center; padding: 2rem; color: #dc2626; width: 100%;"><i class="fas fa-exclamation-triangle fa-2x mb-3"></i><br>Không thể tải danh mục. Vui lòng tải lại trang.</div>`;
            }
        }

        // Kích hoạt ngay khi trình duyệt đọc đến đoạn script này
        loadQuickLinks();

        // --- CÁC HÀM XỬ LÝ WIDGET THÔNG TIN TRUY CẬP ---
        async function showVisitorIp() {
            const ipAddress = document.getElementById('visitorIpAddress');
            try {
                const response = await fetch('https://api64.ipify.org?format=json');
                if (!response.ok) throw new Error('Không thể lấy địa chỉ IP');
                const data = await response.json();
                ipAddress.textContent = data.ip || 'Không xác định';
            } catch (error) {
                ipAddress.textContent = 'Không xác định';
                console.warn('Không thể hiển thị IP khách truy cập:', error);
            }
        }

        function showVisitorDevice() {
            const deviceOutput = document.getElementById('visitorDevice');
            const agent = navigator.userAgent;
            const platform = /Android/i.test(agent) ? 'Android'
                : /iPhone|iPad|iPod/i.test(agent) ? 'iPhone/iPad'
                : /Windows/i.test(agent) ? 'Windows'
                : /Macintosh|Mac OS X/i.test(agent) ? 'macOS'
                : /Linux/i.test(agent) ? 'Linux'
                : 'Thiết bị khác';
            const browser = /Edg\//i.test(agent) ? 'Edge'
                : /OPR\//i.test(agent) ? 'Opera'
                : /Firefox\//i.test(agent) ? 'Firefox'
                : /Chrome\//i.test(agent) ? 'Chrome'
                : /Safari\//i.test(agent) ? 'Safari'
                : 'Trình duyệt khác';

            deviceOutput.textContent = `${platform} · ${browser}`;
        }

        showVisitorIp();
        showVisitorDevice();

        window.toggleVisitorInfo = () => {
            const panel = document.getElementById('visitorInfoPanel');
            const trigger = document.getElementById('visitorInfoTrigger');
            const isOpening = panel.classList.contains('hidden');
            panel.classList.toggle('hidden', !isOpening);
            trigger.setAttribute('aria-expanded', String(isOpening));
        };

        document.addEventListener('click', (event) => {
            const widget = document.getElementById('viewCounterWidget');
            const panel = document.getElementById('visitorInfoPanel');
            const trigger = document.getElementById('visitorInfoTrigger');
            if (widget && !widget.contains(event.target)) {
                panel.classList.add('hidden');
                trigger.setAttribute('aria-expanded', 'false');
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                document.getElementById('visitorInfoPanel').classList.add('hidden');
                document.getElementById('visitorInfoTrigger').setAttribute('aria-expanded', 'false');
            }
        });
    </script>

    <!-- Cấu hình Firebase V9 Modular (Đếm Lượt Xem) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, increment, setDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDVT4akTw65Uj6KHymwWtQ9xyHVyfTlXIY",
            authDomain: "bmphcn-aa9c6.firebaseapp.com",
            projectId: "bmphcn-aa9c6",
            storageBucket: "bmphcn-aa9c6.firebasestorage.app",
            messagingSenderId: "749494392719",
            appId: "1:749494392719:web:f220c751ff541620045dfa",
            measurementId: "G-LBLG62PTDK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        async function updateAndFetchViews() {
            const counterRef = doc(db, "settings", "viewCounter");
            try {
                const docSnap = await getDoc(counterRef);
                const hasVisited = sessionStorage.getItem("hasVisitedIndex");

                if (!docSnap.exists()) {
                    await setDoc(counterRef, { totalViews: 1 });
                    document.getElementById('viewCountNumber').innerText = "1";
                    sessionStorage.setItem("hasVisitedIndex", "true");
                } else {
                    let currentViews = docSnap.data().totalViews || 0;
                    
                    if (!hasVisited) {
                        await updateDoc(counterRef, { totalViews: increment(1) });
                        currentViews += 1;
                        sessionStorage.setItem("hasVisitedIndex", "true");
                    }
                    
                    document.getElementById('viewCountNumber').innerText = currentViews.toLocaleString('vi-VN');
                }
                
                document.getElementById('viewCounterWidget').style.display = 'flex';

            } catch (error) {
                console.error("Lỗi khi kết nối bộ đếm lượt xem:", error);
            }
        }

        updateAndFetchViews();
    </script>
</body>
</html>
