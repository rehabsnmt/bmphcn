<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Danh sách thông báo Bộ môn Phục hồi chức năng.">
    <title>Thông báo - Bộ môn Phục hồi chức năng</title>
    
    <link rel="icon" href="images/logo_Bộ môn.png" type="image/png">
    <link rel="apple-touch-icon" href="images/logo_Bộ môn.png">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- CSS CHO TRANG THÔNG BÁO --- */
        main { max-width: 1000px; padding: 2rem 3%; margin: 0 auto; width: 100%; box-sizing: border-box; }
        
        .header-section { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; border-bottom: 2px solid var(--border); padding-bottom: 1rem; flex-wrap: wrap; gap: 1rem; }
        .header-section h2 { font-size: 2.2rem; color: var(--text-dark); margin: 0; }
        
        .btn-add { background-color: var(--primary); color: white; border: none; padding: 0.7rem 1.2rem; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: var(--transition); }
        .btn-add:hover { background-color: var(--primary-hover); }
        
        /* Form đăng bài */
        .admin-form-box { background: var(--surface); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--primary-light); box-shadow: var(--shadow-sm); margin-bottom: 2rem; display: none; }
        .admin-form-box.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        .input-group { margin-bottom: 1rem; }
        .input-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 5px; color: var(--text-dark); }
        .input-group input, .input-group textarea { width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 0.95rem; outline: none; box-sizing: border-box; }
        .input-group input:focus, .input-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1); }
        .input-group textarea { min-height: 150px; resize: vertical; }

        /* Danh sách thông báo */
        .news-list { display: flex; flex-direction: column; gap: 1.5rem; }
        .news-item { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; gap: 10px; transition: var(--transition); cursor: pointer; text-decoration: none; color: inherit; position: relative; }
        .news-item:hover { box-shadow: var(--shadow-hover); border-color: var(--primary-light); transform: translateY(-3px); }
        
        /* Chỉnh sửa cho bài được Ghim */
        .news-item.pinned { border-left: 4px solid #f97316; background: #fffedd; }
        .pinned-badge { display: inline-block; background: #f97316; color: white; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; margin-bottom: 5px; align-self: flex-start; }
        
        .news-title { font-size: 1.3rem; font-weight: 700; color: var(--text-dark); margin: 0; line-height: 1.4; }
        .news-meta { font-size: 0.85rem; color: var(--text-body); display: flex; gap: 15px; align-items: center; }
        .news-excerpt { font-size: 0.95rem; color: var(--text-body); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .empty-state { text-align: center; padding: 3rem; color: var(--text-body); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) { .header-section { flex-direction: column; align-items: stretch; text-align: center; } .btn-add { justify-content: center; } }
    </style>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">
    
    <!-- 1. HEADER CHUNG (Tự động load từ layout.js) -->
    <div id="header-placeholder"></div>

    <main style="flex: 1; padding-top: 2rem;">
        <div class="header-section">
            <h2>Thông báo Bộ môn</h2>
            <button id="btnToggleForm" class="btn-add" style="display: none;">
                <i class="fas fa-plus"></i> Đăng thông báo mới
            </button>
        </div>

        <!-- KHUNG ĐĂNG BÀI / SỬA BÀI -->
        <div id="adminFormBox" class="admin-form-box">
            <h3 id="formTitle" style="margin-top:0; color:var(--primary);">Tạo thông báo mới</h3>
            <form id="formPostNews" onsubmit="return false;">
                <input type="hidden" id="editNewsId">
                <div class="input-group">
                    <label>Tiêu đề thông báo *</label>
                    <input type="text" id="newsTitle" placeholder="Nhập tiêu đề..." required>
                </div>
                <div class="input-group">
                    <label>Nội dung chi tiết *</label>
                    <textarea id="newsContent" placeholder="Nhập nội dung bài viết..." required></textarea>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button type="submit" id="btnSubmitNews" class="btn-add" style="flex: 1;">
                        Đăng tải bài viết
                    </button>
                    <button type="button" id="btnCancelEdit" class="btn-danger" style="display: none; padding: 0.7rem 1.2rem; border-radius: 8px;">
                        Hủy thao tác
                    </button>
                </div>
            </form>
        </div>

        <!-- DANH SÁCH THÔNG BÁO -->
        <div id="newsList" class="news-list">
            <!-- Bài viết được GHIM cứng trên hệ thống -->
            <a href="tkb-ths2026.html" class="news-item pinned">
                <span class="pinned-badge"><i class="fas fa-thumbtack"></i> Đã ghim</span>
                <h3 class="news-title">Thời khóa biểu lớp Thạc sĩ 2026</h3>
                <div class="news-excerpt">Vui lòng click vào đây để xem chi tiết thời khóa biểu dự kiến dành cho học viên.</div>
                <div class="news-meta">
                    <span><i class="fas fa-calendar-alt"></i> Hệ thống</span>
                    <span class="author-info"><i class="fas fa-pencil-alt"></i> Đăng bởi: Bộ môn PHCN</span>
                </div>
            </a>

            <!-- Nơi render dữ liệu từ Firebase -->
            <div id="dynamicNewsContainer">
                <div class="empty-state"><i class="fas fa-spinner fa-spin" style="font-size: 2rem;"></i><p>Đang tải thông báo...</p></div>
            </div>
        </div>
    </main>

    <!-- MODAL XÓA BÀI -->
    <div id="deleteConfirmModal" class="modal-overlay hidden">
        <div class="modal-content">
            <button class="modal-close" onclick="closeDeleteModal()"><i class="fas fa-times"></i></button>
            <h3 style="color: var(--accent); margin-bottom: 15px;"><i class="fas fa-exclamation-triangle"></i> Xác nhận xóa</h3>
            <p style="font-size: 0.9rem; color: var(--text-body);">Thông báo:</p>
            <p id="deleteNewsTitlePreview" style="font-weight: 700; color: var(--text-dark); margin-bottom: 20px; line-height: 1.4;"></p>
            <p style="font-size: 0.85rem;">Mã xác nhận:</p>
            <div id="randomDeleteCodeDisplay" style="background: var(--bg-page); padding: 10px; border-radius: 6px; font-size: 1.5rem; font-weight: bold; color: var(--accent); letter-spacing: 5px; margin-bottom: 15px;">0000</div>
            <input type="text" id="inputDeleteCodeConfirm" placeholder="Nhập mã xác nhận..." style="text-align: center; letter-spacing: 2px; width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; margin-bottom: 15px;">
            <button id="btnExecuteFinalDelete" class="btn-danger" disabled style="width: 100%; padding: 10px; font-size: 1rem;">Xóa vĩnh viễn</button>
        </div>
    </div>

    <!-- 3. FOOTER CHUNG (Tự động load từ layout.js) -->
    <div id="footer-placeholder"></div>

    <!-- 4. GỌI LAYOUT CHUNG -->
    <script src="js/layout.js"></script>

    <!-- FIREBASE MODULAR (V9) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDVT4akTw65Uj6KHymwWtQ9xyHVyfTlXIY",
            authDomain: "bmphcn-aa9c6.firebaseapp.com",
            projectId: "bmphcn-aa9c6",
            storageBucket: "bmphcn-aa9c6.firebasestorage.app",
            messagingSenderId: "749494392719",
            appId: "1:749494392719:web:f220c751ff541620045dfa",
            measurementId: "G-LBLG62PTDK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const btnToggleForm = document.getElementById('btnToggleForm');
        const adminFormBox = document.getElementById('adminFormBox');
        const dynamicNewsContainer = document.getElementById('dynamicNewsContainer');
        let currentAuthor = "Giảng viên";
        let isAdmin = false;

        // Xác thực người dùng
        onAuthStateChanged(auth, async (user) => {
            // Sử dụng setTimeout để đợi file layout.js chèn nút Đăng nhập vào trang
            setTimeout(async () => {
                const btnAuthNav = document.getElementById('btnAuthNav');
                if (user) {
                    // Nếu là tài khoản THS2026 thì xem như khách vãng lai
                    if (user.email.toLowerCase() === 'ths.phcn26@ump.edu.vn') {
                        isAdmin = false;
                        document.body.classList.remove('is-logged-in'); 
                        btnToggleForm.style.display = 'none';
                        if(btnAuthNav) btnAuthNav.innerHTML = `<i class="fas fa-user-circle" style="margin-right: 5px;"></i> Lớp Thạc sĩ 2026`;
                        return; // Ngừng thực thi các logic Admin bên dưới
                    }

                    isAdmin = true;
                    document.body.classList.add('is-logged-in'); // Hiện tên tác giả
                    btnToggleForm.style.display = 'flex'; 
                    try {
                        const userDoc = await getDoc(doc(db, "users", user.uid));
                        if (userDoc.exists()) {
                            const data = userDoc.data();
                            currentAuthor = data.fullName || "Giảng viên";
                            let degreePrefix = data.degree === 'ThS' ? 'ThS. ' : (data.degree === 'TS' ? 'TS. ' : '');
                            if(btnAuthNav) btnAuthNav.innerHTML = `<i class="fas fa-user-circle" style="margin-right: 5px;"></i> ${degreePrefix}${currentAuthor}`;
                        } else {
                            if(btnAuthNav) btnAuthNav.innerHTML = `<i class="fas fa-user-circle" style="margin-right: 5px;"></i> Giảng viên`;
                        }
                    } catch (error) {
                        console.error("Lỗi lấy thông tin người dùng: ", error);
                    }
                } else {
                    isAdmin = false;
                    document.body.classList.remove('is-logged-in'); // Ẩn tên tác giả
                    btnToggleForm.style.display = 'none';
                    if(btnAuthNav) {
                        btnAuthNav.innerHTML = 'Đăng nhập';
                        btnAuthNav.href = "login.html";
                    }
                }
            }, 100);
        });

        // Bật/tắt Form (Tạo mới)
        btnToggleForm.addEventListener('click', () => {
            if(!adminFormBox.classList.contains('active')){
                resetForm(); // Dọn dẹp form nếu đang ở chế độ sửa
                adminFormBox.classList.add('active');
                btnToggleForm.innerHTML = '<i class="fas fa-times"></i> Đóng khung soạn thảo';
                btnToggleForm.style.backgroundColor = 'var(--text-body)';
            } else {
                adminFormBox.classList.remove('active');
                btnToggleForm.innerHTML = '<i class="fas fa-plus"></i> Đăng thông báo mới';
                btnToggleForm.style.backgroundColor = 'var(--primary)';
            }
        });

        // Đăng bài viết / Cập nhật
        document.getElementById('formPostNews').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnSubmit = document.getElementById('btnSubmitNews');
            btnSubmit.disabled = true; 
            btnSubmit.innerHTML = "Đang xử lý...";

            const title = document.getElementById('newsTitle').value.trim();
            const content = document.getElementById('newsContent').value.trim();
            const editId = document.getElementById('editNewsId').value;

            try {
                if (editId) {
                    await updateDoc(doc(db, "announcements", editId), {
                        title: title, 
                        content: content
                    });
                    alert("Cập nhật thông báo thành công!");
                } else {
                    await addDoc(collection(db, "announcements"), {
                        title: title, 
                        content: content, 
                        author: currentAuthor,
                        createdAt: serverTimestamp()
                    });
                    alert("Đăng thông báo thành công!");
                }
                resetForm();
                adminFormBox.classList.remove('active');
                btnToggleForm.innerHTML = '<i class="fas fa-plus"></i> Đăng thông báo mới';
                btnToggleForm.style.backgroundColor = 'var(--primary)';
            } catch (err) {
                alert("Lỗi: " + err.message);
            } finally {
                btnSubmit.disabled = false; 
                btnSubmit.innerHTML = "Đăng tải bài viết";
            }
        });

        // Dọn dẹp Form
        function resetForm() {
            document.getElementById('formPostNews').reset();
            document.getElementById('editNewsId').value = '';
            document.getElementById('formTitle').innerText = "Tạo thông báo mới";
            document.getElementById('btnSubmitNews').innerText = "Đăng tải bài viết";
            document.getElementById('btnCancelEdit').style.display = "none";
        }
        document.getElementById('btnCancelEdit').addEventListener('click', () => {
            resetForm();
            adminFormBox.classList.remove('active');
            btnToggleForm.innerHTML = '<i class="fas fa-plus"></i> Đăng thông báo mới';
            btnToggleForm.style.backgroundColor = 'var(--primary)';
        });

        // ==========================================
        // CÁC HÀM XỬ LÝ SỰ KIỆN TỪ GIAO DIỆN HIỂN THỊ
        // ==========================================
        
        window.triggerEdit = (id, enTitle, enContent) => {
            document.getElementById('editNewsId').value = id;
            document.getElementById('newsTitle').value = decodeURIComponent(enTitle);
            document.getElementById('newsContent').value = decodeURIComponent(enContent);
            
            document.getElementById('formTitle').innerText = "Sửa thông báo";
            document.getElementById('btnSubmitNews').innerHTML = '<i class="fas fa-save"></i> Cập nhật thay đổi';
            document.getElementById('btnCancelEdit').style.display = "block";
            
            if (!adminFormBox.classList.contains('active')) {
                adminFormBox.classList.add('active');
                btnToggleForm.innerHTML = '<i class="fas fa-times"></i> Đóng khung soạn thảo';
                btnToggleForm.style.backgroundColor = 'var(--text-body)';
            }
            adminFormBox.scrollIntoView({behavior: 'smooth', block: 'start'});
        };

        let targetDeleteId = null;
        let generatedSecurityCode = "";

        window.triggerDeleteConfirm = (id, enTitle) => {
            targetDeleteId = id;
            generatedSecurityCode = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('deleteNewsTitlePreview').innerText = decodeURIComponent(enTitle);
            document.getElementById('randomDeleteCodeDisplay').innerText = generatedSecurityCode;
            document.getElementById('inputDeleteCodeConfirm').value = '';
            document.getElementById('btnExecuteFinalDelete').disabled = true;
            document.getElementById('deleteConfirmModal').classList.remove('hidden');
        };

        window.closeDeleteModal = () => {
            document.getElementById('deleteConfirmModal').classList.add('hidden');
        };

        document.getElementById('inputDeleteCodeConfirm').addEventListener('input', (e) => {
            document.getElementById('btnExecuteFinalDelete').disabled = (e.target.value.trim() !== generatedSecurityCode);
        });

        document.getElementById('btnExecuteFinalDelete').addEventListener('click', async () => {
            if(!targetDeleteId) return;
            try {
                await deleteDoc(doc(db, "announcements", targetDeleteId));
                closeDeleteModal();
            } catch(e) {
                alert("Lỗi xóa: " + e.message);
            }
        });

        // Tải danh sách
        const q = query(collection(db, "announcements"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            if (snapshot.empty) { 
                dynamicNewsContainer.innerHTML = ''; 
                return; 
            }
            dynamicNewsContainer.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                
                let dateStr = "Vừa xong";
                if (data.createdAt) {
                    const dateObj = data.createdAt.toDate();
                    dateStr = dateObj.toLocaleDateString('vi-VN', {day:'2-digit', month:'2-digit', year:'numeric'}) + ' - ' + dateObj.toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'});
                }
                
                let excerpt = data.content.substring(0, 150);
                if (data.content.length > 150) excerpt += "...";

                const safeTitle = encodeURIComponent(data.title || '').replace(/'/g, "%27");
                const safeContent = encodeURIComponent(data.content || '').replace(/'/g, "%27");

                let actionHtml = '';
                if (isAdmin) {
                    actionHtml = `
                        <div class="action-buttons" onclick="event.preventDefault();">
                            <button class="btn-warning" onclick="event.preventDefault(); triggerEdit('${id}', '${safeTitle}', '${safeContent}')"><i class="fas fa-edit"></i> Sửa</button>
                            <button class="btn-danger" onclick="event.preventDefault(); triggerDeleteConfirm('${id}', '${safeTitle}')"><i class="fas fa-trash"></i> Xóa</button>
                        </div>
                    `;
                }

                const a = document.createElement('a');
                a.href = `xem-thong-bao.html?id=${id}`;
                a.className = 'news-item';
                a.innerHTML = `
                    <h3 class="news-title">${data.title}</h3>
                    <div class="news-excerpt">${excerpt}</div>
                    <div class="news-meta">
                        <span><i class="fas fa-calendar-alt"></i> ${dateStr}</span>
                        <span class="author-info"><i class="fas fa-pencil-alt"></i> Đăng bởi: ${data.author || 'Hệ thống'}</span>
                    </div>
                    ${actionHtml}
                `;
                dynamicNewsContainer.appendChild(a);
            });
        });
    </script>
</body>
</html>
