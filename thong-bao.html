<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Danh sách thông báo Bộ môn Phục hồi chức năng.">
    <title>Thông báo - Bộ môn Phục hồi chức năng</title>
    
    <link rel="icon" href="images/logo_Bộ môn.png" type="image/png">
    <link rel="apple-touch-icon" href="images/logo_Bộ môn.png">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tích hợp Quill.js CSS cho giao diện soạn thảo -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    
    <style>
        /* --- CSS CHO TRANG THÔNG BÁO --- */
        main { max-width: 1000px; padding: 2rem 3%; margin: 0 auto; width: 100%; box-sizing: border-box; }
        
        .header-section { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1.5rem; border-bottom: 2px solid var(--border); padding-bottom: 1rem; flex-wrap: wrap; gap: 1rem; }
        .header-section h2 { font-size: 2rem; color: var(--text-dark); margin: 0; }
        
        .btn-add { background-color: var(--primary); color: white; border: none; padding: 0.6rem 1rem; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: var(--transition); font-size: 0.95rem; }
        .btn-add:hover { background-color: var(--primary-hover); }
        
        /* Tìm kiếm */
        .search-box { position: relative; margin-bottom: 1.5rem; }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        .search-box input { width: 100%; padding: 10px 15px 10px 40px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.95rem; outline: none; box-sizing: border-box; transition: 0.2s; background: white; box-shadow: var(--shadow-sm); }
        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1); }

        /* Form đăng bài */
        .admin-form-box { background: var(--surface); padding: 1.5rem; border-radius: 8px; border: 1px solid var(--primary-light); box-shadow: var(--shadow-sm); margin-bottom: 2rem; display: none; }
        .admin-form-box.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        .input-group { margin-bottom: 1rem; }
        .input-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 5px; color: var(--text-dark); }
        .input-group input { width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 0.95rem; outline: none; box-sizing: border-box; }
        .input-group input:focus { border-color: var(--primary); }
        
        /* Tùy chỉnh khung soạn thảo Quill */
        #editor-container { height: 250px; background: #fff; font-family: inherit; font-size: 0.95rem; border-bottom-left-radius: 6px; border-bottom-right-radius: 6px; }
        .ql-toolbar { border-top-left-radius: 6px; border-top-right-radius: 6px; background: #f8fafc; }
        .ql-editor { text-align: justify; } 
        .ql-editor p { text-align: justify; margin-bottom: 10px; }
        .ql-editor img { max-width: 100%; border-radius: 8px; margin: 10px 0; }

        /* Danh sách thông báo */
        .news-list { display: flex; flex-direction: column; gap: 1rem; }
        .news-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.2rem; display: flex; flex-direction: column; gap: 6px; transition: var(--transition); cursor: pointer; text-decoration: none; color: inherit; position: relative; }
        .news-item:hover { box-shadow: var(--shadow-hover); border-color: var(--primary-light); transform: translateY(-2px); }
        
        /* Chỉnh sửa cho bài được Ghim */
        .news-item.pinned { border-left: 4px solid #f97316; background: #fffedd; }
        .pinned-badge { display: inline-block; background: #f97316; color: white; padding: 3px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: bold; margin-bottom: 2px; align-self: flex-start; }
        
        .news-title { font-size: 1.15rem; font-weight: 700; color: var(--text-dark); margin: 0; line-height: 1.4; text-align: justify;}
        .news-meta { font-size: 0.8rem; color: var(--text-body); display: flex; gap: 15px; align-items: center; margin-top: 2px; }
        .news-excerpt { font-size: 0.9rem; color: var(--text-body); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-align: justify; }

        /* Phân trang */
        .pagination-controls { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 2rem; }
        .page-btn { padding: 6px 12px; border: 1px solid var(--border); background: white; cursor: pointer; border-radius: 6px; font-weight: 600; color: var(--text-dark); transition: 0.2s; min-width: 36px; text-align: center; }
        .page-btn:hover:not(:disabled) { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
        .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; background: #f1f5f9; }

        .empty-state { text-align: center; padding: 3rem; color: var(--text-body); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) { .header-section { flex-direction: column; align-items: stretch; text-align: center; } .btn-add { justify-content: center; } }
    </style>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">
    
    <!-- 1. HEADER CHUNG -->
    <div id="header-placeholder"></div>

    <main style="flex: 1; padding-top: 2rem;">
        <div class="header-section">
            <h2>Thông báo Bộ môn</h2>
            <button id="btnToggleForm" class="btn-add" style="display: none;">
                <i class="fas fa-plus"></i> Đăng thông báo mới
            </button>
        </div>

        <!-- KHUNG ĐĂNG BÀI / SỬA BÀI -->
        <div id="adminFormBox" class="admin-form-box">
            <h3 id="formTitle" style="margin-top:0; color:var(--primary); font-size: 1.2rem;">Tạo thông báo mới</h3>
            <form id="formPostNews" onsubmit="return false;">
                <input type="hidden" id="editNewsId">
                <div class="input-group">
                    <label>Tiêu đề thông báo *</label>
                    <input type="text" id="newsTitle" placeholder="Nhập tiêu đề..." required>
                </div>
                <div class="input-group">
                    <label>Nội dung chi tiết *</label>
                    <!-- Khung cho Quill Editor -->
                    <div id="editor-container"></div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button type="submit" id="btnSubmitNews" class="btn-add" style="flex: 1;">
                        Đăng tải bài viết
                    </button>
                    <button type="button" id="btnCancelEdit" class="btn-danger" style="display: none; padding: 0.6rem 1rem; border-radius: 6px; border:none; cursor:pointer; font-weight:bold;">
                        Hủy thao tác
                    </button>
                </div>
            </form>
        </div>

        <!-- THANH TÌM KIẾM -->
        <div class="search-box">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchNews" placeholder="Tìm kiếm tiêu đề, nội dung thông báo..." autocomplete="off">
        </div>

        <!-- DANH SÁCH THÔNG BÁO -->
        <div id="newsList" class="news-list">
            <!-- Bài viết được GHIM cứng -->
            <a href="thoi-khoa-bieu.html" id="pinnedNotice" class="news-item pinned">
                <span class="pinned-badge"><i class="fas fa-thumbtack"></i> Đã ghim</span>
                <h3 class="news-title">Thời khóa biểu</h3>
                <div class="news-excerpt">Vui lòng click vào đây để xem chi tiết thời khóa biểu giảng dạy cập nhật mới nhất.</div>
                <div class="news-meta">
                    <span><i class="fas fa-calendar-alt"></i> Hệ thống</span>
                    <span class="author-info"><i class="fas fa-pencil-alt"></i> Đăng bởi: Bộ môn PHCN</span>
                </div>
            </a>

            <!-- Nơi render dữ liệu từ Firebase -->
            <div id="dynamicNewsContainer" style="display: flex; flex-direction: column; gap: 1rem;">
                <div class="empty-state"><i class="fas fa-spinner fa-spin" style="font-size: 2rem;"></i><p>Đang tải thông báo...</p></div>
            </div>
            
            <!-- Điều khiển phân trang -->
            <div id="paginationControls" class="pagination-controls"></div>
        </div>
    </main>

    <!-- MODAL XÓA BÀI -->
    <div id="deleteConfirmModal" class="modal-overlay hidden">
        <div class="modal-content" style="max-width: 450px;">
            <button class="modal-close" onclick="closeDeleteModal()"><i class="fas fa-times"></i></button>
            <h3 style="color: var(--accent); margin-bottom: 15px;"><i class="fas fa-exclamation-triangle"></i> Xác nhận xóa</h3>
            <p style="font-size: 0.9rem; color: var(--text-body);">Thông báo:</p>
            <p id="deleteNewsTitlePreview" style="font-weight: 700; color: var(--text-dark); margin-bottom: 20px; line-height: 1.4; text-align: justify;"></p>
            <p style="font-size: 0.85rem;">Mã xác nhận:</p>
            <div id="randomDeleteCodeDisplay" style="background: var(--bg-page); padding: 10px; border-radius: 6px; font-size: 1.5rem; font-weight: bold; color: var(--accent); letter-spacing: 5px; margin-bottom: 15px; text-align: center;">0000</div>
            <input type="text" id="inputDeleteCodeConfirm" placeholder="Nhập mã xác nhận..." style="text-align: center; letter-spacing: 2px; width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; margin-bottom: 15px;">
            <button id="btnExecuteFinalDelete" class="btn-danger" disabled style="width: 100%; padding: 10px; font-size: 1rem; border:none; border-radius:6px; cursor:pointer;">Xóa vĩnh viễn</button>
        </div>
    </div>

    <!-- 3. FOOTER CHUNG -->
    <div id="footer-placeholder"></div>

    <!-- 4. GỌI LAYOUT CHUNG -->
    <script src="js/layout.js"></script>

    <!-- Tích hợp Script thư viện Quill.js -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

    <!-- FIREBASE MODULAR (V9) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDVT4akTw65Uj6KHymwWtQ9xyHVyfTlXIY",
            authDomain: "bmphcn-aa9c6.firebaseapp.com",
            projectId: "bmphcn-aa9c6",
            storageBucket: "bmphcn-aa9c6.firebasestorage.app",
            messagingSenderId: "749494392719",
            appId: "1:749494392719:web:f220c751ff541620045dfa",
            measurementId: "G-LBLG62PTDK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Khởi tạo Trình soạn thảo văn bản phong phú (Quill)
        var quill = new Quill('#editor-container', {
            theme: 'snow',
            placeholder: 'Nhập nội dung thông báo... (Hỗ trợ chèn link, hình ảnh)',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'align': [] }], 
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['link', 'image'],
                    [{ 'color': [] }, { 'background': [] }],
                    ['clean']
                ]
            }
        });

        const btnToggleForm = document.getElementById('btnToggleForm');
        const adminFormBox = document.getElementById('adminFormBox');
        let currentAuthor = "Giảng viên";
        let isAdmin = false;
        
        let allAnnouncements = [];
        let filteredAnnouncements = [];
        let currentPage = 1;
        const ITEMS_PER_PAGE = 10;
        let newsDataCache = {};

        // Xác thực người dùng
        onAuthStateChanged(auth, async (user) => {
            setTimeout(async () => {
                const btnAuthNav = document.getElementById('btnAuthNav');
                if (user) {
                    if (user.email.toLowerCase() === 'ths.phcn26@ump.edu.vn') {
                        isAdmin = false;
                        document.body.classList.remove('is-logged-in'); 
                        btnToggleForm.style.display = 'none';
                        if(btnAuthNav) btnAuthNav.innerHTML = `<i class="fas fa-user-circle" style="margin-right: 5px;"></i> Lớp Thạc sĩ 2026`;
                        return;
                    }

                    isAdmin = true;
                    document.body.classList.add('is-logged-in'); 
                    btnToggleForm.style.display = 'flex'; 
                    try {
                        const userDoc = await getDoc(doc(db, "users", user.uid));
                        if (userDoc.exists()) {
                            const data = userDoc.data();
                            currentAuthor = data.fullName || "Giảng viên";
                            let degreePrefix = data.degree === 'ThS' ? 'ThS. ' : (data.degree === 'TS' ? 'TS. ' : '');
                            if(btnAuthNav) btnAuthNav.innerHTML = `<i class="fas fa-user-circle" style="margin-right: 5px;"></i> ${degreePrefix}${currentAuthor}`;
                        } else {
                            if(btnAuthNav) btnAuthNav.innerHTML = `<i class="fas fa-user-circle" style="margin-right: 5px;"></i> Giảng viên`;
                        }
                    } catch (error) {
                        console.error("Lỗi lấy thông tin người dùng: ", error);
                    }
                } else {
                    isAdmin = false;
                    document.body.classList.remove('is-logged-in');
                    btnToggleForm.style.display = 'none';
                    if(btnAuthNav) {
                        btnAuthNav.innerHTML = 'Đăng nhập';
                        btnAuthNav.href = "login.html";
                    }
                }
                // Re-render to show/hide action buttons based on admin status
                if (allAnnouncements.length > 0) applySearchAndRender();
            }, 100);
        });

        // Bật/tắt Form
        btnToggleForm.addEventListener('click', () => {
            if(!adminFormBox.classList.contains('active')){
                resetForm();
                adminFormBox.classList.add('active');
                btnToggleForm.innerHTML = '<i class="fas fa-times"></i> Đóng khung soạn thảo';
                btnToggleForm.style.backgroundColor = 'var(--text-body)';
            } else {
                adminFormBox.classList.remove('active');
                btnToggleForm.innerHTML = '<i class="fas fa-plus"></i> Đăng thông báo mới';
                btnToggleForm.style.backgroundColor = 'var(--primary)';
            }
        });

        // Đăng bài viết / Cập nhật
        document.getElementById('formPostNews').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnSubmit = document.getElementById('btnSubmitNews');
            
            const title = document.getElementById('newsTitle').value.trim();
            const contentHTML = quill.root.innerHTML;
            
            if (contentHTML === '<p><br></p>') {
                alert("Vui lòng nhập nội dung chi tiết!");
                return;
            }

            btnSubmit.disabled = true; 
            btnSubmit.innerHTML = "Đang xử lý...";
            const editId = document.getElementById('editNewsId').value;

            try {
                if (editId) {
                    await updateDoc(doc(db, "announcements", editId), {
                        title: title, 
                        content: contentHTML
                    });
                    alert("Cập nhật thông báo thành công!");
                } else {
                    await addDoc(collection(db, "announcements"), {
                        title: title, 
                        content: contentHTML, 
                        author: currentAuthor,
                        createdAt: serverTimestamp()
                    });
                    alert("Đăng thông báo thành công!");
                }
                resetForm();
                adminFormBox.classList.remove('active');
                btnToggleForm.innerHTML = '<i class="fas fa-plus"></i> Đăng thông báo mới';
                btnToggleForm.style.backgroundColor = 'var(--primary)';
            } catch (err) {
                alert("Lỗi: " + err.message);
            } finally {
                btnSubmit.disabled = false; 
                btnSubmit.innerHTML = "Đăng tải bài viết";
            }
        });

        function resetForm() {
            document.getElementById('formPostNews').reset();
            quill.root.innerHTML = ''; 
            document.getElementById('editNewsId').value = '';
            document.getElementById('formTitle').innerText = "Tạo thông báo mới";
            document.getElementById('btnSubmitNews').innerText = "Đăng tải bài viết";
            document.getElementById('btnCancelEdit').style.display = "none";
        }
        
        document.getElementById('btnCancelEdit').addEventListener('click', () => {
            resetForm();
            adminFormBox.classList.remove('active');
            btnToggleForm.innerHTML = '<i class="fas fa-plus"></i> Đăng thông báo mới';
            btnToggleForm.style.backgroundColor = 'var(--primary)';
        });

        // ==========================================
        // CÁC HÀM XỬ LÝ GIAO DIỆN & TÌM KIẾM, PHÂN TRANG
        // ==========================================
        
        window.triggerEdit = (id) => {
            const data = newsDataCache[id];
            if(!data) return;

            document.getElementById('editNewsId').value = id;
            document.getElementById('newsTitle').value = data.title;
            quill.root.innerHTML = data.content; 
            
            document.getElementById('formTitle').innerText = "Sửa thông báo";
            document.getElementById('btnSubmitNews').innerHTML = '<i class="fas fa-save"></i> Cập nhật thay đổi';
            document.getElementById('btnCancelEdit').style.display = "block";
            
            if (!adminFormBox.classList.contains('active')) {
                adminFormBox.classList.add('active');
                btnToggleForm.innerHTML = '<i class="fas fa-times"></i> Đóng khung soạn thảo';
                btnToggleForm.style.backgroundColor = 'var(--text-body)';
            }
            adminFormBox.scrollIntoView({behavior: 'smooth', block: 'start'});
        };

        let targetDeleteId = null;
        let generatedSecurityCode = "";

        window.triggerDeleteConfirm = (id) => {
            const data = newsDataCache[id];
            if(!data) return;

            targetDeleteId = id;
            generatedSecurityCode = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('deleteNewsTitlePreview').innerText = data.title;
            document.getElementById('randomDeleteCodeDisplay').innerText = generatedSecurityCode;
            document.getElementById('inputDeleteCodeConfirm').value = '';
            document.getElementById('btnExecuteFinalDelete').disabled = true;
            document.getElementById('deleteConfirmModal').classList.remove('hidden');
        };

        window.closeDeleteModal = () => {
            document.getElementById('deleteConfirmModal').classList.add('hidden');
        };

        document.getElementById('inputDeleteCodeConfirm').addEventListener('input', (e) => {
            document.getElementById('btnExecuteFinalDelete').disabled = (e.target.value.trim() !== generatedSecurityCode);
        });

        document.getElementById('btnExecuteFinalDelete').addEventListener('click', async () => {
            if(!targetDeleteId) return;
            try {
                await deleteDoc(doc(db, "announcements", targetDeleteId));
                closeDeleteModal();
            } catch(e) {
                alert("Lỗi xóa: " + e.message);
            }
        });

        // Tìm kiếm & Render phân trang
        function applySearchAndRender() {
            const keyword = document.getElementById('searchNews').value.toLowerCase().trim();
            if (!keyword) {
                filteredAnnouncements = [...allAnnouncements];
            } else {
                filteredAnnouncements = allAnnouncements.filter(item => {
                    const title = (item.title || '').toLowerCase();
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = item.content || '';
                    const plainText = tempDiv.textContent.toLowerCase();
                    return title.includes(keyword) || plainText.includes(keyword);
                });
            }
            currentPage = 1;
            renderPage(currentPage);
        }

        document.getElementById('searchNews').addEventListener('input', applySearchAndRender);

        function renderPage(page) {
            const container = document.getElementById('dynamicNewsContainer');
            container.innerHTML = '';
            
            const pinnedNotice = document.getElementById('pinnedNotice');
            const keyword = document.getElementById('searchNews').value.trim();
            
            // Ẩn/hiện bài ghim
            if (page === 1 && !keyword) {
                pinnedNotice.style.display = 'flex';
            } else {
                pinnedNotice.style.display = 'none';
            }

            if (filteredAnnouncements.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-search" style="font-size: 2.5rem; margin-bottom:15px; color:#cbd5e1;"></i><p>Không tìm thấy thông báo nào phù hợp.</p></div>';
                renderPagination(0);
                return;
            }

            const startIndex = (page - 1) * ITEMS_PER_PAGE;
            const endIndex = startIndex + ITEMS_PER_PAGE;
            const pageItems = filteredAnnouncements.slice(startIndex, endIndex);

            pageItems.forEach(data => {
                const id = data.id;
                
                let dateStr = "Vừa xong";
                if (data.createdAt) {
                    const dateObj = data.createdAt.toDate();
                    dateStr = dateObj.toLocaleDateString('vi-VN', {day:'2-digit', month:'2-digit', year:'numeric'}) + ' - ' + dateObj.toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'});
                }
                
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = data.content || '';
                let plainText = tempDiv.textContent || tempDiv.innerText || '';
                let excerpt = plainText.substring(0, 150);
                if (plainText.length > 150) excerpt += "...";

                let actionHtml = '';
                if (isAdmin) {
                    actionHtml = `
                        <div class="action-buttons" onclick="event.preventDefault();" style="margin-top: 8px;">
                            <button onclick="event.preventDefault(); triggerEdit('${id}')" style="padding: 4px 10px; font-size: 0.8rem; border: none; border-radius: 4px; background: #f59e0b; color: white; cursor: pointer; margin-right: 5px; font-weight: bold;"><i class="fas fa-edit"></i> Sửa</button>
                            <button onclick="event.preventDefault(); triggerDeleteConfirm('${id}')" style="padding: 4px 10px; font-size: 0.8rem; border: none; border-radius: 4px; background: #ef4444; color: white; cursor: pointer; font-weight: bold;"><i class="fas fa-trash"></i> Xóa</button>
                        </div>
                    `;
                }

                const a = document.createElement('a');
                a.href = `xem-thong-bao.html?id=${id}`;
                a.className = 'news-item';
                a.innerHTML = `
                    <h3 class="news-title">${data.title}</h3>
                    <div class="news-excerpt">${excerpt}</div>
                    <div class="news-meta">
                        <span><i class="fas fa-calendar-alt"></i> ${dateStr}</span>
                        <span class="author-info"><i class="fas fa-pencil-alt"></i> Đăng bởi: ${data.author || 'Hệ thống'}</span>
                    </div>
                    ${actionHtml}
                `;
                container.appendChild(a);
            });

            renderPagination(filteredAnnouncements.length);
        }

        function renderPagination(totalItems) {
            const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);
            const paginationContainer = document.getElementById('paginationControls');
            paginationContainer.innerHTML = '';

            if (totalPages <= 1) return;

            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, currentPage + 2);

            const prevBtn = document.createElement('button');
            prevBtn.className = 'page-btn';
            prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i>';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => { if (currentPage > 1) { currentPage--; renderPage(currentPage); window.scrollTo({top: 0, behavior: 'smooth'}); } };
            paginationContainer.appendChild(prevBtn);

            if (startPage > 1) {
                const btnFirst = document.createElement('button');
                btnFirst.className = 'page-btn';
                btnFirst.innerText = '1';
                btnFirst.onclick = () => { currentPage = 1; renderPage(currentPage); window.scrollTo({top: 0, behavior: 'smooth'}); };
                paginationContainer.appendChild(btnFirst);
                if (startPage > 2) {
                    const dots = document.createElement('span');
                    dots.innerHTML = '...';
                    dots.style.margin = '0 5px';
                    dots.style.color = '#94a3b8';
                    paginationContainer.appendChild(dots);
                }
            }

            for (let i = startPage; i <= endPage; i++) {
                const btn = document.createElement('button');
                btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
                btn.innerText = i;
                btn.onclick = () => { currentPage = i; renderPage(currentPage); window.scrollTo({top: 0, behavior: 'smooth'}); };
                paginationContainer.appendChild(btn);
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    const dots = document.createElement('span');
                    dots.innerHTML = '...';
                    dots.style.margin = '0 5px';
                    dots.style.color = '#94a3b8';
                    paginationContainer.appendChild(dots);
                }
                const btnLast = document.createElement('button');
                btnLast.className = 'page-btn';
                btnLast.innerText = totalPages;
                btnLast.onclick = () => { currentPage = totalPages; renderPage(currentPage); window.scrollTo({top: 0, behavior: 'smooth'}); };
                paginationContainer.appendChild(btnLast);
            }

            const nextBtn = document.createElement('button');
            nextBtn.className = 'page-btn';
            nextBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => { if (currentPage < totalPages) { currentPage++; renderPage(currentPage); window.scrollTo({top: 0, behavior: 'smooth'}); } };
            paginationContainer.appendChild(nextBtn);
        }

        // Tải danh sách lần đầu
        const q = query(collection(db, "announcements"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            allAnnouncements = [];
            newsDataCache = {};
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                data.id = docSnap.id;
                allAnnouncements.push(data);
                newsDataCache[data.id] = data; 
            });
            applySearchAndRender();
        });

    </script>
</body>
</html>
