<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lịch công tác - Bộ môn Phục hồi chức năng.">
    <title>Lịch Công Tác - Bộ môn Phục hồi chức năng</title>
    
    <link rel="icon" href="images/logo_Bộ môn.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- FullCalendar CSS & JS -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/vi.js'></script>

    <style>
        /* APP LAYOUT */
        html, body { min-height: 100vh; margin: 0; padding: 0; display: flex; flex-direction: column; background: var(--bg-page); }
        #header-placeholder { flex-shrink: 0; }
        #footer-placeholder { display: none; }

        /* Thanh công cụ gọn nhẹ trên cùng */
        .top-toolbar { position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; padding: 10px 2%; background: var(--surface); border-bottom: 1px solid var(--border); margin-bottom: 15px; box-shadow: var(--shadow-sm); }
        .top-toolbar h2 { margin: 0; font-size: 1.4rem; color: var(--text-dark); display: flex; align-items: center; gap: 8px; font-weight: 800; text-transform: uppercase; }
        
        .controls-wrapper { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .filter-select { padding: 6px 12px; font-size: 0.95rem; font-weight: 600; border-radius: 6px; border: 1px solid var(--border); outline: none; cursor: pointer; color: var(--text-dark); }
        .btn-toggle { background: white; color: var(--primary); border: 1px solid var(--primary); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; font-size: 0.9rem;}
        .btn-toggle:hover { background: var(--primary-light); }

        /* Khu vực Lịch & Kho */
        main { flex: 1; max-width: 100%; width: 100%; padding: 0 1% 30px 1%; display: flex; gap: 15px; box-sizing: border-box; align-items: flex-start; }

        /* Khung bên trái (Kho Sự Kiện) */
        #external-events { position: sticky; top: 80px; width: 280px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 15px; box-shadow: var(--shadow-sm); flex-shrink: 0; display: none; flex-direction: column; max-height: calc(100vh - 100px); transition: 0.3s; }
        #external-events h4 { margin: 0 0 10px 0; color: var(--primary); border-bottom: 1px dashed var(--border); padding-bottom: 10px; font-size: 1.05rem; flex-shrink: 0; }
        
        #event-pool { flex: 1; overflow-y: auto; padding-right: 5px; } 
        #event-pool .fc-event { cursor: move; margin: 0 0 12px 0; padding: 12px; color: var(--text-dark); border: 1px solid var(--border); border-radius: 6px; text-align: left; transition: 0.2s; position: relative; }
        
        /* Màu nền phân biệt Lớp trong Kho */
        #event-pool .fc-event.THS2025 { background-color: #f0f9ff; border-color: #bae6fd; }
        #event-pool .fc-event.THS2026 { background-color: #fefce8; border-color: #fde047; }
        #event-pool .fc-event:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.05); filter: brightness(0.95); }
        
        /* Nhãn phân loại trong Kho */
        .class-tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin-bottom: 5px; }
        .class-tag.THS2025 { background: #bae6fd; color: #0369a1; }
        .class-tag.THS2026 { background: #fde047; color: #b45309; }

        #event-pool .event-gv { font-weight: 700; font-size: 1rem; margin-bottom: 4px; color: var(--primary); }
        #event-pool .event-info { display: block; font-size: 0.85rem; color: var(--text-body); line-height: 1.4; }
        
        /* Cảnh báo sự kiện bị GV từ chối trả về */
        #event-pool .fc-event.rejected-task { border-left: 4px solid #ef4444 !important; border-color: #ef4444 !important; background-color: #fef2f2 !important; }
        #event-pool .fc-event.rejected-task .event-gv { color: #b91c1c; }
        #event-pool .fc-event.rejected-task .reject-badge { display: block; font-size: 0.75rem; color: #ef4444; font-weight: bold; margin-top: 5px; animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Khung Lịch */
        #calendar-container { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 15px; box-shadow: var(--shadow-sm); min-width: 0; transition: 0.3s; }
        
        .fc-toolbar-title { font-size: 1.3rem !important; color: var(--primary); font-weight: bold; text-transform: capitalize; }
        .fc-button-primary { background-color: var(--primary) !important; border-color: var(--primary) !important; text-transform: capitalize; font-weight: 600 !important; padding: 6px 15px !important; font-size: 0.95rem !important;}
        .fc-button-primary:hover { background-color: var(--primary-hover) !important; }
        .fc-button-active { background-color: var(--primary-hover) !important; }

        /* Style cho Sự kiện TRÊN LỊCH */
        .fc-event-main { display: flex; flex-direction: column; height: 100%; padding: 4px 6px; box-sizing: border-box; }
        .event-on-calendar { overflow: hidden; color: white; display: flex; flex-direction: column; gap: 3px; height: 100%; }
        .event-on-calendar .evt-time { font-size: 0.85rem; font-weight: 600; background: rgba(0,0,0,0.25); padding: 2px 6px; border-radius: 4px; width: fit-content; margin-bottom: 2px; }
        
        /* --- ĐÃ SỬA CHỮA LỖI HIỂN THỊ NHÂN ĐÔI CSS TẠI ĐÂY --- */
        .event-on-calendar .evt-gv { font-size: 1rem; font-weight: 700; line-height: 1.2; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); white-space: normal; }
        .event-on-calendar .evt-gv-desktop { display: flex; justify-content: space-between; align-items: flex-start; }
        .event-on-calendar .evt-gv-mobile { display: none; }
        
        .event-on-calendar .evt-room { font-size: 0.8rem; background: #fbbf24; color: #78350f; padding: 2px 5px; border-radius: 4px; font-weight: 800; text-shadow: none; white-space: nowrap; }
        .event-on-calendar .evt-sub { font-size: 0.8rem; font-weight: 400; opacity: 0.95; line-height: 1.3; white-space: normal; }

        /* Chấm Bệnh viện trên cùng (All-day) */
        .evt-clinical-dot { background-color: #10b981; color: white; border-radius: 4px; padding: 2px 0; text-align: center; font-weight: 700; font-size: 0.85rem; cursor: pointer; display: block; box-shadow: 0 2px 5px rgba(16, 185, 129, 0.4); transition: 0.2s; }
        .evt-clinical-dot:hover { background-color: #059669; transform: scale(1.02); }

        .hidden { display: none !important; }

        /* Tooltip Rà chuột */
        #eventTooltip { position: fixed; z-index: 9999; background: rgba(15, 23, 42, 0.95); color: white; padding: 12px 15px; border-radius: 8px; font-size: 0.9rem; pointer-events: none; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.3); line-height: 1.6; max-width: 350px; border-left: 4px solid var(--primary); }
        #eventTooltip strong { color: #38bdf8; font-size: 1rem; }
        #eventTooltip .tooltip-scheduler { color: #fef08a; font-weight: bold; display: block; margin-top: 5px; border-top: 1px dashed rgba(255,255,255,0.2); padding-top: 5px; }

        /* Toast */
        .toast-container { position: fixed; top: 80px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { min-width: 250px; background-color: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 12px; transform: translateX(120%); transition: 0.4s; font-weight: 600; border-left: 5px solid #22c55e; opacity: 0; }
        .toast.show { transform: translateX(0); opacity: 1; }
        .toast.danger { border-left-color: #ef4444; }

        /* Modal Chi tiết chung */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 2000; padding: 10px; }
        .modal-content { background: white; width: 95%; max-width: 600px; border-radius: 8px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); overflow: hidden; display: flex; flex-direction: column; }
        .modal-header { padding: 15px 20px; background: var(--primary); color: white; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { margin: 0; font-size: 1.1rem; }
        .modal-body { padding: 20px; line-height: 1.8; text-align: justify; overflow-y: auto; }
        .modal-footer { padding: 15px 20px; background: #f1f5f9; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--border); }
        
        .btn-danger { background: var(--accent); color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s;}
        .btn-danger:hover { background: #be123c; }
        .btn-primary { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s;}
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: white; color: var(--text-dark); border: 1px solid var(--border); padding: 8px 15px; border-radius: 4px; cursor: pointer; transition: 0.2s; font-weight: 600; }
        .btn-secondary:hover { background: #e2e8f0; }

        /* Chọn Phòng Form */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; color: var(--text-dark); }
        .form-group select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); font-size: 1rem; outline: none; }
        .form-group select:focus { border-color: var(--primary); }

        /* Modal Bệnh viện */
        #clinicalModal .modal-content { max-width: 750px; max-height: 85vh; }
        .clin-card { margin-bottom: 15px; padding: 15px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; border-left: 4px solid #10b981; }
        .clin-card-title { font-weight: 700; color: var(--text-dark); font-size: 1.15rem; margin-bottom: 10px; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; }

        /* Responsive Điện thoại - Thu gọn Giao diện Lịch */
        @media (max-width: 900px) {
            main { flex-direction: column; }
            #external-events { position: relative; width: 100%; top: 0; max-height: 350px; }
            .top-toolbar { flex-direction: column; gap: 10px; align-items: stretch; }
            
            .fc-toolbar-title { font-size: 1.1rem !important; }
            .fc-button-primary { padding: 4px 10px !important; font-size: 0.8rem !important; }
            
            /* ẨN TOÀN BỘ CỘT THỜI GIAN ĐỂ GIẢI PHÓNG DIỆN TÍCH CHO ĐIỆN THOẠI */
            .fc .fc-timegrid-axis, .fc .fc-timegrid-slot-label { width: 0 !important; padding: 0 !important; border: none !important; }
            .fc .fc-timegrid-slot-label-cushion, .fc .fc-timegrid-axis-cushion { display: none !important; }

            /* Rút gọn thẻ lịch */
            .fc-event-main { padding: 4px !important; }
            .event-on-calendar .evt-gv-desktop { display: none !important; }
            .event-on-calendar .evt-gv-mobile { display: flex !important; justify-content: space-between; align-items: flex-start; font-size: 0.85rem; }
            .event-on-calendar .evt-sub { display: none; }
            .event-on-calendar .evt-time { display: none; } /* Ẩn cả giờ trong thẻ bài trên điện thoại */
        }
    </style>
</head>
<body>

    <!-- MODAL CHỌN PHÒNG HỌC -->

            <div class="modal-body">

                <p><strong>Phòng học:</strong> <span id="mdlRoom" style="background: #fbbf24; color: #78350f; padding: 2px 6px; border-radius: 4px; font-weight: bold;"></span></p>

            <div class="modal-footer">
                <button class="btn-secondary" onclick="document.getElementById('clinicalModal').classList.add('hidden')">Đóng</button>

        </div>

        function parseDate(dateStr) {
            if (!dateStr) return null;
            if (dateStr.includes('/')) {
                const parts = dateStr.split('/');
                return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
            }
            return dateStr;
        }

        function parseDays(daysStr) {
            if (!daysStr) return [1,2,3,4,5];
            let str = daysStr.toLowerCase();
            if (str.includes('t2 - t6') || str.includes('thứ 2 đến thứ 6') || str.includes('cả tuần')) return [1,2,3,4,5];
            let days = [];
            if (str.includes('t2') || str.includes('thứ 2')) days.push(1);
            if (str.includes('t3') || str.includes('thứ 3')) days.push(2);
            if (str.includes('t4') || str.includes('thứ 4')) days.push(3);
            if (str.includes('t5') || str.includes('thứ 5')) days.push(4);
            if (str.includes('t6') || str.includes('thứ 6')) days.push(5);
            if (str.includes('t7') || str.includes('thứ 7')) days.push(6);
            if (str.includes('cn') || str.includes('chủ nhật')) days.push(0);
            return days.length > 0 ? days : [1,2,3,4,5];
        }

        function getClinicalEventsMap(schedules) {
            let map = {};
            schedules.forEach(c => {
                let startStr = parseDate(c.start_date);
                let endStr = parseDate(c.end_date);
                if (!startStr) return;
                
                let start = new Date(startStr);
                let end = endStr ? new Date(endStr) : new Date(startStr);
                let days = parseDays(c.days); 

                let maxDays = 365; 
                for (let d = new Date(start); d <= end && maxDays > 0; d.setDate(d.getDate() + 1), maxDays--) {
                    if (days.includes(d.getDay())) {
                        let y = d.getFullYear();
                        let m = String(d.getMonth() + 1).padStart(2, '0');
                        let day = String(d.getDate()).padStart(2, '0');
                        let dateStr = `${y}-${m}-${day}`;
                        
                        if (!map[dateStr]) map[dateStr] = [];
                        map[dateStr].push(c);
                    }
                }
            });
            return map;
        }

        function validateClinicalSchedule(eventObj, gvStr, subject) {
            if (!subject.toLowerCase().includes('thực hành lâm sàng')) return true; 
            
            const droppedDate = eventObj.start;
            const y = droppedDate.getFullYear();
            const m = String(droppedDate.getMonth() + 1).padStart(2, '0');
            const d = String(droppedDate.getDate()).padStart(2, '0');
            const dateStr = `${y}-${m}-${d}`;

            const dailyClinicals = globalGroupedClinicals[dateStr] || [];
            let targetGVs = gvStr ? gvStr.split(/,|&/).map(s => s.trim()).filter(s => s) : [];
            
            let valid = true;
            for (let gv of targetGVs) {
                const teacherClinicals = dailyClinicals.filter(c => c.instructors && c.instructors.includes(gv));

                if (teacherClinicals.length === 0) {
                    showToast(`Lỗi: Giảng viên ${gv} không có lịch trực Bệnh viện vào ngày này!`, "danger");
                    valid = false; break;
                }

                const startHour = droppedDate.getHours();
                const isMorningDrop = startHour < 12; 
                
                const hasMorningShift = teacherClinicals.some(c => c.shift.toLowerCase().includes('sáng') || c.shift.toLowerCase().includes('cả ngày'));
                const hasAfternoonShift = teacherClinicals.some(c => c.shift.toLowerCase().includes('chiều') || c.shift.toLowerCase().includes('cả ngày'));

                if (isMorningDrop && !hasMorningShift) {
                    showToast(`Lỗi: Lịch Bệnh viện của GV ${gv} ngày này chỉ có ca Chiều!`, "danger");
                    valid = false; break;
                }
                if (!isMorningDrop && !hasAfternoonShift) {
                    showToast(`Lỗi: Lịch Bệnh viện của GV ${gv} ngày này chỉ có ca Sáng!`, "danger");
                    valid = false; break;
                }
            }
            return valid;
        }

        // HÀM KIỂM TRA TRÙNG LỊCH & TRÙNG PHÒNG THÔNG MINH
        function hasOverlap(targetStart, targetEnd, gvStr, targetClass, targetTask, targetRoom, ignoreEventId) {
            let tStart = targetStart.getTime();
            let tEnd = targetEnd ? targetEnd.getTime() : tStart + 4 * 3600000;
            
            let allEvents = calendar.getEvents();
            
            const blockingTasks = ['Lý thuyết', 'Thực hành', 'Thực tế', 'Coi thi'];

            for (let e of allEvents) {
                if (e.id === ignoreEventId) continue; 
                
                const props = e.extendedProps;
                if (props.type === 'clinical_summary') continue; 
                
                let eStart = e.start.getTime();
                let eEnd = e.end ? e.end.getTime() : eStart + 4 * 3600000;
                
                // NẾU TRÙNG GIỜ (Thời gian giao nhau)
                if (tStart < eEnd && tEnd > eStart) {
                    
                    // 1. Kiểm tra TRÙNG PHÒNG: Khác lớp nhưng xài chung phòng => Cấm
                    if (targetRoom && props.room && targetRoom !== 'Khác...' && props.room === targetRoom) {
                        return { hasOverlap: true, reason: `Phòng ${targetRoom} đã có lớp khác học vào khung giờ này!` };
                    }

                    // 2. Kiểm tra Trùng lịch Khóa học: 1 lớp không thể học 2 môn
                    if (props.class === targetClass && blockingTasks.includes(targetTask) && blockingTasks.includes(props.task)) {
                        return { hasOverlap: true, reason: `Lớp ${targetClass} đã có lịch học/thi vào khung giờ này!` };
                    }
                    
                    // 3. Kiểm tra Trùng lịch Giảng viên: GV không thể dạy 2 nơi
                    let targetGVs = gvStr ? gvStr.split(/,|&/).map(s => s.trim()).filter(s => s) : [];
                    let eGVs = props.gv ? props.gv.split(/,|&/).map(s => s.trim()).filter(s => s) : [];
                    let hasCommonGV = targetGVs.some(gv => eGVs.includes(gv));
                    
                    if (hasCommonGV && blockingTasks.includes(targetTask) && blockingTasks.includes(props.task)) {
                        return { hasOverlap: true, reason: `Giảng viên bị trùng lịch dạy/coi thi khác!` };
                    }
                }
            }
            return { hasOverlap: false };
        }

                    }
                },

                eventClick: function(info) {
                    const props = info.event.extendedProps;
                    
                    if (props.type === 'clinical_summary') {
                        let dateObj = new Date(props.dateStr);
                        let dateVN = dateObj.toLocaleDateString('vi-VN', {weekday: 'long', day:'2-digit', month:'2-digit', year:'numeric'});
                        
                        let hospitalGroups = {};
                        props.details.forEach(c => {
                            if(!hospitalGroups[c.hospital]) hospitalGroups[c.hospital] = [];
                            hospitalGroups[c.hospital].push(c);
                        });

                        let html = `<div style="color: var(--primary); font-weight:bold; font-size:1.1rem; margin-bottom:15px; border-bottom: 2px solid var(--border); padding-bottom:10px;">
                                        Ngày ${dateVN}
                                    </div>`;
                        
                        for (let hosp in hospitalGroups) {
                            html += `
                            <div class="clin-card">
                                <div class="clin-card-title">${hosp}</div>
                            `;
                            
                            hospitalGroups[hosp].forEach((c, index) => {
                                const borderStyle = index < hospitalGroups[hosp].length - 1 ? 'border-bottom: 1px dashed #cbd5e1; margin-bottom: 10px; padding-bottom: 10px;' : '';
                                html += `
                                <div style="font-size: 0.95rem; color: var(--text-dark); line-height: 1.6; ${borderStyle}">
                                    <b>Khóa/Lớp:</b> <span style="color: #b45309; font-weight: 600;">${c.class_id || 'N/A'}</span><br>
                                    <b>Chuyên ngành:</b> <span style="color: var(--primary); font-weight: 600;">${c.specialty}</span> (${c.number_students || '?'} SV)<br>
                                    <b>Ca trực:</b> ${c.shift}<br>
                                    <b>Giảng viên nhận việc:</b> <span>${c.instructors}</span>
                                </div>`;
                            });
                            
                            html += `</div>`;
                        }
                        
                        document.getElementById('clinicalModalBody').innerHTML = html;
                        document.getElementById('clinicalModal').classList.remove('hidden');
                        return;
                    }

                    currentClickedEventId = info.event.id;
                    let clsName = props.class === 'THS2025' ? 'ThS 25-27' : (props.class === 'THS2026' ? 'ThS 26-28' : props.class);
                    document.getElementById('mdlClass').innerText = clsName || 'N/A';
                    document.getElementById('mdlSubject').innerText = props.subject || '';
                    document.getElementById('mdlGv').innerText = props.gv || '';
                    document.getElementById('mdlTask').innerText = props.task || '';
                    document.getElementById('mdlRoom').innerText = props.room || 'Chưa có phòng';
                    document.getElementById('mdlScheduler').innerText = props.scheduledByName || 'Không xác định';
                    
                    let sTime = info.event.start ? info.event.start.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'}) : '';
                    let eTime = '';
                    if (info.event.end) {
                        eTime = info.event.end.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
                    } else if (info.event.start) {
                        let eObj = new Date(info.event.start.getTime() + 4 * 60 * 60 * 1000);
                        eTime = eObj.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
                    }
                    const dateStr = info.event.start ? info.event.start.toLocaleDateString('vi-VN', {weekday: 'long', day:'2-digit', month:'2-digit', year:'numeric'}) : '';
                    document.getElementById('mdlTime').innerText = `${sTime} - ${eTime} (${dateStr})`;

                    if (isCalendarAdmin && (!props.scheduledByEmail || props.scheduledByEmail === currentUserEmail || currentUserEmail === 'hoangtran1483@gmail.com')) {
                        document.getElementById('btnDeleteEvent').classList.remove('hidden');
                    } else {
                        document.getElementById('btnDeleteEvent').classList.add('hidden');
                    }
                    document.getElementById('eventModal').classList.remove('hidden');
                }
            });
            calendar.render();
        }

        // BƯỚC 2: XÁC NHẬN PHÒNG VÀ LƯU VÀO DATABASE
        window.confirmRoomSelection = async () => {
            if (!pendingDropInfo) return;

            const selectedRoom = document.getElementById('roomSelect').value;
            const info = pendingDropInfo;
            const props = info.event.extendedProps;

            document.getElementById('roomModal').classList.add('hidden');

            // KIỂM TRA TRÙNG LỊCH (KÈM PHÒNG)
            const overlapCheck = hasOverlap(info.event.start, info.event.end, props.gv, props.eventClass, props.task, selectedRoom, info.event.id);
            if (overlapCheck.hasOverlap) {
                showToast(overlapCheck.reason, "danger");
                info.revert();
                pendingDropInfo = null;
                return;
            }

            // Gán dữ liệu
            const newUniqueId = props.originalId + '_' + Date.now();
            info.event.setProp('id', newUniqueId); 
            info.event.setExtendedProp('room', selectedRoom); // Hiển thị tạm trên giao diện

            const eventData = {
                id: newUniqueId, 
                title: info.event.title,
                start: info.event.startStr,
                end: info.event.endStr || null,
                allDay: info.event.allDay,
                class: props.eventClass, 
                subject: props.subject,
                gv: props.gv,
                task: props.task,
                room: selectedRoom, // Lưu phòng vào DB
                scheduledByEmail: currentUserEmail,
                scheduledByName: currentUserName,
                status: 'scheduled'
            };
            
            try {
                await setDoc(doc(db, "calendar_events", eventData.id), eventData);
                showToast(`Đã xếp lịch thành công (${selectedRoom})!`);
                info.event.remove(); // Xóa bản nháp trên giao diện, chờ dữ liệu trả về từ Firestore
            } catch(e) {
                showToast("Lỗi khi lưu lịch: " + e.message, "danger");
                info.revert(); 
            }
            pendingDropInfo = null;
        };

        // BƯỚC 2 (PHỤ): HỦY XẾP LỊCH NẾU KHÔNG CHỌN PHÒNG
        window.cancelRoomSelection = () => {
            if (pendingDropInfo) {
                pendingDropInfo.revert();
                pendingDropInfo = null;
            }
            document.getElementById('roomModal').classList.add('hidden');
        };

        function listenToDatabase() {
            onSnapshot(collection(db, "assignments"), (snapshot) => {
                assignmentsData = {};
                snapshot.forEach(doc => { assignmentsData[doc.id] = doc.data(); });
                window.processAndRenderEvents();
            });

            onSnapshot(collection(db, "calendar_events"), (snapshot) => {
                scheduledEvents = [];
                snapshot.forEach(doc => { scheduledEvents.push(doc.data()); });
                window.processAndRenderEvents();
            });

            onSnapshot(collection(db, "clinical_schedules"), (snapshot) => {
                clinicalSchedules = [];
                snapshot.forEach(doc => { 
                    const data = doc.data();
                    data.id = doc.id;
                    clinicalSchedules.push(data); 
                });
                window.processAndRenderEvents();
            });
        }

        window.processAndRenderEvents = () => {
            if (!calendar) return;
            const selectedSemester = document.getElementById('semesterSelect').value;
            calendar.removeAllEvents();
            const poolDiv = document.getElementById('event-pool');
            poolDiv.innerHTML = '';
            let unscheduledCount = 0;

            let currentClassEvents = scheduledEvents.filter(e => e.status !== 'returned').map(e => {
                const isMyEvent = e.gv && currentUserName && e.gv.includes(currentUserName);
                
                let bgColor = e.class === 'THS2026' ? '#0d9488' : '#0284c7'; 
                let bdColor = e.class === 'THS2026' ? '#0f766e' : '#0369a1';
                
                if (isMyEvent) {
                    bgColor = '#ea580c';
                    bdColor = '#c2410c';
                }

                return {
                    id: e.id,
                    title: e.title,
                    start: e.start,
                    end: e.end,
                    allDay: e.allDay,
                    backgroundColor: bgColor, 
                    borderColor: bdColor,
                    textColor: 'white',
                    extendedProps: {
                        class: e.class,
                        subject: e.subject,
                        gv: e.gv,
                        task: e.task,
                        room: e.room, // Kéo thông tin phòng từ DB ra
                        scheduledByEmail: e.scheduledByEmail,
                        scheduledByName: e.scheduledByName,
                        type: 'normal',
                        originalId: e.originalId || e.id
                    }
                };
            });
            calendar.addEventSource(currentClassEvents);

            // GOM NHÓM & TẠO CHẤM BỆNH VIỆN
            globalGroupedClinicals = getClinicalEventsMap(clinicalSchedules); 
            let clinicalEvents = [];
            for (let dateStr in globalGroupedClinicals) {
                clinicalEvents.push({
                    id: 'clin_sum_' + dateStr,
                    title: 'BV',
                    start: dateStr, 
                    allDay: true,
                    backgroundColor: 'transparent',
                    borderColor: 'transparent',
                    editable: false, 
                    extendedProps: {
                        type: 'clinical_summary',
                        details: globalGroupedClinicals[dateStr],
                        dateStr: dateStr
                    }
                });
            }
            calendar.addEventSource(clinicalEvents);

            // ĐẾM SỐ BUỔI ĐÃ XẾP 
            let scheduledCounts = {};
            scheduledEvents.forEach(e => {
                if (e.status !== 'returned') {
                    const key = `${e.subject}_${e.gv}_${e.task}_${e.class}`;
                    if(!scheduledCounts[key]) scheduledCounts[key] = 0;
                    scheduledCounts[key]++;
                }
            });

            // TÁI TẠO KHO SỰ KIỆN TỪ TẤT CẢ CÁC KHÓA
            managedClasses.forEach(cls => {
                for (let subId in assignmentsData) {
                    const subAsg = assignmentsData[subId];
                    if (subAsg[cls] && subAsg[cls].allocations) {
                        
                        if (subAsg[cls].status === 'proposed') continue;

                        const semester = subAsg[cls].semester || 'Chưa xác định';
                        if (selectedSemester !== 'ALL' && semester !== selectedSemester) continue; 
                        const subName = subjectsData.find(s => s.id === subId)?.name || 'Môn không xác định';
                        
                        subAsg[cls].allocations.forEach(a => {
                            const totalAssigned = parseInt(a.assigned) || 0;
                            const keyForCount = `${subName}_${a.gv}_${a.task}_${cls}`;
                            const alreadyScheduled = scheduledCounts[keyForCount] || 0;
                            
                            let rejectedCardsOfThisTask = scheduledEvents.filter(e => e.class === cls && e.status === 'returned' && e.subject === subName && e.gv === a.gv && e.task === a.task);

                            let remaining = totalAssigned - alreadyScheduled;
                            let remainingNormal = remaining - rejectedCardsOfThisTask.length; 
                            
                            const renderCard = (isRejected, rTask = null) => {
                                unscheduledCount++;
                                const eventDiv = document.createElement('div');
                                eventDiv.className = `fc-event ${cls} ${isRejected ? 'rejected-task' : ''}`;
                                
                                eventDiv.setAttribute('data-id', keyForCount); 
                                eventDiv.setAttribute('data-title', a.gv); 
                                eventDiv.setAttribute('data-subject', subName);
                                eventDiv.setAttribute('data-gv', a.gv);
                                eventDiv.setAttribute('data-task', a.task);
                                eventDiv.setAttribute('data-class', cls);
                                
                                if (isRejected && rTask) {
                                    eventDiv.setAttribute('data-original-id', rTask.id); 
                                }

                                let classTag = cls === 'THS2025' ? '<span class="class-tag THS2025">Khóa 25</span>' : '<span class="class-tag THS2026">Khóa 26</span>';

                                let rejectHtml = '';
                                if (isRejected && rTask) {
                                    const rejectTimes = rTask.rejected || 1;
                                    rejectHtml = `<span class="reject-badge"><i class="fas fa-exclamation-circle"></i> Bị từ chối (${rejectTimes} lần)</span>`;
                                }

                                eventDiv.innerHTML = `
                                    ${classTag}
                                    <div class="event-gv">${a.gv}</div>
                                    <span class="event-info">[${a.task}]<br>${subName}</span>
                                    ${rejectHtml}
                                `;
                                
                                if (isRejected) {
                                    poolDiv.prepend(eventDiv);
                                } else {
                                    poolDiv.appendChild(eventDiv);
                                }
                            };

                            if (remainingNormal > 0) {
                                for(let i=0; i<remainingNormal; i++) {
                                    renderCard(false);
                                }
                            }

                            rejectedCardsOfThisTask.forEach(rTask => {
                                renderCard(true, rTask);
                            });

                        });
                    }
                }
            });

            const extEventsPanel = document.getElementById('external-events');
            const btnToggle = document.getElementById('btnToggleSidebar');

            if (isCalendarAdmin) {
                btnToggle.classList.remove('hidden'); 
                if (unscheduledCount === 0) {
                    extEventsPanel.style.display = 'none';
                } else {
                    if (!extEventsPanel.hasAttribute('data-manually-hidden')) {
                        extEventsPanel.style.display = 'flex';
                    }
                }
            } else {
                extEventsPanel.style.display = 'none';
                btnToggle.classList.add('hidden');
            }
            setTimeout(() => { calendar.updateSize(); }, 50);
        };

        window.deleteEvent = async () => {
            if(!currentClickedEventId) return;
            if(confirm("Bạn có chắc muốn xóa sự kiện này khỏi lịch? (Sự kiện sẽ được trả về kho)")) {
                try {
                    await deleteDoc(doc(db, "calendar_events", currentClickedEventId));
                    showToast("Đã xóa khỏi lịch!");
                    document.getElementById('eventModal').classList.add('hidden');
                } catch(e) {
                    showToast("Lỗi xóa: " + e.message, "danger");
                }
            }
        };

    </script>
</body>
