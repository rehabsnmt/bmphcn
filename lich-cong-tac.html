    <style>
        /* APP LAYOUT: Mở khóa cuộn, mở rộng tối đa màn hình */
        html, body { min-height: 100vh; margin: 0; padding: 0; display: flex; flex-direction: column; background: var(--bg-page); }
        #header-placeholder { flex-shrink: 0; }
        #footer-placeholder { display: none; }

        /* Thanh công cụ gọn nhẹ trên cùng (Ghim cố định khi cuộn) */
        .top-toolbar { position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; padding: 10px 2%; background: var(--surface); border-bottom: 1px solid var(--border); margin-bottom: 15px; box-shadow: var(--shadow-sm); }
        .top-toolbar h2 { margin: 0; font-size: 1.25rem; color: var(--text-dark); display: flex; align-items: center; gap: 8px; font-weight: 700; }
        .top-toolbar .subtitle { font-size: 0.85rem; color: var(--text-body); font-weight: 600; margin-top: 2px; }
        
        .controls-wrapper { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .tabs-header { display: flex; gap: 6px; }
        .tab-btn { padding: 6px 15px; font-size: 0.95rem; font-weight: 600; color: var(--text-body); background: var(--bg-page); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .tab-btn:hover { background: #e2e8f0; color: var(--text-dark); }
        .tab-btn.active { color: white; background: var(--primary); border-color: var(--primary); }
        .filter-select { padding: 6px 12px; font-size: 0.95rem; font-weight: 600; border-radius: 6px; border: 1px solid var(--border); outline: none; cursor: pointer; color: var(--text-dark); }
        .btn-toggle { background: white; color: var(--primary); border: 1px solid var(--primary); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; font-size: 0.9rem;}
        .btn-toggle:hover { background: var(--primary-light); }

        /* Khu vực Lịch & Kho */
        main { flex: 1; max-width: 100%; width: 100%; padding: 0 1% 30px 1%; display: flex; gap: 15px; box-sizing: border-box; align-items: flex-start; }

        /* Khung bên trái (Kho Sự Kiện) - Sticky để trượt theo trang */
        #external-events { position: sticky; top: 80px; width: 280px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 15px; box-shadow: var(--shadow-sm); flex-shrink: 0; display: none; flex-direction: column; max-height: calc(100vh - 100px); transition: 0.3s; }
        #external-events h4 { margin: 0 0 10px 0; color: var(--primary); border-bottom: 1px dashed var(--border); padding-bottom: 10px; font-size: 1.05rem; flex-shrink: 0; }
        
        #event-pool { flex: 1; overflow-y: auto; padding-right: 5px; } 
        #event-pool .fc-event { cursor: move; margin: 0 0 12px 0; padding: 12px; background-color: #f1f5f9; color: var(--text-dark); border: 1px solid var(--border); border-radius: 6px; text-align: left; transition: 0.2s; }
        #event-pool .fc-event:hover { background-color: #e2e8f0; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-color: #94a3b8; }
        #event-pool .event-gv { font-weight: 700; font-size: 1rem; margin-bottom: 4px; color: var(--primary); }
        #event-pool .event-info { display: block; font-size: 0.85rem; color: var(--text-body); line-height: 1.4; }

        /* Khung Lịch */
        #calendar-container { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 15px; box-shadow: var(--shadow-sm); min-width: 0; transition: 0.3s; }
        
        .fc-toolbar-title { font-size: 1.3rem !important; color: var(--primary); font-weight: bold; text-transform: capitalize; }
        .fc-button-primary { background-color: var(--primary) !important; border-color: var(--primary) !important; text-transform: capitalize; font-weight: 600 !important; padding: 6px 15px !important; font-size: 0.95rem !important;}
        .fc-button-primary:hover { background-color: var(--primary-hover) !important; }
        .fc-button-active { background-color: var(--primary-hover) !important; }

        /* Style cho Sự kiện TRÊN LỊCH */
        .fc-event-main { display: flex; flex-direction: column; height: 100%; padding: 4px 8px; box-sizing: border-box; }
        .event-on-calendar { overflow: hidden; color: white; display: flex; flex-direction: column; gap: 3px; height: 100%; }
        .event-on-calendar .evt-time { font-size: 0.85rem; font-weight: 600; background: rgba(0,0,0,0.25); padding: 2px 8px; border-radius: 4px; width: fit-content; margin-bottom: 4px; }
        .event-on-calendar .evt-gv { font-size: 1.05rem; font-weight: 700; line-height: 1.2; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); white-space: normal; }
        .event-on-calendar .evt-sub { font-size: 0.85rem; font-weight: 400; opacity: 0.95; line-height: 1.3; white-space: normal; }

        .hidden { display: none !important; }

        /* Tooltip Rà chuột - Chuẩn xác theo tọa độ */
        #eventTooltip { position: fixed; z-index: 9999; background: rgba(15, 23, 42, 0.95); color: white; padding: 12px 15px; border-radius: 8px; font-size: 0.9rem; pointer-events: none; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.3); line-height: 1.6; max-width: 320px; border-left: 4px solid var(--primary); }
        #eventTooltip strong { color: #38bdf8; font-size: 1rem; }
        #eventTooltip .tooltip-scheduler { color: #fef08a; font-weight: bold; display: block; margin-top: 5px; border-top: 1px dashed rgba(255,255,255,0.2); padding-top: 5px; }

        /* Toast */
        .toast-container { position: fixed; top: 80px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { min-width: 250px; background-color: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 12px; transform: translateX(120%); transition: 0.4s; font-weight: 600; border-left: 5px solid #22c55e; opacity: 0; }
        .toast.show { transform: translateX(0); opacity: 1; }
        .toast.danger { border-left-color: #ef4444; }

        /* Modal Chi tiết */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: white; width: 450px; border-radius: 8px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); overflow: hidden; }
        .modal-header { padding: 15px 20px; background: var(--primary); color: white; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { margin: 0; font-size: 1.1rem; }
        .modal-body { padding: 20px; line-height: 1.8; text-align: justify; }
        .modal-footer { padding: 15px 20px; background: #f1f5f9; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--border); }
        .btn-danger { background: var(--accent); color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s;}
        .btn-danger:hover { background: #be123c; }
        .btn-secondary { background: white; color: var(--text-dark); border: 1px solid var(--border); padding: 8px 15px; border-radius: 4px; cursor: pointer; transition: 0.2s; font-weight: 600; }
        .btn-secondary:hover { background: #e2e8f0; }

        @media (max-width: 900px) {
            main { flex-direction: column; }
            #external-events { position: relative; width: 100%; top: 0; max-height: 350px; }
            .top-toolbar { flex-direction: column; gap: 10px; align-items: stretch; }
        }
    </style>
</head>
<body>

    <!-- THANH CÔNG CỤ COMPACT TRÊN CÙNG -->

            {"id": "sub_12", "name": "Rối loạn nuốt"}, {"id": "sub_13", "name": "Rối loạn vận động tạo lời nói và nói lắp"}, {"id": "sub_14", "name": "Những rối loạn giao tiếp & nhận thức có nguồn gốc thần kinh"}, {"id": "sub_15", "name": "Những rối loạn phát sinh từ khiếm khuyết/Phẫu thuật vùng đầu và cổ"}, {"id": "sub_16", "name": "Khuyết tật giao tiếp suốt đời và giao tiếp tăng cường và thay thế"}, {"id": "sub_17", "name": "Thính lực học và PHCN thính giác"}, {"id": "sub_18", "name": "Quản lý ca bệnh phức tạp"}, {"id": "sub_19", "name": "Thực hành lâm sàng cho rối loạn giọng"}, {"id": "sub_20", "name": "Thực hành lâm sàng cho vấn đề rối loạn ngôn ngữ có nguồn gốc thần kinh"}, {"id": "sub_21", "name": "Thực hành lâm sàng cho người khuyết tật suốt đời"}, {"id": "sub_22", "name": "Thực hành lâm sàng cho trẻ em có rối loạn giao tiếp và nuốt"}, {"id": "sub_23", "name": "Thực hành lâm sàng ca bệnh phức tạp ở người lớn và trẻ em"},
            {"id": "sub_24", "name": "Vật lý trị liệu Nhi nâng cao"}, {"id": "sub_25", "name": "Vật lý trị liệu Thần kinh cơ nâng cao"}, {"id": "sub_26", "name": "Vật lý trị liệu Cơ xương nâng cao"}, {"id": "sub_27", "name": "Vật lý trị liệu Tim mạch – Hô hấp nâng cao"}, {"id": "sub_28", "name": "Vật lý trị liệu trong thể thao"}, {"id": "sub_29", "name": "Ứng dụng công thái học trong can thiệp Vật lý trị liệu"}, {"id": "sub_30", "name": "Thực hành lâm sàng Vật lý trị liệu nâng cao 1"}, {"id": "sub_31", "name": "Thực hành lâm sàng Vật lý trị liệu nâng cao 2"},
            {"id": "sub_32", "name": "Những vấn đề chuyên môn trong Hoạt động trị liệu"}, {"id": "sub_33", "name": "Lãnh đạo và quản lý trong Hoạt động trị liệu"}, {"id": "sub_34", "name": "Thiết kế và đánh giá chương trình Hoạt động trị liệu"}, {"id": "sub_35", "name": "Hoạt động trị liệu và quản lý chấn thương"}, {"id": "sub_36", "name": "Hoạt động trị liệu trong thực hành sức khỏe tâm thần trong suốt quá trình phát triển"}, {"id": "sub_37", "name": "Hoạt động trị liệu trong lão khoa"}, {"id": "sub_38", "name": "Thực hành hoạt động trị liệu 1"}, {"id": "sub_39", "name": "Thực hành hoạt động trị liệu 2"}, {"id": "sub_40", "name": "Thực hành hoạt động trị liệu 3"},
            {"id": "sub_41", "name": "Thực hành lâm sàng Kỹ thuật Phục hồi chức năng 1"}, {"id": "sub_42", "name": "Thực hành lâm sàng Kỹ thuật Phục hồi chức năng 2"}, {"id": "sub_43", "name": "Thực hành lâm sàng Kỹ thuật Phục hồi chức năng 3"},
            {"id": "sub_44", "name": "Đề án tốt nghiệp"}, {"id": "sub_45", "name": "Chuyên đề nâng cao trong Phục hồi chức năng 1"}, {"id": "sub_46", "name": "Chuyên đề nâng cao trong Phục hồi chức năng 2"}, {"id": "sub_47", "name": "Chuyên đề nâng cao trong Phục hồi chức năng 3"}, {"id": "sub_48", "name": "Chuyên đề nâng cao trong Phục hồi chức năng 4"}, {"id": "sub_49", "name": "Luận văn"}
        ];

        let calendar;
        let isCalendarAdmin = false;
        let currentUserEmail = '';
        let currentUserName = '';
        
        let currentClass = 'THS2025';
        let assignmentsData = {};
        let scheduledEvents = [];
        let currentClickedEventId = null;

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3000);
        }

        // ẨN/HIỆN KHO SỰ KIỆN
        window.toggleSidebar = () => {
            const panel = document.getElementById('external-events');
            if (panel.style.display === 'none') {
                panel.style.display = 'flex';
                panel.removeAttribute('data-manually-hidden');
            } else {
                panel.style.display = 'none';
                panel.setAttribute('data-manually-hidden', 'true'); 
            }
            setTimeout(() => { if(calendar) calendar.updateSize(); }, 100);
        };

        // HÀM KIỂM TRA TRÙNG LỊCH 
        function hasOverlap(targetStart, targetEnd, gv, ignoreEventId) {
            if (!targetEnd) targetEnd = new Date(targetStart.getTime() + 4 * 60 * 60 * 1000);
            let allEvents = calendar.getEvents();
            for (let e of allEvents) {
                if (e.id === ignoreEventId) continue; 
                if (e.extendedProps.gv !== gv) continue; 
                let eStart = e.start;
                let eEnd = e.end || new Date(eStart.getTime() + 4 * 60 * 60 * 1000);
                if (targetStart < eEnd && targetEnd > eStart) return true;
            }
            return false;
        }

        // KIỂM TRA ĐĂNG NHẬP VÀ CẤP QUYỀN ADMIN

                currentUserEmail = user.email.toLowerCase();
                const adminEmails = ['lethanhvan@ump.edu.vn', 'phanthenguyenpt@ump.edu.vn', 'thduypt@ump.edu.vn', 'hoangtran1483@gmail.com'];

            window.processAndRenderEvents();

        // KHỞI TẠO LỊCH FULLCALENDAR 
        function initCalendar() {
            const containerEl = document.getElementById('external-events');
            
            if (isCalendarAdmin) {
                new FullCalendar.Draggable(containerEl, {
                    itemSelector: '.fc-event',
                    eventData: function(eventEl) {
                        return {
                            title: eventEl.getAttribute('data-title'), 
                            id: eventEl.getAttribute('data-id'),
                            extendedProps: {
                                subject: eventEl.getAttribute('data-subject'),
                                gv: eventEl.getAttribute('data-gv'),
                                task: eventEl.getAttribute('data-task'),
                                originalId: eventEl.getAttribute('data-id')
                            }
                        };
                    }
                });
            }

            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                locale: 'vi',
                height: 'auto', // Lịch tự động bung chiều cao để hiện toàn bộ thời gian không bị cuộn bên trong
                initialView: 'timeGridWeek', 
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'timeGridWeek,timeGridDay,dayGridMonth'
                },
                slotMinTime: '07:00:00', // Giới hạn giờ hành chính
                slotMaxTime: '21:00:00',
                allDaySlot: false, 
                defaultTimedEventDuration: '04:00:00', // Auto 4 tiếng
                editable: isCalendarAdmin, 
                droppable: isCalendarAdmin, 
                events: [],
                
                // HIỂN THỊ HTML ĐẸP MẮT TRÊN LỊCH
                eventContent: function(arg) {
                    const props = arg.event.extendedProps;
                    
                    let sTime = arg.event.start ? arg.event.start.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'}) : '';
                    let eTime = '';
                    if (arg.event.end) {
                        eTime = arg.event.end.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
                    } else if (arg.event.start) {
                        let eObj = new Date(arg.event.start.getTime() + 4 * 60 * 60 * 1000);
                        eTime = eObj.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
                    }
                    const timeStr = `${sTime} - ${eTime}`;
                    
                    return {
                        html: `
                        <div class="event-on-calendar">
                            <div style="margin-bottom: 2px;">
                                <span class="evt-time">${timeStr}</span>
                            </div>
                            <div class="evt-gv">${props.gv}</div>
                            <div class="evt-sub">${props.subject} (${props.task})</div>
                        </div>
                        `
                    };
                },

                // BẮT SỰ KIỆN THẢ TỪ KHO VÀO LỊCH -> KIỂM TRA TRÙNG LỊCH & LƯU
                eventReceive: async function(info) {
                    if (!isCalendarAdmin) { info.revert(); return; }
                    
                    const props = info.event.extendedProps;
                    const newUniqueId = props.originalId + '_' + Date.now();
                    info.event.setProp('id', newUniqueId); 
                    
                    if (hasOverlap(info.event.start, info.event.end, props.gv, newUniqueId)) {
                        showToast(`Lỗi: Giảng viên ${props.gv} đã có lịch trong khung giờ này!`, "danger");
                        info.revert();
                        return;
                    }

                    const eventData = {
                        id: newUniqueId, 
                        title: info.event.title,
                        start: info.event.startStr,
                        end: info.event.endStr || null,
                        allDay: info.event.allDay,
                        class: currentClass,
                        subject: props.subject,
                        gv: props.gv,
                        task: props.task,
                        scheduledByEmail: currentUserEmail,
                        scheduledByName: currentUserName
                    };
                    
                    try {
                        await setDoc(doc(db, "calendar_events", eventData.id), eventData);
                        showToast("Đã xếp lịch thành công!");
                        info.event.remove(); 
                    } catch(e) {
                        showToast("Lỗi khi lưu lịch: " + e.message, "danger");
                        info.revert(); 
                    }
                },

                eventDrop: async function(info) {
                    if (!isCalendarAdmin) { info.revert(); return; }
                    
                    const props = info.event.extendedProps;
                    if (hasOverlap(info.event.start, info.event.end, props.gv, info.event.id)) {
                        showToast(`Lỗi: Khung giờ mới bị trùng với lịch khác của GV này!`, "danger");
                        info.revert();
                        return;
                    }

                    try {
                        await setDoc(doc(db, "calendar_events", info.event.id), { 
                            start: info.event.startStr,
                            end: info.event.endStr || null,
                            allDay: info.event.allDay
                        }, { merge: true });
                        showToast("Đã dời lịch thành công!");
                    } catch(e) {
                        showToast("Lỗi dời lịch!", "danger");
                        info.revert();
                    }
                },

                eventResize: async function(info) {
                    if (!isCalendarAdmin) { info.revert(); return; }
                    
                    const props = info.event.extendedProps;
                    if (hasOverlap(info.event.start, info.event.end, props.gv, info.event.id)) {
                        showToast(`Lỗi: Khung giờ kéo giãn bị trùng lịch khác!`, "danger");
                        info.revert();
                        return;
                    }

                    try {
                        await setDoc(doc(db, "calendar_events", info.event.id), { 
                            start: info.event.startStr,
                            end: info.event.endStr 
                        }, { merge: true });
                        showToast("Đã cập nhật thời lượng!");
                    } catch(e) {
                        showToast("Lỗi cập nhật thời lượng!", "danger");
                        info.revert();
                    }
                },

                // TÍNH NĂNG HOVER: TOOLTIP - HIỂN THỊ CHUẨN XÁC TẠI CHUỘT
                eventMouseEnter: function(info) {
                    const props = info.event.extendedProps;
                    
                    let sTime = info.event.start ? info.event.start.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'}) : '';
                    let eTime = '';
                    if (info.event.end) {
                        eTime = info.event.end.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
                    } else if (info.event.start) {
                        let eObj = new Date(info.event.start.getTime() + 4 * 60 * 60 * 1000);
                        eTime = eObj.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
                    }
                    const dateStr = info.event.start ? info.event.start.toLocaleDateString('vi-VN', {day:'2-digit', month:'2-digit', year:'numeric'}) : '';
                    const timeString = `${sTime} - ${eTime} (${dateStr})`;
                    
                    const tooltip = document.getElementById('eventTooltip');
                    tooltip.innerHTML = `
                        <strong><i class="fas fa-book"></i> ${props.subject}</strong><br>
                        Nhiệm vụ: ${props.task}<br>
                        Giảng viên: ${props.gv}<br>
                        Thời gian: ${timeString}<br>
                        <span class="tooltip-scheduler"><i class="fas fa-user-edit"></i> Xếp bởi: ${props.scheduledByName || 'Admin'}</span>
                    `;
                    tooltip.style.display = 'block';
                    
                    const moveTooltip = (e) => {
                        let x = e.clientX + 15;
                        let y = e.clientY + 15;
                        
                        // Chống tràn màn hình
                        const rect = tooltip.getBoundingClientRect();
                        if (x + rect.width > window.innerWidth) x = e.clientX - rect.width - 15;
                        if (y + rect.height > window.innerHeight) y = e.clientY - rect.height - 15;
                        
                        tooltip.style.left = x + 'px';
                        tooltip.style.top = y + 'px';
                    };
                    
                    moveTooltip(info.jsEvent);
                    
                    info.el.addEventListener('mousemove', moveTooltip);
                    info.el._moveTooltip = moveTooltip; 
                },
                eventMouseLeave: function(info) {
                    const tooltip = document.getElementById('eventTooltip');
                    tooltip.style.display = 'none';
                    if (info.el._moveTooltip) {
                        info.el.removeEventListener('mousemove', info.el._moveTooltip);
                    }
                },

                eventClick: function(info) {
                    currentClickedEventId = info.event.id;
                    const props = info.event.extendedProps;
                    
                    document.getElementById('mdlSubject').innerText = props.subject || '';
                    document.getElementById('mdlGv').innerText = props.gv || '';
                    document.getElementById('mdlTask').innerText = props.task || '';
                    document.getElementById('mdlScheduler').innerText = props.scheduledByName || 'Không xác định';
                    
                    let sTime = info.event.start ? info.event.start.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'}) : '';
                    let eTime = '';
                    if (info.event.end) {
                        eTime = info.event.end.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
                    } else if (info.event.start) {
                        let eObj = new Date(info.event.start.getTime() + 4 * 60 * 60 * 1000);
                        eTime = eObj.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
                    }
                    const dateStr = info.event.start ? info.event.start.toLocaleDateString('vi-VN', {weekday: 'long', day:'2-digit', month:'2-digit', year:'numeric'}) : '';
                    
                    document.getElementById('mdlTime').innerText = `${sTime} - ${eTime} (${dateStr})`;

                    if (isCalendarAdmin && props.scheduledByEmail === currentUserEmail) {
                        document.getElementById('btnDeleteEvent').classList.remove('hidden');
                    } else {
                        document.getElementById('btnDeleteEvent').classList.add('hidden');
                    }
                    
                    document.getElementById('eventModal').classList.remove('hidden');
                }
            });
            calendar.render();
        }

        function listenToDatabase() {
            onSnapshot(collection(db, "assignments"), (snapshot) => {
                assignmentsData = {};
                snapshot.forEach(doc => { assignmentsData[doc.id] = doc.data(); });
                window.processAndRenderEvents();
            });

            onSnapshot(collection(db, "calendar_events"), (snapshot) => {
                scheduledEvents = [];
                snapshot.forEach(doc => { scheduledEvents.push(doc.data()); });
                window.processAndRenderEvents();
            });
        }

        window.processAndRenderEvents = () => {
            if (!calendar) return;

            const selectedSemester = document.getElementById('semesterSelect').value;

            calendar.removeAllEvents();
            const poolDiv = document.getElementById('event-pool');
            poolDiv.innerHTML = '';

            let unscheduledCount = 0;

            let currentClassEvents = scheduledEvents.filter(e => e.class === currentClass).map(e => {
                const isMyEvent = e.gv && currentUserName && e.gv.includes(currentUserName);
                return {
                    ...e,
                    backgroundColor: isMyEvent ? '#ea580c' : '#0284c7', 
                    borderColor: isMyEvent ? '#c2410c' : '#0369a1',
                    textColor: 'white'
                };
            });
            calendar.addEventSource(currentClassEvents);

            let scheduledCounts = {};
            currentClassEvents.forEach(e => {
                const subObj = subjectsData.find(s => s.name === e.subject);
                if(subObj) {
                    const key = `${subObj.id}_${e.gv}_${e.task}`;
                    if(!scheduledCounts[key]) scheduledCounts[key] = 0;
                    scheduledCounts[key]++;
                }
            });

            for (let subId in assignmentsData) {
                const subAsg = assignmentsData[subId];
                if (subAsg[currentClass] && subAsg[currentClass].allocations) {
                    
                    const semester = subAsg[currentClass].semester || 'Chưa xác định';
                    if (selectedSemester !== 'ALL' && semester !== selectedSemester) continue; 

                    const subName = subjectsData.find(s => s.id === subId)?.name || 'Môn không xác định';
                    
                    subAsg[currentClass].allocations.forEach(a => {
                        const totalAssigned = parseInt(a.assigned) || 0;
                        const key = `${subId}_${a.gv}_${a.task}`;
                        const alreadyScheduled = scheduledCounts[key] || 0;
                        
                        let remaining = totalAssigned - alreadyScheduled;
                        
                        if (remaining > 0) {
                            for(let i=0; i<remaining; i++) {
                                unscheduledCount++;
                                const eventDiv = document.createElement('div');
                                eventDiv.className = 'fc-event';
                                eventDiv.setAttribute('data-id', key);
                                eventDiv.setAttribute('data-title', a.gv); 
                                eventDiv.setAttribute('data-subject', subName);
                                eventDiv.setAttribute('data-gv', a.gv);
                                eventDiv.setAttribute('data-task', a.task);
                                
                                eventDiv.innerHTML = `
                                    <div class="event-gv">${a.gv}</div>
                                    <span class="event-info">[${a.task}]<br>${subName}</span>
                                `;
                                poolDiv.appendChild(eventDiv);
                            }
                        }
                    });
                }
            }

            const extEventsPanel = document.getElementById('external-events');
            const btnToggle = document.getElementById('btnToggleSidebar');

            if (isCalendarAdmin) {
                btnToggle.classList.remove('hidden'); 
                
                if (unscheduledCount === 0) {
                    extEventsPanel.style.display = 'none';
                } else {
                    if (!extEventsPanel.hasAttribute('data-manually-hidden')) {
                        extEventsPanel.style.display = 'flex';
                    }
                }
            } else {
                extEventsPanel.style.display = 'none';
                btnToggle.classList.add('hidden');
            }
            
            setTimeout(() => { calendar.updateSize(); }, 50);
        };

        window.closeModal = () => {
            document.getElementById('eventModal').classList.add('hidden');
        };

        window.deleteEvent = async () => {
            if(!currentClickedEventId) return;
            if(confirm("Bạn có chắc muốn xóa sự kiện này khỏi lịch? (Sự kiện sẽ được trả về kho)")) {
                try {
                    await deleteDoc(doc(db, "calendar_events", currentClickedEventId));
                    showToast("Đã xóa khỏi lịch!");
                    closeModal();
                } catch(e) {
                    showToast("Lỗi xóa: " + e.message, "danger");
                }
            }
        };

    </script>
</body>
</html>
